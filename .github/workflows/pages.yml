# Publishes the committed pages to GitHub Pages: the landing page at the
# root, every built map and environment under web/, and the generated
# wiki. Everything served is already verified in-repo (verify_all.sh) -
# the workflow deploys, it does not build, so Pages can never show a page
# the suite has not seen.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # The site's own health, reported on its own. This used to live inside the
  # deploy job, which meant a repository SETTING nobody had flipped showed up
  # as a red X over work that was entirely sound: 76 runs where checkout,
  # assembly and the link check all passed and the summary said "failure".
  # A signal that is red for a reason outside the diff teaches people to stop
  # reading it.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site and check every local link
        run: bash .github/assemble_site.sh

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from committed, verified pages
        run: bash .github/assemble_site.sh
      # Pages has to be switched on for this repository ONCE, by a human with
      # admin, at:
      #
      #   https://github.com/AGIFutureFoundation/SmartCiti.X/settings/pages
      #   -> Build and deployment -> Source -> GitHub Actions
      #
      # Runs 1-76 all died at configure-pages with "Get Pages site failed ...
      # Error: Not Found". `enablement: true` was added to try to have the
      # action create the site itself; run 62 proved that cannot work with the
      # default token:
      #
      #   Create Pages site failed. Error: Resource not accessible by
      #                                    integration
      #
      # `permissions: pages: write` lets GITHUB_TOKEN DEPLOY to a Pages site
      # that EXISTS; it does not let it CREATE one. Creating needs admin rights
      # the workflow token does not carry, whoever owns the repo. (This repo is
      # public, so there is no plan or billing blocker - only the setting.)
      #
      # continue-on-error is not the workflow giving up. The step below turns
      # the failure into a written remedy, so the run says what to do instead
      # of only that something went wrong.
      - id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Say plainly what is blocking, and where the switch is
        if: steps.cfg.outcome == 'failure'
        run: |
          {
            echo '## GitHub Pages is not switched on for this repository'
            echo
            echo 'The site is built and sound - checkout, assembly and the'
            echo 'link check all passed. The only thing missing is a setting'
            echo 'that the Actions token is not allowed to change.'
            echo
            echo '**One click, by someone with admin on this repository:**'
            echo
            echo '[Settings -> Pages](https://github.com/'"$GITHUB_REPOSITORY"'/settings/pages)'
            echo ' -> Build and deployment -> Source -> **GitHub Actions**'
            echo
            echo 'Then re-run this workflow. Nothing in the repository needs'
            echo 'to change; this workflow deploys committed, verified pages'
            echo 'and builds nothing.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Pages is off::Enable it at Settings -> Pages -> Source -> GitHub Actions, then re-run."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
