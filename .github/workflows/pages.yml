# Publishes the committed pages to GitHub Pages: the landing page at the
# root, every built map and environment under web/, and the generated
# wiki. Everything served is already verified in-repo (verify_all.sh) -
# the workflow deploys, it does not build, so Pages can never show a page
# the suite has not seen.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site from committed, verified pages
        run: |
          mkdir -p _site/web/vendor _site/console
          cp index.html _site/
          cp web/*.html _site/web/
          cp -r web/vendor/. _site/web/vendor/
          cp console/trade_craft_console.html _site/console/
          cp -r wiki _site/wiki
          # The hub links nine surfaces and the dashboard and the 2D map
          # each link the wiki. A deploy that ships a page the hub links to
          # a 404 is a deploy that looks fine and is not, so the link set is
          # checked here rather than discovered by a visitor: every local
          # href in the assembled site must resolve to a file in it.
          python3 - <<'PY'
          import pathlib, re, sys, urllib.parse
          site = pathlib.Path('_site')
          # A page's markup is what a visitor follows. The script bodies also
          # contain href=" strings, but those are template literals a
          # renderer fills at runtime ('${esc(s.source_url)}'), so they are
          # cut out first rather than reported as broken files that were
          # never meant to be files.
          SCRIPT = re.compile(r'<script\b.*?</script>', re.S | re.I)
          bad = []
          for page in site.rglob('*.html'):
              html = SCRIPT.sub(' ', page.read_text(errors='ignore'))
              for href in re.findall(r'(?:href|src)="([^"]+)"', html):
                  if href.startswith(('http://', 'https://', 'data:', '#', 'mailto:')):
                      continue
                  if '${' in href or '{{' in href:   # an unfilled template slot
                      continue
                  target = (page.parent / urllib.parse.urlparse(href).path).resolve()
                  if not target.exists():
                      bad.append(f'{page.relative_to(site)} -> {href}')
          if bad:
              print('broken links in the assembled site:')
              for b in sorted(set(bad)):
                  print('  ' + b)
              sys.exit(1)
          print(f'link check: every local link in {len(list(site.rglob("*.html")))} '
                'assembled pages resolves')
          PY
      # Pages has to be switched on for this repository ONCE, by a human
      # with admin, at Settings -> Pages -> Build and deployment ->
      # Source -> GitHub Actions. Until that happens this workflow cannot
      # deploy, and it is the only thing standing between a green run and
      # a live site.
      #
      # Runs 1-61 all died here with:
      #   Get Pages site failed. Please verify that the repository has
      #   Pages enabled and configured to build using GitHub Actions
      #   Error: Not Found
      #
      # `enablement: true` was added to try to have the action create the
      # site itself. Run 62 proves that cannot work with the default
      # token:
      #   Get Pages site failed.    Error: Not Found
      #   Create Pages site failed. Error: Resource not accessible by
      #                                    integration
      # `permissions: pages: write` lets GITHUB_TOKEN DEPLOY to an
      # existing Pages site; it does not let it CREATE one. That needs
      # admin rights the workflow token does not carry, whoever owns the
      # repo. (This repo is public, so there is no plan or billing
      # blocker - only the setting.)
      #
      # The flag is kept because it costs nothing: once the site exists,
      # the Get call succeeds and enablement is a no-op, and it would
      # work if this workflow were ever given an admin token. Checkout,
      # assembly and the link check below have always passed - the site
      # is ready, the switch is off.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
