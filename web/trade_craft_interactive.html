<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCiti.X : Trade Craft Academy — interactive campus map</title>
<style>
:root{
  --plate:#12181B; --panel:#182023; --sunk:#0C1113; --ink:#E8EDEC; --muted:#93A3A6;
  --rule:#28353A; --mark:#E8A33D; --mark-ink:#12181B; --steel:#41C4D4;
  --good:#5CB584; --warn:#E8A33D; --crit:#E07C68;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plate);color:var(--ink);
  font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
header{padding:30px 0 10px;border-bottom:3px solid var(--mark);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px}
header h1{font:700 30px/1.1 "Barlow Condensed",system-ui,sans-serif;margin:0}
header h1 .x{color:var(--mark)}
header .attr{color:var(--muted);font-size:13px}
.figs{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;color:var(--muted);font-size:13px}
.figs b{color:var(--mark);font:600 17px "Barlow Condensed",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.bar .lbl{color:var(--muted);font-size:13px;margin-inline-end:2px}
.tgl{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--rule);border-radius:999px;padding:6px 13px;cursor:pointer;
  font-size:13px;user-select:none}
.tgl input{accent-color:var(--mark);margin:0}
select{background:var(--panel);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:6px 10px;font:inherit;margin-inline-start:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:2px 0 14px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.campus{display:flex;flex-direction:column;gap:26px}
.campushdr{font:600 22px "Barlow Condensed",sans-serif;margin:0 0 10px;
  border-bottom:2px solid var(--mark);padding-bottom:6px;
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.campushdr em{color:var(--muted);font:400 13px "IBM Plex Sans",sans-serif}
.campusbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:18px}
@media(max-width:480px){.campus{grid-template-columns:1fr}}
.district{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.district h2{font:600 19px "Barlow Condensed",sans-serif;margin:0;
  border-inline-start:4px solid;padding-inline-start:10px}
.district .tag{color:var(--muted);font-size:12.5px;margin:3px 0 10px;padding-inline-start:14px}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.hall{position:relative;background:var(--sunk);border:1px solid var(--rule);border-radius:7px;
  padding:8px 9px 7px;cursor:pointer;text-align:start;color:var(--ink);font:inherit;
  display:flex;flex-direction:column;gap:5px;min-height:58px}
.hall:hover{border-color:var(--mark)}
.hall .nm{font-size:12px;line-height:1.25;font-weight:600}
.hall .stbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--rule)}
.hall .stbar i{display:block;height:100%}
.hall .badge{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--mark);
  color:var(--mark-ink);font:700 10.5px/1 "IBM Plex Mono",monospace;border-radius:999px;
  padding:4px 6px;display:none}
body.L-stations .hall .badge{display:block}
body:not(.L-modules) .hall .stbar{display:none}
body.L-districts .hall{border-inline-start-width:4px}
/* detail panel */
#ov{position:fixed;inset:0;background:rgba(6,10,12,.72);display:none;z-index:9}
#panel{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(560px,100%);
  background:var(--panel);border-inline-start:1px solid var(--rule);z-index:10;
  transform:translateX(105%);transition:transform .22s ease;overflow-y:auto;
  padding:20px 22px 40px}
html[dir="rtl"] #panel{transform:translateX(-105%)}
body.open #ov{display:block}
body.open #panel{transform:none}
#panel h2{font:600 24px "Barlow Condensed",sans-serif;margin:2px 0 2px}
#panel .focus{color:var(--muted);margin:0 0 10px}
#panel .chip{display:inline-block;border:1px solid var(--rule);border-radius:999px;
  padding:2px 10px;font-size:12px;color:var(--muted);margin:0 4px 10px 0}
#panel h3{font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.04em;
  text-transform:uppercase;color:var(--steel);margin:20px 0 8px}
#close{position:absolute;top:12px;inset-inline-end:14px;background:none;border:1px solid var(--rule);
  color:var(--muted);border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit}
.cbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--rule);margin:4px 0 6px}
.cbar i{display:block;height:100%}
.ckey{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
svg text{font-family:"IBM Plex Mono",monospace}
.stn{border:1px solid var(--rule);border-radius:8px;margin:8px 0;overflow:hidden}
.stn>button{width:100%;text-align:start;background:var(--sunk);color:var(--ink);
  border:none;padding:9px 12px;cursor:pointer;font:inherit;display:flex;gap:8px;align-items:baseline}
.stn .dot{width:9px;height:9px;border-radius:50%;background:var(--mark);flex:none;align-self:center}
.stn .rm{margin-inline-start:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.stn .body{display:none;padding:10px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.stn.open .body{display:block}
.stn .body ul{margin:6px 0;padding-inline-start:20px;color:var(--muted)}
.stn .q{background:var(--sunk);border-radius:6px;padding:8px 12px;margin-top:8px}
.stn .q .opt{display:block;background:none;border:1px solid var(--rule);color:var(--ink);
  border-radius:5px;padding:5px 9px;margin:5px 0;cursor:pointer;font:inherit;width:100%;text-align:start}
.stn .q .opt.ok{border-color:var(--good);color:var(--good)}
.stn .q .opt.bad{border-color:var(--crit);color:var(--crit)}
.lattice{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:11.5px}
.lattice div{background:var(--sunk);border-radius:4px;padding:4px 7px;color:var(--muted)}
.lattice .hd{background:none;color:var(--steel)}
.lattice .on{color:var(--ink)}
footer{color:var(--muted);font-size:12.5px;margin-top:26px;border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>

عداد الوحدات هي معرّفات قابلة للعنونة مولّدة من هيكل مُؤلَّف، وليست دروساً مكتوبة يدوياً.","honesty.content":"محتوى الدروس ممارسات عامة غير موثّقة، بانتظار تأليفها من حرفيين متمرسين.","honesty.translation":"تبقى أسماء القاعات بالإنجليزية حتى تتوفر ترجمات مراجعة لأسماء الحرف.","map.layers":"الطبقات","map.layer.districts":"الأحياء","map.layer.pipeline":"حالة خط الإنتاج","map.layer.modules":"طبقات الوحدات","map.layer.stations":"محطات التدريب","hall.rooms":"مخطط الطابق","hall.stations":"المحطات في هذه القاعة","hall.skills":"شبكة المهارات","station.checklist":"قائمة التحقق","station.quiz":"اختبار السيناريو","ui.close":"إغلاق","ui.search":"البحث في القاعات","hall.enter3d":"فتح البيئة ثلاثية الأبعاد","hall.flippedUnit":"وحدة مقلوبة","view.campus":"عرض الحرم","ui.walk":"تجوّل","hint.campus":"انقر على قاعة للدخول إليها","hint.walk":"‏WASD للتحرك · Esc للخروج","view.region":"عرض الشبكة","figures.campuses":"{n} فروع","room.finish":"تشطيب الأرضية","geo.note":"الاتجاهات حقيقية؛ المسافات مضغوطة — والملصقات تحمل الكيلومترات الحقيقية","sim.start":"تشغيل المحاكي","sim.results":"النتائج","sim.pass":"ناجح","sim.retry":"حاول مجدداً","sim.sound":"الصوت","sim.view":"العرض","sim.choose":"اختر جهاز محاكاة","sim.operator":"اسأل المشغل","progress.local":"يُحفظ التقدم على هذا الجهاز فقط.","city.note":"طبقة المدينة: أماكن حقيقية قرب الحرم الجامعي (تظهر درجة توثيق كل مكان عند فتحه)؛ الشوارع والجسور والمياه تخطيطية","chapters.hall":"قاعة الفروع الإقليمية","avatar.title":"الصورة الرمزية","landing.nav.mission":"المهمة","landing.nav.how":"كيف يعمل","landing.nav.investors":"المستثمرون","landing.nav.partners":"الشركاء","landing.nav.educators":"المربّون","landing.nav.status":"الحالة","landing.hero.eyebrow":"برنامج تابع لمؤسسة AGI Future Foundation","landing.hero.title":"درّب أصحاب الحرف وكأن <em>القرن القادم</em> يتوقف عليهم.","landing.hero.lede":"لأن الأمر كذلك فعلاً. الأشخاص الذين يمدّون أسلاك الشبكة، ويلحمون أوعية الضغط، ويجهّزون الأحمال، ويشغّلون المصنع، هم من سيبني فعلياً كل ما سيأتي لاحقاً — وهم يُدرَّبون على نموذج صُمِّم للثورة الصناعية الماضية.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy نظام تدريب تكيّفي لـ111 نقابة حرفية: مدينة افتراضية من مواقع العمل حيث تُضبط كل مهمة عند حافة ما تستطيع فعله فعلاً بالفعل، ويشرح كل قرار توجيه نفسه بنفسه، ولا تُصدر بطاقة الاعتماد إلا بعد إثبات العمل دون مساعدة.","landing.facts.halls":"قاعة نقابية، لكل منها مخطط أرضي و100 مستوى","landing.facts.modules":"معرّف وحدة، جرى التحقق من تفرّد كل واحد منها","landing.facts.band":"نطاق النجاح الذي تُضبط عليه كل مهمة","landing.facts.checks":"فحوصات آلية تحكم إصدار كل نسخة","landing.facts.defects":"عيوب في البروتوكول اكتُشفت وأُصلحت قبل أن يراها أي متعلّم","landing.mission.kicker":"المهمة","landing.mission.h2":"العمل الحرفي الماهر ليس خياراً احتياطياً. إنه الأساس.","landing.mission.p1":"منذ جيلين، عومل التدريب الحرفي بوصفه الطريق لمن لم يسلك الطريق الآخر. كان هذا التأطير خاطئاً دائماً، وهو على وشك أن يصبح مكلفاً. مراكز البيانات تحتاج كهربائيين. الكهربة تحتاج عمال خطوط. كل التزام مناخي على الأرض هو وعد بشأن عمال سباكة وحدادين ومعزّلين لا وجود لهم بعد.","landing.mission.p2":"تبني مؤسسة AGI Future Foundation بنية تحتية تعليمية للمصلحة العامة. Trade Craft Academy هي إجابتها عن سؤال محدد: <b>إذا كانت الأنظمة الذكية قادرة الآن على التعليم، فما الذي ينبغي أن تعلّمه أولاً؟</b> إجابتنا هي العمل الذي لا يمكن أتمتته ولا يمكن تعلّمه من فيديو — الحرفة اليدوية الماهرة، تُدرَّس حتى الإتقان، على نطاق لم يبلغه أي نظام تلمذة صناعية من قبل.","landing.mission.h3":"ما نُلزم أنفسنا به","landing.mission.tick1":"<b>لا ملل أبداً، ولا قلق أبداً.</b> تُضبط الصعوبة باستمرار عند حافة القدرة الحالية، لكل مهارة على حدة.","landing.mission.tick2":"<b>كل قرار يشرح نفسه بنفسه.</b> يمكن للمتعلّم أن يسأل عن سبب إسناد أي مهمة إليه ويحصل على السبب الحقيقي، من السجل نفسه الذي يقرأه المدقّق.","landing.mission.tick3":"<b>البطاقة تعني شيئاً حقيقياً.</b> يتطلب الاعتماد عملاً مُثبَتاً دون مساعدة عند مستوى صعوبة البوابة. لا يمكن للمساعدة أن تشتريه.","landing.mission.tick4":"<b>النظام مسؤول أمام البشر.</b> يمكن للمدرّبين تجاوزه، ويمكن للمتعلّمين طلب يوم أسهل، وهو يتوقف عن التكيّف كلياً بدلاً من أن يتكيّف بشكل سيئ.","landing.how.kicker":"كيف يعمل","landing.how.h2":"أداة قياس، لا قائمة تشغيل.","landing.how.p":"معظم التعلّم “التكيّفي” ليس سوى تسلسل ثابت مع مقبض صعوبة مضاف إليه. أما هذا فنظام تحكّم حقيقي: يقدّر ما تستطيع فعله، ويقدّم العمل عند تلك الحافة بالضبط، ويثبت صحة التقدير قبل أن يعتمد أي شيء.","landing.how.dial.h3":"القرص","landing.how.dial.p":"يحوّل ملف الشخصية للمتعلّم القياسَ عن بُعد — الدقة، التردد، طلبات المساعدة، انسيابية التحكّم في المحاكي — إلى تقدير للكفاءة، ويحافظ متحكّم ذو حلقة مغلقة على النجاح المتوقَّع ضمن <span class=\"mono\">0.70&ndash;0.85</span>. فوق هذا النطاق يكون الملل؛ ودونه يكون القلق. كلاهما فشل، وكلاهما يُصحَّح خلال حفنة من المهام.","landing.how.graph.h3":"الرسم البياني","landing.how.graph.p":"المهارات رسم بياني، لا قائمة. الدليل على مهارة واحدة يحرّك متطلباتها المسبقة، وتُبقى الأزواج القابلة للخلط متباعدة، وما تعلّمته في مارس يعود للمراجعة قبل أن تنساه. حين يتعثّر أحدهم، يشخّص النظام <em>أي متطلب مسبق</em> ناقص بدلاً من تكرار المهمة نفسها بصعوبة أكبر.","landing.how.gate.h3":"البوابة","landing.how.gate.p":"يجري التمرين في منتصف النطاق، حيث يحدث التعلّم فعلياً. أما الاعتماد فيجري عند أعلاه، دون مساعدة، والتلميحات مغلقة — تشغيلة تحقّق متعمَّدة، لأن صعوبة التمرين لا يمكنها أبداً إثبات الإتقان. الاعتماد حدث يُمنح ويُسجَّل في سجل لا يُعدَّل، يُضاف إليه فقط.","landing.how.coaches.h3":"المدرّبون","landing.how.coaches.p":"في كل قاعة وكيل مرشد يعرف حرفتها. يوجّهون، ويشرحون، ويصعّدون الأمر إلى مدرّب بشري حين يحدث خطأ ما في الموقع. ما لا يستطيعون فعله هو تغيير صعوبتك أو سجلّك أو اعتمادك — فذلك مفروض في الكود، لا يُطلب بأمر نصّي.","landing.investors.kicker":"للمستثمرين","landing.investors.h2":"بنية تحتية، مُسعَّرة كبنية تحتية.","landing.investors.p1":"الفجوة في القوى العاملة الماهرة ليست أطروحة تسويقية؛ إنها مسألة حسابية. التقاعد يتجاوز معدل الالتحاق بالتلمذة الصناعية في كل اقتصاد صناعي، والقيد الحقيقي على الكهربة وإعادة التصنيع هو البشر، لا رأس المال.","landing.investors.p2":"ما بنيناه هو الجزء الصعب بناؤه: سجل مناهج مُتحقَّق منه، ونظام تحكّم تكيّفي عُيِّر مقابل المحاكاة وصُلِّب ضد الفشل طويل الأمد والفشل العدائي، وطبقة وكلاء تُفرَض خصائصها الأمنية بدلاً من أن تُوعَد فقط، ونموذج أمني مصمَّم لعملاء مؤسسيين متعددي المستأجرين.","landing.investors.p3":"ما لم نبنِه هو عمل تجاري ذو إيرادات. نحن في مرحلة ما قبل الإطلاق وما قبل التجربة الرائدة وما قبل الاعتماد، ونفضّل أن تعرف ذلك هنا بدلاً من أن تكتشفه أثناء العناية الواجبة.","landing.investors.cta1":"اطلب الموجز التقني","landing.investors.cta2":"اطّلع على ما لم يكتمل بعد","landing.investors.panel.h3":"إلى أين يذهب رأس المال","landing.investors.panel.tag":"استخدام الأموال","landing.investors.term.content.dt":"المحتوى","landing.investors.term.content.dd":"محتوى دروس مؤلَّف لـ33 حرفة، راجعه ممارسون بمستوى الصنعة الكاملة (journey-level). أكبر بند منفرد، وهو البند الذي لا يقبل أي اختصار.","landing.investors.term.evidence.dt":"الأدلة","landing.investors.term.evidence.dd":"تقييم بطريقة “stepped-wedge” مع متدرّبين حقيقيين. وإلى أن يُجرى ذلك، تبقى ادعاءات الفعالية لدينا نتائج محاكاة، وسنقول ذلك صراحةً.","landing.investors.term.compliance.dt":"الامتثال","landing.investors.term.compliance.dd":"نافذة مراقبة SOC 2، وتدقيق إمكانية الوصول وتقرير VPAT، ومراجعة قضاء بقضاء قبل أي ادّعاء اعتماد.","landing.investors.term.platform.dt":"المنصة","landing.investors.term.platform.dd":"الهوية، والاستمرارية، والتشفير، والطبقة التشغيلية التي يتطلبها الإطلاق العام.","landing.partners.kicker":"للشركاء الاستراتيجيين","landing.partners.h2":"النقابات، وأصحاب العمل، ومن يملكون مواقع العمل.","landing.partners.p":"هذه المنصة لا تساوي شيئاً من دون الحرف نفسها. نحن لا نحاول استبدال التلمذة الصناعية — نحاول أن نمنحها أدوات قياس، ومدى أوسع، وطريقة لوضع متدرّب في سنته الأولى داخل مكان ضيق، أو لوحة كهربائية حيّة، أو مقصورة رافعة مئة مرة قبل أن يصبح الأمر حقيقياً.","landing.partners.panel.unions.h3":"النقابات الحرفية","landing.partners.panel.unions.tag":"سلطة المنهج","landing.partners.panel.unions.p":"يملك مديرو التدريب لديكم محتوى حرفتكم — المعايير، والتسلسل، والاعتماد النهائي. نحن نوفّر المحرّك، والمحاكي، ومسار الأدلة. تبقى بطاقتكم ملككم؛ نحن لا نصدر شهادات باسمكم ولن نفعل ذلك أبداً.","landing.partners.panel.employers.h3":"أصحاب العمل والمقاولون","landing.partners.panel.employers.tag":"جاهزية الموقع","landing.partners.panel.employers.p":"تدرّبوا على موقع محدّد قبل أن تطأه أي قدم — التوجيه، وشروط التصريح، وجولة المخاطر، والمصنع الفعلي. عمليات التسليم بين الحرف، حيث تبدأ معظم الحوادث، تُمارَس كمهارة مُسمّاة لها تقييمها الخاص.","landing.partners.panel.tech.h3":"الشركاء التقنيون","landing.partners.panel.tech.tag":"قابلية التشغيل البيني","landing.partners.panel.tech.p":"كل شيء يصدر بصيغة xAPI 1.0.3 إلى نظام LRS لديكم. كتالوج الوحدات يُصدَّر بصيغة JSON أو CSV. تسجّل طبقة الوكلاء نفسها على بروتوكولات وكلاء مفتوحة. نفضّل أن نندمج مع نظام السجل الرسمي لديكم على أن نصبح نحن ذلك النظام.","landing.partners.cta":"ابدأ محادثة شراكة","landing.educators.kicker":"للمربّين ومديري التدريب","landing.educators.h2":"أنتم تحتفظون بالحكم. وهو يتكفّل بالسجلّات.","landing.educators.p":"ينبغي لأي نظام تكيّفي أن يجعل المدرّب أقوى، لا زائداً عن الحاجة. نظامنا مبني بحيث تبقى القرارات التي تتطلّب حكماً بشرياً معكم، والقرارات التي تتطلّب ذاكرة معه — من المتعثّر وفي أي شيء، ومن تأخّرت مراجعته، ومن أصبح جاهزاً للاختبار، ومن ظلّ يعتمد بصمت على المساعدة لثلاثة أسابيع.","landing.educators.tick1":"<b>يمكنكم دائماً التجاوز.</b> ثبّتوا أي متعلّم عند أي مستوى. يُسجَّل هذا التجاوز، ويقلّل النظام وزن ذلك الدليل لأنه يعلم أنه لم يعد قياساً نظيفاً.","landing.educators.tick2":"<b>ترون المنطق وراء القرار.</b> كل مهمة تُقدَّم تحمل سبب اختيارها. إذا اختلفتم مع النظام، يمكنكم رؤية ما اعتقده بالضبط ولماذا.","landing.educators.tick3":"<b>يُراقَب الإنصاف، ولا يُدَّعى.</b> تُقارَن النتائج عبر المواقع واللغات وأنواع الأجهزة والفئات العمرية. أي فجوة تتجاوز 10% تفتح بطاقة عمل وتوقف الإصدارات — وضبط إعدادات مجموعة ما بهدوء لجعل الفجوة تختفي أمر يُرصَد هو نفسه.","landing.educators.tick4":"<b>يتوقّف بدلاً من أن يخمّن.</b> إذا انحرفت المعايرة أو كانت مجموعة تعاني، يتوقّف التكيّف ويحصل الجميع على صعوبة ثابتة حتى ينظر إنسان في الأمر.","landing.educators.cta":"اسأل عن مشروع تجريبي","landing.educators.panel.h3":"ما لا يفقده المتعلّم أبداً","landing.educators.panel.tag":"حقوق البيانات","landing.educators.panel.p1":"تُحفَظ سجلّات التدريب تحت اسم مستعار؛ ويعيش الرابط بالشخص الحقيقي في خدمة منفصلة لا يستطيع أي دور دائم قراءتها. المحو يكسر ذلك الرابط، وهذا ما يجعله حقيقياً لا شكلياً فقط.","landing.educators.panel.p2":"إشارات الحالة الشعورية — تقديرات الانسياب والإحباط التي يستخدمها القرص — هي <em>الأكثر</em> حماية من بين البيانات التي نحتفظ بها، لا الأقل. تُحفَظ لمدة 90 يوماً، ولا تُدرَج أبداً في أي تصدير، ولا تكون مرئية أبداً لصاحب عمل.","landing.status.kicker":"الحالة &mdash; منشورة عن قصد","landing.status.h2":"ما تم بناؤه، وما لم يُبنَ، وما لن ندّعيه.","landing.status.p":"تعاني تقنية التعليم من مشكلة مصداقية لأنها تصف النوايا عادة بصيغة الحاضر. إليكم الوضع الفعلي، والجدول نفسه يُرسَل لكل مستثمر وشريك ومؤسسة تسأل.","landing.status.th.area":"المجال","landing.status.th.state":"الحالة","landing.status.th.detail":"التفاصيل","landing.status.row1.area":"نظام التحكم التكيّفي","landing.status.row1.pill":"مبني ومختبر","landing.status.row1.detail":"مُعايَر بالمحاكاة؛ يحافظ على النطاق المستهدف بمعدل أفضل بنحو 6&times; مقارنة بالصعوبة الثابتة أو العشوائية عبر ستة أنماط متعلّمين نموذجية.","landing.status.row2.area":"كتالوج الوحدات","landing.status.row2.pill":"مبني ومُتحقَّق منه","landing.status.row2.detail":"11,000,000 معرّف وحدة مولَّدة من 25,875 عنصراً مؤلَّفاً، وقد أُثبت تفرّد كل واحد منها عبر كامل المجموعة — لا في عيّنة فقط.","landing.status.row3.area":"طبقة أمان الوكلاء","landing.status.row3.pill":"مبني ومختبر","landing.status.row3.detail":"لا يمكن لوكلاء التوجيه كتابة حالة التحكم؛ يُفرَض ذلك على طبقتين مستقلّتين ويُتحقَّق منه في مواجهة وكلاء أُسيء تصرّفهم عمداً.","landing.status.row4.area":"النموذج الأمني","landing.status.row4.pill":"مبني ومختبر","landing.status.row4.detail":"عزل المستأجرين، وصلاحيات مرفوضة افتراضياً، ووصول هوية محدود زمنياً، والاحتفاظ والمحو حسب فئة البيانات.","landing.status.row5.area":"محتوى الدروس","landing.status.row5.pill":"عنصر نائب","landing.status.row5.detail":"<b>رقم 11,000,000 يعدّ معرّفات وحدات قابلة للعنونة، لا دروساً مكتوبة يدوياً.</b> البنية والتسلسل ومنطق التقييم حقيقية ومُتحقَّق منها؛ يُولَّد الكتالوج من 25,875 عنصراً مؤلَّفاً، ونص الدروس بانتظار أن يؤلّفه ممارسون بمستوى الصنعة الكاملة.","landing.status.row6.area":"تصنيف الحرف","landing.status.row6.pill":"تصنيفنا، لا تصنيفهم","landing.status.row6.detail":"القاعات الـ111 هي تصنيفنا نحن للحرف الماهرة. إنها ليست فروعاً نقابية مرخّصة، ولم تراجع أي نقابة هذه القائمة، والتجميع في أحياء هو تجميعنا نحن.","landing.status.row7.area":"أدلة الفعالية","landing.status.row7.pill":"غير مثبتة","landing.status.row7.detail":"كل النتائج حتى الآن هي نتائج محاكاة. لا يُدعَم أي ادّعاء بشأن نتائج التعلّم إلى أن تُجرى تجربة “stepped-wedge” مع متدرّبين حقيقيين.","landing.status.row8.area":"الاعتماد وتأييد النقابة","landing.status.row8.pill":"لا شيء","landing.status.row8.detail":"لا نملك أي اعتماد ولم تؤيّد أي نقابة هذه المنصة. لا شيء هنا يمنح مؤهّلاً معترفاً به.","landing.status.row9.area":"منصة الإنتاج","landing.status.row9.pill":"غير مبنية","landing.status.row9.detail":"المصادقة، والتشفير، والاستمرارية، والنسخ الاحتياطي، والاستجابة للحوادث، كلها مطلوبة قبل الإطلاق العام ولا وجود لها بعد.","landing.status.note":"عُثر على سبعة عشر عيباً في البروتوكول وأُصلحت عبر المحاكاة، واختبارات النقع طويلة الأمد، والاختبار العدائي — بما في ذلك مسار اعتماد لم يكن قادراً فعلياً على اعتماد أي شخص، وحدث واحد مشوَّه كان قادراً على إفساد سجل متعلّم بشكل دائم، وقاعدة تلاشي المساعدة التي كانت محدَّدة، ويُعتقد أنها سارية المفعول، ولم تعمل قط ولو مرة واحدة. تتضمّن القائمة أيضاً ما وجدناه في فحوصاتنا الخاصة، مثل تأكيد تخطيط مبني على ثابت مخمَّن كان خاطئاً بنسبة 43% ونجح رغم فيض أربع تسميات. ننشر القائمة لأن نظاماً لم يجد قط عيباً في نفسه لم ينظر إليها أصلاً.","landing.footer.disclaimer":"<b>يُرجى قراءة هذا الجزء.</b> لا شيء في هذه الصفحة يمثّل مؤهّلاً معترفاً به، أو اعتماداً، أو تأييداً من أي نقابة حرفية أو جهة ترخيص. محتوى التدريب هو ممارسة عامة جيدة ولم يُتحقَّق منه مقابل قانون أي ولاية قضائية. يجب تعلّم العمل الحرج من ناحية السلامة واعتماده من قِبل أشخاص مؤهّلين في مواقع حقيقية.","map.key.live":"مباشر — مؤلَّف، معايَر، قيد التشغيل","map.key.calibrating":"قيد المعايرة — قيد التشغيل، الصعوبة ما زالت تستقر","map.key.schema_ok":"المخطط سليم — البنية صالحة، لم تُعايَر بعد","map.key.draft":"مسودة — لا تُقدَّم لأحد","map.nav.aria":"الواجهات الأخرى","map.nav.3d":"بيئة ثلاثية الأبعاد","map.nav.interactive":"الخريطة التفاعلية","map.nav.geomap":"الخريطة الجغرافية للشبكة","map.nav.dashboard":"لوحة معلومات الشبكة","map.nav.wiki":"الويكي","map.entry_road":"مدخل الشبكة","map.titleblock.title":"مخطط الشبكة · القاعات النقابية","map.titleblock.sheet":"الورقة","map.titleblock.rev":"مراجعة","map.titleblock.halls":"القاعات","map.titleblock.modules":"الوحدات","map.titleblock.issued":"الإصدار","map.titleblock.review":"قيد المراجعة","map.meta.halls":"قاعة نقابية","map.meta.modules":"وحدة على المخطط","map.meta.live":"مباشر","map.meta.sheet":"الورقة","map.footer.p1":"<b>كل رقم على هذا المخطط يُقرأ من سجل الوحدات</b> — أعداد القاعات، وأعداد الوحدات، وحالات خط الإنتاج هي قيم الحزمة نفسها، لا رسوماً توضيحية. الجغرافيا تخطيطية: تُظهر الأشرطة كيفية تجميع القاعات، لا مواقع مساحية فعلية.","map.footer.p2":"<b>التصاميم الداخلية برامج وظيفية، لا مسوحات ميدانية.</b> غرف كل قاعة تأتي من مسارات المهارة الإحدى عشرة التي تعلّمها تلك القاعة فعلياً، ولا تحصل الغرفة على تجهيزات حرفية إلا حين يسمّيها سطر تركيز تلك الحرفة نفسه — تحصل قاعة اللحام على مقصورات وشفط أبخرة لأن مهاراتها تقول ذلك، بينما لا تحصل قاعة ألواح الجبس على ذلك. <b>لم تُجمَع بيانات عنوان لأي قاعة</b>، لذا يحمل كل مخطط كتلة موقع فارغة بدلاً من عنوان شارع مختلَق. تُقرَأ حالة التشغيل التجريبي على كل مخطط من نسبة الوحدات المباشرة في تلك القاعة.","map.footer.p3":"هذا مخطط لقاعات الشبكة مجمَّعة حسب الحي، وليس موقع حرم جامعي واحد — يذكر كل شريط حي الحرم الجامعي المبني الذي ينتمي إليه. لا شيء في هذا المخطط اعتماد أو تأييد نقابي، ومحتوى الدروس ممارسة عامة غير موثَّقة بانتظار أن يؤلّفها ممارسون.","map.detail.no_address":"عنوان الموقع — غير مسجَّل","map.detail.of":"من","map.detail.modules_word":"وحدة","map.detail.fixture":"تجهيز حرفي","map.aria.plan":"مخطط الشبكة: {n} قاعة نقابية مجمَّعة في ثمانية أحياء عبر {c} حرم جامعي مبني","map.aria.floor":"المخطط الأرضي لقاعة {name}: {n} غرفة","map.aria.hall":"{name} — حي {district}، الشبكة {ref}","map.page_title":"مخطط الشبكة"},"districts":{"structural":{"name":"الإنشاءات","tagline":"الفولاذ واللحامات والرفع والأحمال التي تحملها"},"envelope":{"name":"الغلاف والتشطيبات","tagline":"كل ما بين الهيكل والطقس"},"systems":{"name":"أنظمة المباني","tagline":"الطاقة والعمليات والهواء والتحكم والبيانات"},"energy":{"name":"الطاقة والمرافق","tagline":"التوليد والتوزيع والمياه وأعمال الطوارئ"},"earthworks":{"name":"أعمال الحفر والمعدات","tagline":"الأرض والآلات والوصول والنقل"},"industry":{"name":"الصناعات الثقيلة","tagline":"مصانع العمليات والبحرية والمعادن وورش الآلات"},"transport":{"name":"النقل والتنقل","tagline":"السكك والجو والميناء والأسطول"},"control":{"name":"المساحة والسلامة والبيئة","tagline":"حيث يُخطَّط العمل ويُؤمَّن ويُنظَّف"}},"strands":{"safety":"السلامة","layout":"التخطيط","materials":"المواد","tools":"الأدوات","machines":"الآلات","procedure":"الإجراءات","inspection":"الفحص","documentation":"التوثيق","coordination":"التنسيق","troubleshooting":"تشخيص الأعطال","leadership":"القيادة"},"tiers":{"fundamentals":"الأساسيات","applied":"التطبيقي","mastery":"الإتقان"},"states":{"draft":"مسودة","schema_ok":"البنية سليمة","calibrating":"قيد المعايرة","live":"قيد التشغيل"}},"de":{"language":"Deutsch","dir":"ltr","strings":{"tagline":"Spielerisches Training für eine bessere Integration von Robotern und Menschen","overview":"Ein Netz von {halls} gewerkschaftlichen Ausbildungshallen an {campuses} Campus-Standorten, die alle dieselbe adaptive Protokollsuite ausführen: ein Schwierigkeitsregler, der die Zone der nächsten Entwicklung hält, ein Fähigkeitsgraph, der die Übung sequenziert, Prüfungstore, die nur eigenständige Arbeit zertifizieren, und ein Mentorengeflecht, das sein eigenes Gerüst ausblendet.","nav.campus":"Campusplan","nav.spec":"Protokollspezifikation","nav.console":"Adaptive Konsole","nav.roadmap":"Fahrplan","nav.wiki":"Wiki","language.select":"Sprache","figures.halls":"{n} Gewerkschaftshallen","figures.modules":"{n} adressierbare Module","figures.districts":"{n} Bezirke","figures.lessons":"{n} verfasste Lektionspositionen","unit.levels":"Stufen","unit.skills":"Fähigkeiten","map.legend":"Jede Halle ist nach ihrem Bezirk eingefärbt; die Identität trägt ein Drei-Buchstaben-Code.","honesty.taxonomy":"Dies ist eine Taxonomie qualifizierter Gewerke, kein Verzeichnis eingetragener Gewerkschaften. Keine Gewerkschaft hat sie geprüft, und keine Ortsgruppe wird genannt.","honesty.modules":"Modulzahlen sind adressierbare Modul-IDs, erzeugt aus einem verfassten Skelett, keine handgeschriebenen Lektionen.","honesty.content":"Lektionsinhalte sind ungeprüfte allgemeine Praxis und warten auf die Ausarbeitung durch Gesellen und Meister.","honesty.translation":"Hallennamen bleiben auf Englisch, bis geprüfte Übersetzungen der Gewerkenamen vorliegen.","map.layers":"Ebenen","map.layer.districts":"Bezirke","map.layer.pipeline":"Pipeline-Status","map.layer.modules":"Modulebenen","map.layer.stations":"Trainingsstationen","hall.rooms":"Grundriss","hall.stations":"Stationen in dieser Halle","hall.skills":"Fähigkeitsgitter","station.checklist":"Checkliste","station.quiz":"Szenarioprüfung","ui.close":"Schließen","ui.search":"Hallen durchsuchen","hall.enter3d":"3D-Umgebung öffnen","hall.flippedUnit":"Flipped-Unit","view.campus":"Campusansicht","ui.walk":"Begehen","hint.campus":"Halle anklicken, um sie zu betreten","hint.walk":"WASD zum Bewegen · Esc zum Beenden","view.region":"Netzwerkansicht","figures.campuses":"{n} Standorte","room.finish":"Bodenbelag","geo.note":"Echte Peilungen; Entfernungen gestaucht — die Beschriftungen tragen echte km","sim.start":"Simulator starten","sim.results":"Ergebnisse","sim.pass":"Bestanden","sim.retry":"Erneut versuchen","sim.sound":"Ton","sim.view":"Ansicht","sim.choose":"Simulator wählen","sim.operator":"Den Bediener fragen","progress.local":"Der Fortschritt wird nur auf diesem Gerät gespeichert.","city.note":"Stadtebene: reale Orte in der Nähe des Campus (die jeweilige echte Stufe zeigt sich beim Öffnen); Straßen, Brücken und Gewässer schematisch","chapters.hall":"Regionales Kapitelhaus","avatar.title":"Avatar","landing.nav.mission":"Auftrag","landing.nav.how":"So funktioniert es","landing.nav.investors":"Investoren","landing.nav.partners":"Partner","landing.nav.educators":"Ausbilder","landing.nav.status":"Status","landing.hero.eyebrow":"Ein Programm der AGI Future Foundation","landing.hero.title":"Bilde die Gewerke so aus, als hinge das <em>nächste Jahrhundert</em> von ihnen ab.","landing.hero.lede":"Denn das stimmt. Die Menschen, die das Netz verkabeln, Druckbehälter schweißen, Lasten anschlagen und die Anlage betreiben, sind diejenigen, die physisch bauen werden, was als Nächstes kommt — und sie werden mit einem Modell ausgebildet, das für die letzte industrielle Revolution entworfen wurde.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy ist ein adaptives Ausbildungssystem für 111 Gewerkschaften: eine virtuelle Stadt aus Baustellen, in der jede Aufgabe genau am Rand dessen liegt, was du schon kannst, jede Coaching-Entscheidung sich selbst erklärt, und ein Zertifikat nur ausgestellt wird, wenn du die Arbeit ohne Hilfe nachgewiesen hast.","landing.facts.halls":"Gewerkschaftshallen, jede mit einem Grundriss und 100 Stufen","landing.facts.modules":"Modul-IDs, jede einzeln als eindeutig verifiziert","landing.facts.band":"das Erfolgsband, auf das jede Aufgabe eingestellt wird","landing.facts.checks":"automatisierte Prüfungen, die jede Version freigeben","landing.facts.defects":"Protokollfehler, gefunden und behoben, bevor sie ein Lernender je zu sehen bekam","landing.mission.kicker":"Der Auftrag","landing.mission.h2":"Qualifizierte Arbeit ist keine Notlösung. Sie ist das Fundament.","landing.mission.p1":"Seit zwei Generationen gilt die gewerbliche Ausbildung als der Weg für Menschen, die den anderen nicht eingeschlagen haben. Dieser Rahmen war immer falsch, und er wird gerade teuer. Rechenzentren brauchen Elektriker. Die Elektrifizierung braucht Freileitungsmonteure. Jede Klimazusage der Welt ist ein Versprechen über Rohrleitungsbauer, Eisenflechter und Isolierer, die es noch gar nicht gibt.","landing.mission.p2":"Die AGI Future Foundation baut Bildungsinfrastruktur im öffentlichen Interesse. Trade Craft Academy ist ihre Antwort auf eine konkrete Frage: <b>Wenn intelligente Systeme jetzt lehren können, was sollten sie zuerst lehren?</b> Unsere Antwort ist die Arbeit, die sich nicht wegautomatisieren und nicht aus einem Video lernen lässt — handwerkliches Können, bis zur Meisterschaft gelehrt, in einem Umfang, den kein Ausbildungssystem je erreicht hat.","landing.mission.h3":"Woran wir uns messen lassen","landing.mission.tick1":"<b>Nie Langeweile, nie Angst.</b> Der Schwierigkeitsgrad wird pro Fähigkeit fortlaufend an den Rand des aktuellen Könnens gedrosselt.","landing.mission.tick2":"<b>Jede Entscheidung erklärt sich selbst.</b> Ein Lernender kann fragen, warum ihm eine Aufgabe gestellt wurde, und erhält den echten Grund — aus demselben Protokoll, das auch ein Prüfer liest.","landing.mission.tick3":"<b>Ein Zertifikat bedeutet etwas.</b> Die Zertifizierung erfordert nachgewiesene, unterstützungsfreie Arbeit auf Gate-Schwierigkeit. Hilfe kann sie nicht erkaufen.","landing.mission.tick4":"<b>Das System ist Menschen gegenüber rechenschaftspflichtig.</b> Ausbilder können es übersteuern, Lernende können um einen leichteren Tag bitten, und es hört lieber ganz auf sich anzupassen, als sich schlecht anzupassen.","landing.how.kicker":"So funktioniert es","landing.how.h2":"Ein Instrument, keine Playlist.","landing.how.p":"Die meisten &ldquo;adaptiven&rdquo; Lernsysteme sind eine feste Abfolge mit einem angeschraubten Schwierigkeitsregler. Dies ist ein Regelsystem. Es schätzt, was du kannst, liefert Arbeit genau an dieser Grenze und beweist die Schätzung, bevor es überhaupt etwas zertifiziert.","landing.how.dial.h3":"Der Regler","landing.how.dial.p":"Ein Lernprofil verwandelt Telemetrie — Genauigkeit, Zögern, Hilfeanfragen, Steuerungsglätte im Simulator — in eine Kompetenzschätzung, und ein geschlossener Regelkreis hält den vorhergesagten Erfolg innerhalb von <span class=\"mono\">0.70&ndash;0.85</span>. Oberhalb des Bands herrscht Langeweile, unterhalb Angst. Beide sind Fehlschläge, und beide werden binnen weniger Aufgaben korrigiert.","landing.how.graph.h3":"Der Graph","landing.how.graph.p":"Fähigkeiten bilden einen Graphen, keine Liste. Nachweise zu einer Fähigkeit verschieben ihre Voraussetzungen, verwechselbare Paare werden auseinandergehalten, und was du im März gelernt hast, kommt zur Wiederholung zurück, bevor du es verlierst. Steckt jemand fest, diagnostiziert das System, <em>welche Voraussetzung</em> fehlt, statt dieselbe Aufgabe nur schwerer zu wiederholen.","landing.how.gate.h3":"Das Gate","landing.how.gate.p":"Übung läuft in der Mitte des Bands, wo das Lernen stattfindet. Die Zertifizierung läuft an dessen oberem Rand, ohne Hilfe, mit geschlossenen Hinweisen — ein bewusster Verifikationslauf, denn Übungsschwierigkeit kann Können niemals beweisen. Die Zertifizierung ist ein vergebenes Ereignis in einem nur anhängbaren Protokoll.","landing.how.coaches.h3":"Die Coaches","landing.how.coaches.p":"Jede Halle hat einen Mentor-Agenten, der sein Gewerk kennt. Sie coachen, erklären und eskalieren an einen menschlichen Ausbilder, wenn vor Ort etwas nicht stimmt. Was sie nicht können: deinen Schwierigkeitsgrad, dein Protokoll oder deine Zertifizierung ändern — das ist im Code erzwungen, nicht in einem Prompt erbeten.","landing.investors.kicker":"Für Investoren","landing.investors.h2":"Infrastruktur, bepreist wie Infrastruktur.","landing.investors.p1":"Die Fachkräftelücke im Handwerk ist keine Marketingthese; sie ist Arithmetik. Renteneintritte überholen die Lehrlingsaufnahme in jeder industrialisierten Volkswirtschaft, und die Engpassgröße bei Elektrifizierung und Reindustrialisierung sind Menschen, nicht Kapital.","landing.investors.p2":"Was wir gebaut haben, ist der schwer zu bauende Teil: ein validiertes Lehrplan-Register, ein adaptives Regelsystem, das gegen Simulation kalibriert und gegen Langzeit- und adversariales Versagen gehärtet wurde, eine Agentenschicht, deren Sicherheitseigenschaften erzwungen statt versprochen werden, und ein Sicherheitsmodell für institutionelle Mandanten mit mehreren Tenants.","landing.investors.p3":"Was wir nicht gebaut haben, ist ein Geschäft mit Umsatz. Wir sind vor dem Launch, vor dem Pilotprojekt und vor der Akkreditierung, und wir möchten lieber, dass Sie das hier erfahren als in der Due Diligence.","landing.investors.cta1":"Technisches Briefing anfordern","landing.investors.cta2":"Sehen, was noch nicht fertig ist","landing.investors.panel.h3":"Wohin das Kapital fließt","landing.investors.panel.tag":"Mittelverwendung","landing.investors.term.content.dt":"Inhalt","landing.investors.term.content.dd":"Verfasster Lektionsinhalt für 33 Gewerke, geprüft von Gesellen-Niveau-Praktikern. Der größte Einzelposten — und der, bei dem es keine Abkürzung gibt.","landing.investors.term.evidence.dt":"Nachweise","landing.investors.term.evidence.dd":"Eine Stepped-Wedge-Evaluation mit echten Auszubildenden. Bis die läuft, sind unsere Wirksamkeitsaussagen Simulationsergebnisse — und das sagen wir auch so.","landing.investors.term.compliance.dt":"Compliance","landing.investors.term.compliance.dd":"SOC-2-Beobachtungsfenster, Barrierefreiheitsaudit und VPAT, Prüfung Rechtsraum für Rechtsraum vor jeder Zertifizierungsaussage.","landing.investors.term.platform.dt":"Plattform","landing.investors.term.platform.dd":"Identität, Persistenz, Verschlüsselung und die operative Schicht, die ein öffentlicher Launch braucht.","landing.partners.kicker":"Für strategische Partner","landing.partners.h2":"Gewerkschaften, Arbeitgeber und diejenigen, denen die Baustellen gehören.","landing.partners.p":"Diese Plattform ist ohne die Gewerke selbst nichts wert. Wir versuchen nicht, eine Ausbildung zu ersetzen — wir versuchen, ihr Instrumentierung, Reichweite und einen Weg zu geben, einen Erstjahres-Azubi hundertmal in einen engen Raum, eine Schalttafel unter Spannung oder eine Kranführer­kabine zu setzen, bevor es wirklich zählt.","landing.partners.panel.unions.h3":"Gewerkschaften","landing.partners.panel.unions.tag":"Lehrplanhoheit","landing.partners.panel.unions.p":"Eure Ausbildungsleiter besitzen den Inhalt für euer Gewerk — die Standards, die Reihenfolge, die Freigabe. Wir liefern die Engine, den Simulator und die Nachweiskette. Euer Zertifikat bleibt eures; wir stellen keine Qualifikationen in eurem Namen aus und werden es nie tun.","landing.partners.panel.employers.h3":"Arbeitgeber &amp; Auftragnehmer","landing.partners.panel.employers.tag":"Baustellenbereitschaft","landing.partners.panel.employers.p":"Probt eine konkrete Baustelle, bevor dort jemand einen Fuß hinsetzt — Einweisung, Genehmigungsauflagen, Gefährdungsrundgang, die tatsächliche Anlage. Gewerkeübergreifende Übergaben, wo die meisten Vorfälle beginnen, werden als benannte Fähigkeit mit eigener Bewertung geübt.","landing.partners.panel.tech.h3":"Technologiepartner","landing.partners.panel.tech.tag":"Interoperabilität","landing.partners.panel.tech.p":"Alles sendet xAPI 1.0.3 an euer LRS. Der Modulkatalog exportiert als JSON oder CSV. Die Agentenschicht registriert sich auf offenen Agentenprotokollen. Wir integrieren uns lieber in euer System der Wahrheit, als selbst eines zu werden.","landing.partners.cta":"Ein Partnerschaftsgespräch beginnen","landing.educators.kicker":"Für Ausbilder &amp; Ausbildungsleiter","landing.educators.h2":"Ihr behaltet das Urteilsvermögen. Es führt die Buchhaltung.","landing.educators.p":"Ein adaptives System sollte einen Ausbilder stärker machen, nicht überflüssig. Unseres ist so gebaut, dass Entscheidungen, die Urteilsvermögen erfordern, bei euch bleiben, und solche, die Gedächtnis erfordern, beim System — wer wo feststeckt, wer eine Wiederholung überfällig hat, wer bereit für einen Test ist, und wer sich seit drei Wochen still auf Hilfe verlässt.","landing.educators.tick1":"<b>Ihr könnt jederzeit übersteuern.</b> Pinnt jeden Lernenden auf jedes Niveau. Der Override wird protokolliert, und das System gewichtet diesen Nachweis herab, weil es weiß, dass es keine saubere Messung mehr ist.","landing.educators.tick2":"<b>Ihr seht die Begründung.</b> Jede ausgelieferte Aufgabe trägt den Grund ihrer Wahl. Seid ihr anderer Meinung als das System, könnt ihr genau sehen, was es glaubte und warum.","landing.educators.tick3":"<b>Fairness wird überwacht, nicht behauptet.</b> Ergebnisse werden über Standorte, Sprachen, Gerätetypen und Altersgruppen verglichen. Eine Lücke über 10 % öffnet ein Ticket und blockiert Releases — und wenn die Einstellungen einer Kohorte still angepasst werden, um die Lücke verschwinden zu lassen, wird genau das selbst markiert.","landing.educators.tick4":"<b>Es stoppt, statt zu raten.</b> Driftet die Kalibrierung oder tut sich eine Kohorte schwer, hält die Anpassung an, und alle erhalten einen festen Schwierigkeitsgrad, bis ein Mensch nachgesehen hat.","landing.educators.cta":"Nach einem Pilotprojekt fragen","landing.educators.panel.h3":"Was ein Lernender nie verliert","landing.educators.panel.tag":"Datenrechte","landing.educators.panel.p1":"Trainingsdatensätze werden unter einem Pseudonym geführt; die Verknüpfung zu einer Person lebt in einem separaten Dienst, den keine feste Rolle lesen kann. Löschung bricht diese Verknüpfung — genau das macht sie echt statt kosmetisch.","landing.educators.panel.p2":"Signale des emotionalen Zustands — die Flow- und Frustrationsschätzungen, die der Regler nutzt — sind die <em>am stärksten</em> geschützten Daten, die wir halten, nicht die am wenigsten geschützten. Sie werden 90 Tage aufbewahrt, nie in einen Export aufgenommen und einem Arbeitgeber nie sichtbar gemacht.","landing.status.kicker":"Status &mdash; absichtlich veröffentlicht","landing.status.h2":"Was gebaut ist, was nicht, und was wir nicht behaupten werden.","landing.status.p":"Bildungstechnologie hat ein Glaubwürdigkeitsproblem, weil sie Absichten routinemäßig im Präsens beschreibt. Hier ist der tatsächliche Stand, und dieselbe Tabelle geht an jeden Investor, Partner und jede Institution, die fragt.","landing.status.th.area":"Bereich","landing.status.th.state":"Status","landing.status.th.detail":"Detail","landing.status.row1.area":"Adaptives Regelsystem","landing.status.row1.pill":"Gebaut &amp; getestet","landing.status.row1.detail":"In Simulation kalibriert; hält das Zielband rund 6&times; besser als feste oder zufällige Schwierigkeit über sechs Lernarchetypen.","landing.status.row2.area":"Modulkatalog","landing.status.row2.pill":"Gebaut &amp; verifiziert","landing.status.row2.detail":"11.000.000 Modul-IDs, generiert aus 25.875 verfassten Objekten, jede einzelne über die gesamte Population als eindeutig bewiesen — keine Stichprobe.","landing.status.row3.area":"Agenten-Sicherheitsschicht","landing.status.row3.pill":"Gebaut &amp; getestet","landing.status.row3.detail":"Coaching-Agenten können keinen Kontrollzustand schreiben; auf zwei unabhängigen Ebenen erzwungen und gegen absichtlich fehlverhaltende Agenten verifiziert.","landing.status.row4.area":"Sicherheitsmodell","landing.status.row4.pill":"Gebaut &amp; getestet","landing.status.row4.detail":"Mandantenisolierung, standardmäßig verweigerte Berechtigungen, zeitlich begrenzter Identitätszugriff, Aufbewahrung und Löschung je Datenklasse.","landing.status.row5.area":"Lektionsinhalt","landing.status.row5.pill":"Platzhalter","landing.status.row5.detail":"<b>Die Zahl 11.000.000 zählt adressierbare Modul-IDs, keine handgeschriebenen Lektionen.</b> Struktur, Sequenzierung und Bewertungslogik sind real und verifiziert; der Katalog wird aus 25.875 verfassten Objekten generiert, und der Lektionstext wartet auf Autoren mit Gesellen-Niveau.","landing.status.row6.area":"Gewerke-Taxonomie","landing.status.row6.pill":"Unsere, nicht ihre","landing.status.row6.detail":"Die 111 Hallen sind unsere Taxonomie qualifizierter Gewerke. Sie sind keine gecharterten Ortsverbände, keine Gewerkschaft hat die Liste geprüft, und die Gruppierung in Distrikte ist unsere eigene.","landing.status.row7.area":"Wirksamkeitsnachweis","landing.status.row7.pill":"Nicht belegt","landing.status.row7.detail":"Alle bisherigen Ergebnisse stammen aus Simulation. Keine Aussage über Lernergebnisse ist belegt, bis die Stepped-Wedge-Studie mit echten Auszubildenden läuft.","landing.status.row8.area":"Akkreditierung &amp; Gewerkschaftsbestätigung","landing.status.row8.pill":"Keine","landing.status.row8.detail":"Wir besitzen keine Akkreditierung, und keine Gewerkschaft hat diese Plattform bestätigt. Nichts hier verleiht eine anerkannte Qualifikation.","landing.status.row9.area":"Produktionsplattform","landing.status.row9.pill":"Nicht gebaut","landing.status.row9.detail":"Authentifizierung, Verschlüsselung, Persistenz, Backups und Incident Response sind vor einem öffentlichen Launch erforderlich und existieren noch nicht.","landing.status.note":"Siebzehn Protokollfehler wurden durch Simulation, Langzeit-Soak-Tests und adversariale Tests gefunden und behoben — darunter ein Zertifizierungspfad, der niemals tatsächlich jemanden zertifizieren konnte, ein einziges fehlgeformtes Ereignis, das den Datensatz eines Lernenden dauerhaft beschädigen konnte, und eine Hilfe-Ausblend-Regel, die spezifiziert und für aktiv gehalten wurde, aber kein einziges Mal gelaufen war. Die Liste enthält auch die, die wir in unseren eigenen Prüfungen fanden, etwa eine Layout-Assertion auf Basis einer geratenen Konstante, die zu 43 % falsch war und durchging, während vier Beschriftungen überliefen. Wir veröffentlichen die Liste, weil ein System, das noch nie einen Fehler in sich selbst gefunden hat, nicht hingesehen hat.","landing.footer.disclaimer":"<b>Bitte diesen Teil lesen.</b> Nichts auf dieser Seite ist eine anerkannte Qualifikation, eine Akkreditierung oder eine Bestätigung durch eine Gewerkschaft oder Zulassungsstelle. Ausbildungsinhalte sind allgemeine gute Praxis und wurden gegen kein Regelwerk einer Rechtsordnung geprüft. Sicherheitskritische Arbeit muss von qualifizierten Personen auf echten Baustellen gelernt und abgenommen werden.","map.key.live":"Live — verfasst, kalibriert, im Einsatz","map.key.calibrating":"Kalibrierung — im Einsatz, Schwierigkeitsgrad pendelt sich noch ein","map.key.schema_ok":"Schema OK — Struktur gültig, noch nicht kalibriert","map.key.draft":"Entwurf — niemandem bereitgestellt","map.nav.aria":"andere Oberflächen","map.nav.3d":"3D-Umgebung","map.nav.interactive":"interaktive Karte","map.nav.geomap":"Netzwerk-Geokarte","map.nav.dashboard":"Netzwerk-Dashboard","map.nav.wiki":"Wiki","map.entry_road":"Netzwerkzugang","map.titleblock.title":"Netzwerkplan · Gewerkschaftshallen","map.titleblock.sheet":"Blatt","map.titleblock.rev":"Rev","map.titleblock.halls":"Hallen","map.titleblock.modules":"Module","map.titleblock.issued":"Ausgestellt","map.titleblock.review":"Prüfung","map.meta.halls":"Gewerkschaftshallen","map.meta.modules":"Module im Plan","map.meta.live":"live","map.meta.sheet":"Blatt","map.footer.p1":"<b>Jede Zahl auf diesem Plan wird aus dem Modulregister gelesen</b> — Hallenzahl, Modulzahl und Pipeline-Zustände sind die eigenen Werte des Packs, keine Illustrationen. Die Geografie ist schematisch: Bänder zeigen, wie die Hallen gruppiert sind, keine vermessenen Positionen.","map.footer.p2":"<b>Die Innenräume sind funktionale Programme, keine Vermessungen.</b> Die Räume jeder Halle stammen aus den elf Kompetenzsträngen, die diese Halle tatsächlich lehrt, und ein Raum erhält Gewerke-Ausstattung nur, wenn die Fokuszeile dieses Gewerks sie nennt — eine Schweißhalle bekommt Kabinen und Rauchabzug, weil ihre Fähigkeiten es sagen, eine Trockenbauhalle nicht. <b>Für keine Halle wurden Adressdaten erhoben</b>, daher trägt jeder Plan einen leeren Standortblock statt einer erfundenen Straßenadresse. Der Inbetriebnahmestatus jedes Plans wird aus dem Live-Modul-Anteil dieser Halle gelesen.","map.footer.p3":"Dies ist ein Plan der Netzwerkhallen, gruppiert nach Distrikt, nicht ein einzelner Campus-Standort — jedes Distriktband nennt den gebauten Campus, zu dem es gehört. Nichts auf diesem Plan ist eine Akkreditierung oder gewerkschaftliche Bestätigung, und der Lektionsinhalt ist unverifizierte allgemeine Praxis, die auf Autoren von Praktikern wartet.","map.detail.no_address":"Standortadresse — nicht erfasst","map.detail.of":"von","map.detail.modules_word":"Module","map.detail.fixture":"Gewerke-Ausstattung","map.aria.plan":"Netzwerkplan: {n} Gewerkschaftshallen, gruppiert in acht Distrikte auf {c} gebauten Campus","map.aria.floor":"Grundriss der Halle {name}: {n} Räume","map.aria.hall":"{name} — Distrikt {district}, Raster {ref}","map.page_title":"Netzwerkplan"},"districts":{"structural":{"name":"Tragwerk","tagline":"Stahl, Schweißnähte, Hübe und die Lasten, die sie tragen"},"envelope":{"name":"Hülle und Ausbau","tagline":"Alles zwischen Rohbau und Witterung"},"systems":{"name":"Gebäudetechnik","tagline":"Energie, Prozesse, Luft, Steuerung und Daten"},"energy":{"name":"Energie und Versorgung","tagline":"Erzeugung, Verteilung, Wasser und Sturmeinsätze"},"earthworks":{"name":"Erdbau und Geräte","tagline":"Boden, Maschinen, Zugänge und Transport"},"industry":{"name":"Schwerindustrie","tagline":"Prozessanlagen, Marine, Metall und Maschinenwerkstätten"},"transport":{"name":"Verkehr und Mobilität","tagline":"Schiene, Luft, Hafen und Flotte"},"control":{"name":"Vermessung, Sicherheit und Umwelt","tagline":"Wo Arbeit abgesteckt, gesichert und sauber gemacht wird"}},"strands":{"safety":"Sicherheit","layout":"Absteckung","materials":"Werkstoffe","tools":"Werkzeuge","machines":"Maschinen","procedure":"Verfahren","inspection":"Prüfung","documentation":"Dokumentation","coordination":"Koordination","troubleshooting":"Fehlersuche","leadership":"Führung"},"tiers":{"fundamentals":"Grundlagen","applied":"Angewandt","mastery":"Meisterschaft"},"states":{"draft":"Entwurf","schema_ok":"Schema OK","calibrating":"Kalibrierung","live":"Im Betrieb"}},"en":{"language":"English","dir":"ltr","strings":{"tagline":"Gamified training to enhance robotic and human integrations","overview":"A network of {halls} union training halls across {campuses} campuses, each running the same adaptive protocol suite: a difficulty dial that holds the zone of proximal development, a skill graph that sequences practice, assessment gates that certify only unaided work, and a mentor fabric that fades its own scaffolding.","nav.campus":"Campus map","nav.spec":"Protocol spec","nav.console":"Adaptive console","nav.roadmap":"Roadmap","nav.wiki":"Wiki","language.select":"Language","figures.halls":"{n} union halls","figures.modules":"{n} addressable modules","figures.districts":"{n} districts","figures.lessons":"{n} authored lesson positions","unit.levels":"levels","unit.skills":"skills","map.legend":"Each hall is coloured by its district; identity is carried by a three-letter code.","honesty.taxonomy":"This is a taxonomy of skilled trades, not a roster of chartered locals. No union has reviewed it and no local is named.","honesty.modules":"Module counts are addressable module IDs generated from an authored skeleton, not hand-written lessons.","honesty.content":"Lesson content is unverified general practice pending authoring by journey-level practitioners.","honesty.translation":"Hall names are kept in English pending reviewed trade-name translations.","map.layers":"Layers","map.layer.districts":"Districts","map.layer.pipeline":"Pipeline state","map.layer.modules":"Module layers","map.layer.stations":"Training stations","hall.rooms":"Floor plan","hall.stations":"Stations in this hall","hall.skills":"Skill lattice","station.checklist":"Checklist","station.quiz":"Scenario check","ui.close":"Close","ui.search":"Search halls","hall.enter3d":"Open 3D environment","hall.flippedUnit":"flipped unit","view.campus":"Campus view","ui.walk":"Walk","hint.campus":"Click a hall to enter it","hint.walk":"WASD to move · Esc to exit","view.region":"Network view","figures.campuses":"{n} campuses","room.finish":"Floor finish","geo.note":"True bearings; distances compressed — labels carry real km","sim.start":"Start simulator","sim.results":"Run results","sim.pass":"Passed","sim.retry":"Try again","sim.sound":"Sound","sim.view":"View","sim.choose":"Choose a simulator","sim.operator":"Ask the operator","progress.local":"Progress is saved on this device only.","city.note":"City layer: real places near the campus (each one’s own real tier shown when you open it); streets, bridges and water schematic","chapters.hall":"Regional chapter hall","avatar.title":"Avatar","landing.nav.mission":"Mission","landing.nav.how":"How it works","landing.nav.investors":"Investors","landing.nav.partners":"Partners","landing.nav.educators":"Educators","landing.nav.status":"Status","landing.hero.eyebrow":"A programme of the AGI Future Foundation","landing.hero.title":"Train the trades like the <em>next century</em> depends on them.","landing.hero.lede":"Because it does. The people who wire the grid, weld the pressure vessels, rig the loads and run the plant are the ones who will physically build whatever comes next — and they are being trained on a model designed for the last industrial revolution.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy is an adaptive training system for 111 trade unions: a virtual city of job sites where every task is set at the edge of what you can already do, every coaching decision explains itself, and a ticket is issued only when you have demonstrated the work unaided.","landing.facts.halls":"union halls, each with a floor plan and 100 levels","landing.facts.modules":"module IDs, every one verified unique","landing.facts.band":"the success band every task is dialled into","landing.facts.checks":"automated checks gating every release","landing.facts.defects":"protocol defects found and fixed before any learner saw them","landing.mission.kicker":"The mission","landing.mission.h2":"Skilled work is not a fallback. It is the foundation.","landing.mission.p1":"For two generations, trades training has been treated as the path for people who did not take the other one. That framing was always wrong, and it is about to become expensive. Data centres need electricians. Electrification needs line workers. Every climate commitment on earth is a promise about pipefitters, ironworkers and insulators who do not exist yet.","landing.mission.p2":"The AGI Future Foundation builds public-interest education infrastructure. Trade Craft Academy is its answer to a specific question: <b>if intelligent systems can now teach, what should they teach first?</b> Our answer is the work that cannot be automated away and cannot be learned from a video — skilled physical craft, taught to mastery, at a scale no apprenticeship system has ever reached.","landing.mission.h3":"What we hold ourselves to","landing.mission.tick1":"<b>Never boredom, never anxiety.</b> Difficulty is throttled to the edge of current capability, continuously, per skill.","landing.mission.tick2":"<b>Every decision explains itself.</b> A learner can ask why they were given any task and get the real reason, from the same record an auditor reads.","landing.mission.tick3":"<b>A ticket means something.</b> Certification requires demonstrated, unaided work at gate difficulty. Help cannot buy it.","landing.mission.tick4":"<b>The system answers to people.</b> Instructors override it, learners can ask for an easier day, and it stops adapting entirely rather than adapt badly.","landing.how.kicker":"How it works","landing.how.h2":"An instrument, not a playlist.","landing.how.p":"Most &ldquo;adaptive&rdquo; learning is a fixed sequence with a difficulty knob bolted on. This is a control system. It estimates what you can do, serves work just inside that edge, and proves the estimate before it certifies anything.","landing.how.dial.h3":"The dial","landing.how.dial.p":"A learner profile turns telemetry — accuracy, hesitation, help requests, control smoothness in the sim — into a proficiency estimate, and a closed-loop controller holds predicted success inside <span class=\"mono\">0.70&ndash;0.85</span>. Above the band is boredom; below it is anxiety. Both are failures, and both get corrected within a handful of tasks.","landing.how.graph.h3":"The graph","landing.how.graph.p":"Skills are a graph, not a list. Evidence on one skill moves its prerequisites, confusable pairs are kept apart, and what you learned in March comes back for review before you lose it. When someone is stuck, the system diagnoses <em>which prerequisite</em> is missing rather than repeating the same task harder.","landing.how.gate.h3":"The gate","landing.how.gate.p":"Practice runs at the middle of the band, where learning happens. Certification runs at the top of it, unaided, with hints closed — a deliberate verification run, because practice difficulty can never prove mastery. Certification is an awarded event on an append-only record.","landing.how.coaches.h3":"The coaches","landing.how.coaches.p":"Every hall has a mentor agent that knows its trade. They coach, explain and escalate to a human instructor when something is wrong on site. What they cannot do is change your difficulty, your record or your certification — that is enforced in code, not asked for in a prompt.","landing.investors.kicker":"For investors","landing.investors.h2":"Infrastructure, priced like infrastructure.","landing.investors.p1":"The workforce gap in skilled trades is not a marketing thesis; it is an arithmetic one. Retirements are outrunning apprenticeship intake in every industrialised economy, and the constraint on electrification and reindustrialisation is people, not capital.","landing.investors.p2":"What we have built is the part that is hard to build: a validated curriculum ledger, an adaptive control system that has been calibrated against simulation and hardened against long-run and adversarial failure, an agent layer whose safety properties are enforced rather than promised, and a security model designed for multi-tenant institutional customers.","landing.investors.p3":"What we have not built is a business with revenue. We are pre-launch, pre-pilot and pre-accreditation, and we would rather you learn that here than in diligence.","landing.investors.cta1":"Request the technical brief","landing.investors.cta2":"See what is unfinished","landing.investors.panel.h3":"Where capital goes","landing.investors.panel.tag":"Use of funds","landing.investors.term.content.dt":"Content","landing.investors.term.content.dd":"Authored lesson content across 33 trades, reviewed by journey-level practitioners. The largest single line, and the one that cannot be shortcut.","landing.investors.term.evidence.dt":"Evidence","landing.investors.term.evidence.dd":"A stepped-wedge evaluation with real apprentices. Until that runs, our efficacy claims are simulation results and we will say so.","landing.investors.term.compliance.dt":"Compliance","landing.investors.term.compliance.dd":"SOC 2 observation window, accessibility audit and VPAT, jurisdiction-by-jurisdiction review before any certification claim.","landing.investors.term.platform.dt":"Platform","landing.investors.term.platform.dd":"Identity, persistence, encryption and the operational layer a public launch requires.","landing.partners.kicker":"For strategic partners","landing.partners.h2":"Unions, employers, and the people who own the job sites.","landing.partners.p":"This platform is worth nothing without the trades themselves. We are not trying to replace an apprenticeship — we are trying to give it instrumentation, reach, and a way to put a first-year apprentice in a confined space, a live panel or a crane cab a hundred times before it counts.","landing.partners.panel.unions.h3":"Trade unions","landing.partners.panel.unions.tag":"Curriculum authority","landing.partners.panel.unions.p":"Your training directors own the content for your trade — the standards, the sequence, the sign-off. We provide the engine, the sim, and the evidence trail. Your ticket stays yours; we do not issue credentials in your name and never will.","landing.partners.panel.employers.h3":"Employers &amp; contractors","landing.partners.panel.employers.tag":"Site readiness","landing.partners.panel.employers.p":"Rehearse a specific site before anyone sets foot on it — induction, permit conditions, hazard walk, the actual plant. Cross-trade hand-offs, where most incidents start, get practised as a named skill with its own assessment.","landing.partners.panel.tech.h3":"Technology partners","landing.partners.panel.tech.tag":"Interoperability","landing.partners.panel.tech.p":"Everything emits xAPI 1.0.3 to your LRS. The module catalogue exports as JSON or CSV. The agent layer registers on open agent protocols. We would rather integrate with your system of record than become one.","landing.partners.cta":"Start a partnership conversation","landing.educators.kicker":"For educators &amp; training directors","landing.educators.h2":"You keep the judgement. It keeps the bookkeeping.","landing.educators.p":"An adaptive system should make an instructor more powerful, not redundant. Ours is built so that the decisions requiring judgement stay with you and the decisions requiring memory stay with it — who is stuck and on what, who is overdue for review, who is ready to be tested, and who has been quietly leaning on help for three weeks.","landing.educators.tick1":"<b>You can always override.</b> Pin any learner to any level. The override is logged, and the system down-weights that evidence because it knows it is no longer a clean measurement.","landing.educators.tick2":"<b>You see the reasoning.</b> Every task served carries the reason it was chosen. If you disagree with the system, you can see exactly what it believed and why.","landing.educators.tick3":"<b>Fairness is monitored, not asserted.</b> Outcomes are compared across sites, languages, device types and age bands. A gap above 10% opens a ticket and blocks releases — and quietly tuning one cohort's settings to make the gap disappear is itself flagged.","landing.educators.tick4":"<b>It stops rather than guess.</b> If calibration drifts or a cohort is struggling, adaptation halts and everyone gets fixed difficulty until a human has looked.","landing.educators.cta":"Ask about a pilot","landing.educators.panel.h3":"What a learner never loses","landing.educators.panel.tag":"Data rights","landing.educators.panel.p1":"Training records are held under a pseudonym; the link to a person lives in a separate service that no standing role can read. Erasure breaks that link, which is what makes it real rather than cosmetic.","landing.educators.panel.p2":"Emotional-state signals — the flow and frustration estimates the dial uses — are the <em>most</em> protected data we hold, not the least. They are kept for 90 days, are never included in any export, and are never visible to an employer.","landing.status.kicker":"Status &mdash; published deliberately","landing.status.h2":"What is built, what is not, and what we will not claim.","landing.status.p":"Education technology has a credibility problem because it routinely describes intentions in the present tense. Here is the actual state, and the same table goes to every investor, partner and institution that asks.","landing.status.th.area":"Area","landing.status.th.state":"State","landing.status.th.detail":"Detail","landing.status.row1.area":"Adaptive control system","landing.status.row1.pill":"Built &amp; tested","landing.status.row1.detail":"Calibrated in simulation; holds the target band roughly 6&times; better than fixed or random difficulty across six learner archetypes.","landing.status.row2.area":"Module catalogue","landing.status.row2.pill":"Built &amp; verified","landing.status.row2.detail":"11,000,000 module IDs generated from 25,875 authored objects, every one proved unique across the whole population — not a sample.","landing.status.row3.area":"Agent safety layer","landing.status.row3.pill":"Built &amp; tested","landing.status.row3.detail":"Coaching agents cannot write control state; enforced at two independent layers and verified against deliberately misbehaving agents.","landing.status.row4.area":"Security model","landing.status.row4.pill":"Built &amp; tested","landing.status.row4.detail":"Tenant isolation, deny-by-default permissions, time-boxed identity access, per-class retention and erasure.","landing.status.row5.area":"Lesson content","landing.status.row5.pill":"Placeholder","landing.status.row5.detail":"<b>The 11,000,000 figure counts addressable module IDs, not hand-written lessons.</b> Structure, sequencing and assessment logic are real and verified; the catalogue is generated from 25,875 authored objects, and the lesson prose awaits authoring by journey-level practitioners.","landing.status.row6.area":"Trade taxonomy","landing.status.row6.pill":"Ours, not theirs","landing.status.row6.detail":"The 111 halls are our taxonomy of skilled trades. They are not chartered locals, no union has reviewed the list, and the grouping into districts is ours.","landing.status.row7.area":"Efficacy evidence","landing.status.row7.pill":"Not established","landing.status.row7.detail":"All results to date are simulation. No claim about learning outcomes is supported until the stepped-wedge trial with real apprentices runs.","landing.status.row8.area":"Accreditation &amp; union endorsement","landing.status.row8.pill":"None","landing.status.row8.detail":"We hold no accreditation and no union has endorsed this platform. Nothing here confers a recognised credential.","landing.status.row9.area":"Production platform","landing.status.row9.pill":"Not built","landing.status.row9.detail":"Authentication, encryption, persistence, backups and incident response are required before public launch and do not yet exist.","landing.status.note":"Seventeen protocol defects have been found and fixed by simulation, long-run soak and adversarial testing — including a certification path that could never actually certify anyone, a single malformed event that could permanently corrupt a learner's record, and a help-fading rule that was specified, believed to be in force, and had never once run. The list includes the ones we found in our own checks, such as a layout assertion built on a guessed constant that was 43% wrong and passed while four labels overflowed. We publish the list because a system that has never found a fault in itself has not looked.","landing.footer.disclaimer":"<b style=\"color:var(--ink)\">Please read this part.</b> Nothing on this page is a recognised credential, an accreditation, or an endorsement by any trade union or licensing body. Training content is general good practice and has not been verified against any jurisdiction's code. Safety-critical work must be learned and signed off by qualified people on real sites.","map.key.live":"Live — authored, calibrated, serving","map.key.calibrating":"Calibrating — serving, difficulty still settling","map.key.schema_ok":"Schema OK — structure valid, not yet calibrated","map.key.draft":"Draft — not served to anyone","map.nav.aria":"other surfaces","map.nav.3d":"3D environment","map.nav.interactive":"interactive map","map.nav.geomap":"network geomap","map.nav.dashboard":"network dashboard","map.nav.wiki":"wiki","map.entry_road":"Network Entry","map.titleblock.title":"Network Plan · Union Halls","map.titleblock.sheet":"Sheet","map.titleblock.rev":"Rev","map.titleblock.halls":"Halls","map.titleblock.modules":"Modules","map.titleblock.issued":"Issued","map.titleblock.review":"Review","map.meta.halls":"union halls","map.meta.modules":"modules on the plan","map.meta.live":"live","map.meta.sheet":"sheet","map.footer.p1":"<b>Every number on this plan is read from the module registry</b> — hall counts, module counts and pipeline states are the pack's own values, not illustrations. The geography is schematic: bands show how the halls are grouped, not surveyed positions.","map.footer.p2":"<b>The interiors are functional programmes, not surveys.</b> Each hall's rooms come from the eleven skill strands that hall actually teaches, and a room gains trade fixtures only when that trade's own focus line names them — a welding hall gets booths and fume extraction because its skills say so, and a drywall hall does not. <b>No address data has been collected for any hall</b>, so every plan carries an empty site block rather than an invented street address. The commissioning state on each plan is read from that hall's live-module share.","map.footer.p3":"This is a plan of the network's halls grouped by district, not one campus site — each district band names the built campus it belongs to. Nothing on this plan is an accreditation or a union endorsement, and lesson content is unverified general practice pending authoring by practitioners.","map.detail.no_address":"Site address — not recorded","map.detail.of":"of","map.detail.modules_word":"modules","map.detail.fixture":"trade fixture","map.aria.plan":"Network plan: {n} union halls grouped into eight districts across {c} built campuses","map.aria.floor":"Floor plan of the {name} hall: {n} rooms","map.aria.hall":"{name} — {district} district, grid {ref}","map.page_title":"Network Plan"},"districts":{"structural":{"name":"Structural","tagline":"Steel, welds, lifts and the loads they carry"},"envelope":{"name":"Envelope & Finish","tagline":"Everything between the frame and the weather"},"systems":{"name":"Building Systems","tagline":"Power, process, air, controls and data"},"energy":{"name":"Energy & Utilities","tagline":"Generation, distribution, water and storm work"},"earthworks":{"name":"Earthworks & Plant","tagline":"Ground, machines, access and haul"},"industry":{"name":"Heavy Industry","tagline":"Process plant, marine, metal and machine shops"},"transport":{"name":"Transport & Mobility","tagline":"Rail, air, port and fleet"},"control":{"name":"Survey, Safety & Environment","tagline":"Where work is set out, made safe and made clean"}},"strands":{"safety":"Safety","layout":"Layout","materials":"Materials","tools":"Tools","machines":"Machines","procedure":"Procedure","inspection":"Inspection","documentation":"Documentation","coordination":"Coordination","troubleshooting":"Troubleshooting","leadership":"Leadership"},"tiers":{"fundamentals":"Fundamentals","applied":"Applied","mastery":"Mastery"},"states":{"draft":"Draft","schema_ok":"Schema OK","calibrating":"Calibrating","live":"Live"}},"es":{"language":"Español","dir":"ltr","strings":{"tagline":"Formación gamificada para potenciar la integración entre robots y personas","overview":"Una red de {halls} salas sindicales de formación en {campuses} campus, todas ejecutando la misma suite de protocolos adaptativos: un regulador de dificultad que mantiene la zona de desarrollo próximo, un grafo de habilidades que secuencia la práctica, puertas de evaluación que solo certifican trabajo sin ayuda y un tejido de mentores que desvanece su propio andamiaje.","nav.campus":"Mapa del campus","nav.spec":"Especificación del protocolo","nav.console":"Consola adaptativa","nav.roadmap":"Hoja de ruta","nav.wiki":"Wiki","language.select":"Idioma","figures.halls":"{n} salas sindicales","figures.modules":"{n} módulos direccionables","figures.districts":"{n} distritos","figures.lessons":"{n} posiciones de lección redactadas","unit.levels":"niveles","unit.skills":"habilidades","map.legend":"Cada sala se colorea según su distrito; la identidad la lleva un código de tres letras.","honesty.taxonomy":"Esto es una taxonomía de oficios cualificados, no un registro de sindicatos constituidos. Ningún sindicato la ha revisado y no se nombra ningún local.","honesty.modules":"Los recuentos de módulos son identificadores direccionables generados a partir de un esqueleto redactado, no lecciones escritas a mano.","honesty.content":"El contenido de las lecciones es práctica general sin verificar, pendiente de redacción por profesionales de oficio.","honesty.translation":"Los nombres de las salas se mantienen en inglés a la espera de traducciones revisadas de los nombres de oficios.","map.layers":"Capas","map.layer.districts":"Distritos","map.layer.pipeline":"Estado del proceso","map.layer.modules":"Capas de módulos","map.layer.stations":"Estaciones de formación","hall.rooms":"Plano de planta","hall.stations":"Estaciones en esta sala","hall.skills":"Retícula de habilidades","station.checklist":"Lista de verificación","station.quiz":"Escenario de comprobación","ui.close":"Cerrar","ui.search":"Buscar salas","hall.enter3d":"Abrir entorno 3D","hall.flippedUnit":"unidad invertida","view.campus":"Vista del campus","ui.walk":"Caminar","hint.campus":"Haz clic en una sala para entrar","hint.walk":"WASD para moverte · Esc para salir","view.region":"Vista de la red","figures.campuses":"{n} campus","room.finish":"Acabado del suelo","geo.note":"Rumbos reales; distancias comprimidas — las etiquetas llevan km reales","sim.start":"Iniciar simulador","sim.results":"Resultados","sim.pass":"Aprobado","sim.retry":"Intentar de nuevo","sim.sound":"Sonido","sim.view":"Vista","sim.choose":"Elige un simulador","sim.operator":"Preguntar al operador","progress.local":"El progreso se guarda solo en este dispositivo.","city.note":"Capa urbana: lugares reales cerca del campus (el nivel real de cada uno se muestra al abrirlo); calles, puentes y agua esquemáticos","chapters.hall":"Sede regional de secciones","avatar.title":"Avatar","landing.nav.mission":"Misión","landing.nav.how":"Cómo funciona","landing.nav.investors":"Inversores","landing.nav.partners":"Socios","landing.nav.educators":"Educadores","landing.nav.status":"Estado","landing.hero.eyebrow":"Un programa de la AGI Future Foundation","landing.hero.title":"Forma a los oficios como si el <em>próximo siglo</em> dependiera de ellos.","landing.hero.lede":"Porque así es. Las personas que cablean la red, sueldan los recipientes a presión, aparejan las cargas y operan la planta son quienes construirán físicamente lo que venga después — y se les está formando con un modelo diseñado para la última revolución industrial.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy es un sistema de formación adaptativo para 111 gremios: una ciudad virtual de obras donde cada tarea se fija en el límite de lo que ya sabes hacer, cada decisión de orientación se explica a sí misma, y solo se emite un ticket cuando has demostrado el trabajo sin ayuda.","landing.facts.halls":"salas gremiales, cada una con un plano de planta y 100 niveles","landing.facts.modules":"identificadores de módulo, cada uno verificado como único","landing.facts.band":"la banda de éxito a la que se ajusta cada tarea","landing.facts.checks":"comprobaciones automatizadas que condicionan cada versión","landing.facts.defects":"defectos de protocolo detectados y corregidos antes de que ningún alumno los viera","landing.mission.kicker":"La misión","landing.mission.h2":"El trabajo cualificado no es un plan B. Es el cimiento.","landing.mission.p1":"Durante dos generaciones, la formación en oficios se ha tratado como el camino de quienes no tomaron el otro. Ese enfoque siempre fue erróneo, y está a punto de volverse costoso. Los centros de datos necesitan electricistas. La electrificación necesita electricistas de línea. Cada compromiso climático del planeta es una promesa sobre tuberos, herreros y aislantes que todavía no existen.","landing.mission.p2":"La AGI Future Foundation construye infraestructura educativa de interés público. Trade Craft Academy es su respuesta a una pregunta concreta: <b>si los sistemas inteligentes ya pueden enseñar, ¿qué deberían enseñar primero?</b> Nuestra respuesta es el trabajo que no se puede automatizar ni aprender de un vídeo — el oficio físico cualificado, enseñado hasta el dominio, a una escala que ningún sistema de aprendizaje ha alcanzado jamás.","landing.mission.h3":"A qué nos comprometemos","landing.mission.tick1":"<b>Nunca aburrimiento, nunca ansiedad.</b> La dificultad se ajusta continuamente al límite de la capacidad actual, por cada destreza.","landing.mission.tick2":"<b>Cada decisión se explica a sí misma.</b> Un alumno puede preguntar por qué se le dio una tarea y obtener la razón real, del mismo registro que lee un auditor.","landing.mission.tick3":"<b>Un ticket significa algo.</b> La certificación exige trabajo demostrado, sin ayuda, a la dificultad de la puerta de control. La ayuda no puede comprarla.","landing.mission.tick4":"<b>El sistema rinde cuentas a las personas.</b> Los instructores pueden anularlo, los alumnos pueden pedir un día más sencillo, y prefiere dejar de adaptarse por completo antes que adaptarse mal.","landing.how.kicker":"Cómo funciona","landing.how.h2":"Un instrumento, no una lista de reproducción.","landing.how.p":"La mayoría del aprendizaje &ldquo;adaptativo&rdquo; es una secuencia fija con un mando de dificultad añadido. Esto es un sistema de control. Estima lo que puedes hacer, sirve trabajo justo en ese límite, y demuestra la estimación antes de certificar nada.","landing.how.dial.h3":"El dial","landing.how.dial.p":"Un perfil de alumno convierte la telemetría — precisión, vacilación, solicitudes de ayuda, suavidad de control en el simulador — en una estimación de dominio, y un controlador de lazo cerrado mantiene el éxito previsto dentro de <span class=\"mono\">0.70&ndash;0.85</span>. Por encima de la banda hay aburrimiento; por debajo, ansiedad. Ambos son fallos, y ambos se corrigen en un puñado de tareas.","landing.how.graph.h3":"El grafo","landing.how.graph.p":"Las destrezas son un grafo, no una lista. La evidencia sobre una destreza mueve sus requisitos previos, los pares confundibles se mantienen separados, y lo que aprendiste en marzo vuelve para repaso antes de que lo olvides. Cuando alguien se atasca, el sistema diagnostica <em>qué requisito previo</em> falta en lugar de repetir la misma tarea con más dificultad.","landing.how.gate.h3":"La puerta de control","landing.how.gate.p":"La práctica se ejecuta en el centro de la banda, donde ocurre el aprendizaje. La certificación se ejecuta en la parte superior, sin ayuda, con las pistas cerradas — una ejecución de verificación deliberada, porque la dificultad de práctica nunca puede probar el dominio. La certificación es un evento otorgado en un registro de solo adición.","landing.how.coaches.h3":"Los coaches","landing.how.coaches.p":"Cada sala tiene un agente mentor que conoce su oficio. Orientan, explican y escalan a un instructor humano cuando algo va mal en el sitio. Lo que no pueden hacer es cambiar tu dificultad, tu registro o tu certificación — eso se impone en el código, no se pide en una instrucción.","landing.investors.kicker":"Para inversores","landing.investors.h2":"Infraestructura, valorada como infraestructura.","landing.investors.p1":"La brecha de mano de obra en oficios cualificados no es una tesis de marketing; es una cuestión aritmética. Las jubilaciones superan a la admisión de aprendices en todas las economías industrializadas, y la restricción para la electrificación y la reindustrialización son las personas, no el capital.","landing.investors.p2":"Lo que hemos construido es la parte difícil de construir: un libro de currículo validado, un sistema de control adaptativo calibrado frente a simulaciones y endurecido frente a fallos de largo plazo y adversariales, una capa de agentes cuyas propiedades de seguridad se aplican en lugar de prometerse, y un modelo de seguridad diseñado para clientes institucionales multiinquilino.","landing.investors.p3":"Lo que no hemos construido es un negocio con ingresos. Estamos en fase previa al lanzamiento, previa al piloto y previa a la acreditación, y preferimos que lo sepas aquí antes que en la diligencia debida.","landing.investors.cta1":"Solicitar el informe técnico","landing.investors.cta2":"Ver qué falta por terminar","landing.investors.panel.h3":"Dónde va el capital","landing.investors.panel.tag":"Uso de los fondos","landing.investors.term.content.dt":"Contenido","landing.investors.term.content.dd":"Contenido de lecciones redactado en 33 oficios, revisado por profesionales de nivel oficial. La partida individual más grande, y la que no admite atajos.","landing.investors.term.evidence.dt":"Evidencia","landing.investors.term.evidence.dd":"Una evaluación de cuña escalonada con aprendices reales. Hasta que eso se ejecute, nuestras afirmaciones de eficacia son resultados de simulación, y lo diremos así.","landing.investors.term.compliance.dt":"Cumplimiento","landing.investors.term.compliance.dd":"Ventana de observación SOC 2, auditoría de accesibilidad y VPAT, revisión jurisdicción por jurisdicción antes de cualquier afirmación de certificación.","landing.investors.term.platform.dt":"Plataforma","landing.investors.term.platform.dd":"Identidad, persistencia, cifrado y la capa operativa que requiere un lanzamiento público.","landing.partners.kicker":"Para socios estratégicos","landing.partners.h2":"Gremios, empleadores y quienes son dueños de las obras.","landing.partners.p":"Esta plataforma no vale nada sin los propios oficios. No pretendemos sustituir un aprendizaje — pretendemos darle instrumentación, alcance, y una forma de poner a un aprendiz de primer año en un espacio confinado, un panel energizado o una cabina de grúa cien veces antes de que cuente de verdad.","landing.partners.panel.unions.h3":"Gremios","landing.partners.panel.unions.tag":"Aut
