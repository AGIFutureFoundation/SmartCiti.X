oridad curricular","landing.partners.panel.unions.p":"Vuestros directores de formación son dueños del contenido de vuestro oficio — los estándares, la secuencia, la firma de aprobación. Nosotros aportamos el motor, el simulador y el rastro de evidencia. Vuestro ticket sigue siendo vuestro; no emitimos credenciales en vuestro nombre y nunca lo haremos.","landing.partners.panel.employers.h3":"Empleadores y contratistas","landing.partners.panel.employers.tag":"Preparación del sitio","landing.partners.panel.employers.p":"Ensayad un sitio concreto antes de que nadie ponga un pie en él — inducción, condiciones del permiso, recorrido de riesgos, la planta real. Los traspasos entre oficios, donde empiezan la mayoría de los incidentes, se practican como una destreza con nombre propio y su propia evaluación.","landing.partners.panel.tech.h3":"Socios tecnológicos","landing.partners.panel.tech.tag":"Interoperabilidad","landing.partners.panel.tech.p":"Todo emite xAPI 1.0.3 a vuestro LRS. El catálogo de módulos se exporta como JSON o CSV. La capa de agentes se registra en protocolos de agentes abiertos. Preferimos integrarnos con vuestro sistema de registro antes que convertirnos en uno.","landing.partners.cta":"Iniciar una conversación de colaboración","landing.educators.kicker":"Para educadores y directores de formación","landing.educators.h2":"Vosotros conserváis el juicio. Él lleva la contabilidad.","landing.educators.p":"Un sistema adaptativo debería hacer a un instructor más poderoso, no prescindible. El nuestro está construido para que las decisiones que requieren juicio se queden con vosotros y las que requieren memoria se queden con él — quién está atascado y en qué, quién tiene un repaso pendiente, quién está listo para ser evaluado, y quién lleva tres semanas apoyándose en la ayuda en silencio.","landing.educators.tick1":"<b>Siempre podéis anular.</b> Fijad a cualquier alumno en cualquier nivel. La anulación queda registrada, y el sistema reduce el peso de esa evidencia porque sabe que ya no es una medición limpia.","landing.educators.tick2":"<b>Veis el razonamiento.</b> Cada tarea servida lleva el motivo por el que fue elegida. Si estáis en desacuerdo con el sistema, podéis ver exactamente qué creía y por qué.","landing.educators.tick3":"<b>La equidad se vigila, no se afirma.</b> Los resultados se comparan entre sedes, idiomas, tipos de dispositivo y franjas de edad. Una brecha superior al 10% abre un ticket y bloquea versiones — y ajustar en silencio la configuración de una cohorte para que la brecha desaparezca queda a su vez marcado.","landing.educators.tick4":"<b>Se detiene en lugar de adivinar.</b> Si la calibración se desvía o una cohorte tiene dificultades, la adaptación se detiene y todos reciben una dificultad fija hasta que una persona lo revise.","landing.educators.cta":"Preguntar por un piloto","landing.educators.panel.h3":"Lo que un alumno nunca pierde","landing.educators.panel.tag":"Derechos de datos","landing.educators.panel.p1":"Los registros de formación se conservan bajo un seudónimo; el vínculo con una persona vive en un servicio separado que ningún rol permanente puede leer. El borrado rompe ese vínculo, lo que lo hace real y no cosmético.","landing.educators.panel.p2":"Las señales de estado emocional — las estimaciones de flujo y frustración que usa el dial — son los datos <em>más</em> protegidos que tenemos, no los menos. Se conservan durante 90 días, nunca se incluyen en ninguna exportación, y nunca son visibles para un empleador.","landing.status.kicker":"Estado &mdash; publicado deliberadamente","landing.status.h2":"Qué está construido, qué no, y qué no vamos a afirmar.","landing.status.p":"La tecnología educativa tiene un problema de credibilidad porque describe habitualmente sus intenciones en presente. Aquí está el estado real, y la misma tabla se entrega a todo inversor, socio e institución que la pida.","landing.status.th.area":"Área","landing.status.th.state":"Estado","landing.status.th.detail":"Detalle","landing.status.row1.area":"Sistema de control adaptativo","landing.status.row1.pill":"Construido y probado","landing.status.row1.detail":"Calibrado en simulación; mantiene la banda objetivo aproximadamente 6&times; mejor que la dificultad fija o aleatoria en seis arquetipos de alumno.","landing.status.row2.area":"Catálogo de módulos","landing.status.row2.pill":"Construido y verificado","landing.status.row2.detail":"11.000.000 identificadores de módulo generados a partir de 25.875 objetos redactados, cada uno probado único en toda la población — no una muestra.","landing.status.row3.area":"Capa de seguridad de agentes","landing.status.row3.pill":"Construido y probado","landing.status.row3.detail":"Los agentes de orientación no pueden escribir estado de control; se aplica en dos capas independientes y se verifica frente a agentes deliberadamente maliciosos.","landing.status.row4.area":"Modelo de seguridad","landing.status.row4.pill":"Construido y probado","landing.status.row4.detail":"Aislamiento de inquilinos, permisos con denegación por defecto, acceso de identidad limitado en el tiempo, retención y borrado por clase de dato.","landing.status.row5.area":"Contenido de las lecciones","landing.status.row5.pill":"Marcador de posición","landing.status.row5.detail":"<b>La cifra de 11.000.000 cuenta identificadores de módulo direccionables, no lecciones escritas a mano.</b> La estructura, la secuenciación y la lógica de evaluación son reales y están verificadas; el catálogo se genera a partir de 25.875 objetos redactados, y la prosa de las lecciones espera ser redactada por profesionales de nivel oficial.","landing.status.row6.area":"Taxonomía de oficios","landing.status.row6.pill":"Nuestra, no la suya","landing.status.row6.detail":"Las 111 salas son nuestra taxonomía de oficios cualificados. No son locales sindicales acreditados, ningún gremio ha revisado la lista, y la agrupación en distritos es nuestra.","landing.status.row7.area":"Evidencia de eficacia","landing.status.row7.pill":"No establecida","landing.status.row7.detail":"Todos los resultados hasta la fecha son de simulación. Ninguna afirmación sobre resultados de aprendizaje está respaldada hasta que se ejecute el ensayo de cuña escalonada con aprendices reales.","landing.status.row8.area":"Acreditación y respaldo sindical","landing.status.row8.pill":"Ninguna","landing.status.row8.detail":"No tenemos ninguna acreditación y ningún gremio ha respaldado esta plataforma. Nada aquí otorga una credencial reconocida.","landing.status.row9.area":"Plataforma de producción","landing.status.row9.pill":"No construida","landing.status.row9.detail":"La autenticación, el cifrado, la persistencia, las copias de seguridad y la respuesta a incidentes son necesarios antes del lanzamiento público y todavía no existen.","landing.status.note":"Se han encontrado y corregido diecisiete defectos de protocolo mediante simulación, pruebas de resistencia de larga duración y pruebas adversariales — incluida una vía de certificación que nunca podía certificar a nadie realmente, un único evento malformado que podía corromper permanentemente el registro de un alumno, y una regla de desvanecimiento de ayuda que estaba especificada, se creía vigente, y nunca se había ejecutado ni una vez. La lista incluye los que encontramos en nuestras propias comprobaciones, como una aserción de maquetación basada en una constante adivinada que estaba un 43% equivocada y pasaba mientras cuatro etiquetas se desbordaban. Publicamos la lista porque un sistema que nunca ha encontrado un fallo en sí mismo no ha mirado.","landing.footer.disclaimer":"<b>Por favor, leed esta parte.</b> Nada en esta página es una credencial reconocida, una acreditación o un respaldo de ningún gremio o entidad licenciadora. El contenido de formación es buena práctica general y no ha sido verificado frente al código normativo de ninguna jurisdicción. El trabajo crítico para la seguridad debe aprenderse y ser validado por personas cualificadas en obras reales.","map.key.live":"En vivo — redactado, calibrado, en servicio","map.key.calibrating":"Calibrando — en servicio, la dificultad aún se está asentando","map.key.schema_ok":"Esquema OK — estructura válida, aún no calibrado","map.key.draft":"Borrador — no se sirve a nadie","map.nav.aria":"otras superficies","map.nav.3d":"entorno 3D","map.nav.interactive":"mapa interactivo","map.nav.geomap":"geomapa de la red","map.nav.dashboard":"panel de la red","map.nav.wiki":"wiki","map.entry_road":"Entrada de la red","map.titleblock.title":"Plano de la red · Salas gremiales","map.titleblock.sheet":"Hoja","map.titleblock.rev":"Rev","map.titleblock.halls":"Salas","map.titleblock.modules":"Módulos","map.titleblock.issued":"Emitido","map.titleblock.review":"Revisión","map.meta.halls":"salas gremiales","map.meta.modules":"módulos en el plano","map.meta.live":"en vivo","map.meta.sheet":"hoja","map.footer.p1":"<b>Cada número de este plano se lee del registro de módulos</b> — el número de salas, de módulos y los estados del pipeline son los valores propios del paquete, no ilustraciones. La geografía es esquemática: las bandas muestran cómo se agrupan las salas, no posiciones topografiadas.","map.footer.p2":"<b>Los interiores son programas funcionales, no levantamientos.</b> Las salas de cada hall provienen de las once líneas de destreza que ese hall enseña realmente, y una sala solo obtiene equipamiento de oficio cuando la propia línea de enfoque de ese oficio lo indica — una sala de soldadura tiene cabinas y extracción de humos porque sus destrezas lo dicen, y una de tablaroca no. <b>No se han recopilado datos de dirección para ninguna sala</b>, así que cada plano lleva un bloque de sitio vacío en lugar de una dirección inventada. El estado de puesta en marcha de cada plano se lee de la proporción de módulos en vivo de esa sala.","map.footer.p3":"Este es un plano de las salas de la red agrupadas por distrito, no de un único sitio de campus — cada franja de distrito nombra el campus construido al que pertenece. Nada en este plano es una acreditación o un respaldo sindical, y el contenido de las lecciones es una práctica general no verificada a la espera de ser redactada por profesionales.","map.detail.no_address":"Dirección del sitio — no registrada","map.detail.of":"de","map.detail.modules_word":"módulos","map.detail.fixture":"equipamiento de oficio","map.aria.plan":"Plano de la red: {n} salas gremiales agrupadas en ocho distritos en {c} campus construidos","map.aria.floor":"Plano de planta de la sala {name}: {n} habitaciones","map.aria.hall":"{name} — distrito {district}, cuadrícula {ref}","map.page_title":"Plano de la red"},"districts":{"structural":{"name":"Estructural","tagline":"Acero, soldaduras, izajes y las cargas que soportan"},"envelope":{"name":"Envolvente y Acabados","tagline":"Todo lo que hay entre la estructura y la intemperie"},"systems":{"name":"Sistemas del Edificio","tagline":"Energía, procesos, aire, controles y datos"},"energy":{"name":"Energía y Servicios","tagline":"Generación, distribución, agua y trabajo de tormenta"},"earthworks":{"name":"Movimiento de Tierras y Maquinaria","tagline":"Terreno, máquinas, accesos y acarreo"},"industry":{"name":"Industria Pesada","tagline":"Plantas de proceso, marina, metal y talleres mecánicos"},"transport":{"name":"Transporte y Movilidad","tagline":"Ferrocarril, aire, puerto y flota"},"control":{"name":"Topografía, Seguridad y Medio Ambiente","tagline":"Donde el trabajo se replantea, se asegura y se limpia"}},"strands":{"safety":"Seguridad","layout":"Replanteo","materials":"Materiales","tools":"Herramientas","machines":"Máquinas","procedure":"Procedimiento","inspection":"Inspección","documentation":"Documentación","coordination":"Coordinación","troubleshooting":"Diagnóstico de fallos","leadership":"Liderazgo"},"tiers":{"fundamentals":"Fundamentos","applied":"Aplicado","mastery":"Maestría"},"states":{"draft":"Borrador","schema_ok":"Esquema OK","calibrating":"Calibrando","live":"En producción"}},"fr":{"language":"Français","dir":"ltr","strings":{"tagline":"Formation ludifiée pour renforcer l'intégration entre robots et humains","overview":"Un réseau de {halls} salles syndicales de formation sur {campuses} campus, exécutant toutes la même suite de protocoles adaptatifs : un cadran de difficulté qui maintient la zone proximale de développement, un graphe de compétences qui séquence la pratique, des portes d'évaluation qui ne certifient que le travail sans aide, et un tissu de mentors qui estompe son propre échafaudage.","nav.campus":"Plan du campus","nav.spec":"Spécification du protocole","nav.console":"Console adaptative","nav.roadmap":"Feuille de route","nav.wiki":"Wiki","language.select":"Langue","figures.halls":"{n} salles syndicales","figures.modules":"{n} modules adressables","figures.districts":"{n} districts","figures.lessons":"{n} positions de leçon rédigées","unit.levels":"niveaux","unit.skills":"compétences","map.legend":"Chaque salle est colorée selon son district ; l'identité est portée par un code de trois lettres.","honesty.taxonomy":"Ceci est une taxonomie de métiers qualifiés, non un registre de sections syndicales constituées. Aucun syndicat ne l'a examinée et aucune section locale n'est nommée.","honesty.modules":"Les comptes de modules sont des identifiants adressables générés depuis un squelette rédigé, non des leçons écrites à la main.","honesty.content":"Le contenu des leçons est de la pratique générale non vérifiée, en attente de rédaction par des compagnons de métier.","honesty.translation":"Les noms des salles restent en anglais en attendant des traductions revues des noms de métiers.","map.layers":"Couches","map.layer.districts":"Districts","map.layer.pipeline":"État du pipeline","map.layer.modules":"Couches de modules","map.layer.stations":"Stations de formation","hall.rooms":"Plan d'étage","hall.stations":"Stations dans cette salle","hall.skills":"Treillis de compétences","station.checklist":"Liste de contrôle","station.quiz":"Mise en situation","ui.close":"Fermer","ui.search":"Rechercher une salle","hall.enter3d":"Ouvrir l'environnement 3D","hall.flippedUnit":"unité inversée","view.campus":"Vue du campus","ui.walk":"Marcher","hint.campus":"Cliquez sur une salle pour y entrer","hint.walk":"WASD pour se déplacer · Échap pour quitter","view.region":"Vue du réseau","figures.campuses":"{n} campus","room.finish":"Revêtement de sol","geo.note":"Caps réels ; distances compressées — les étiquettes portent les km réels","sim.start":"Lancer le simulateur","sim.results":"Résultats","sim.pass":"Réussi","sim.retry":"Réessayer","sim.sound":"Son","sim.view":"Vue","sim.choose":"Choisissez un simulateur","sim.operator":"Demander à l'opérateur","progress.local":"La progression est enregistrée uniquement sur cet appareil.","city.note":"Couche urbaine : lieux réels près du campus (le niveau réel de chacun s’affiche à l’ouverture) ; rues, ponts et plans d’eau schématiques","chapters.hall":"Maison des sections régionales","avatar.title":"Avatar","landing.nav.mission":"Mission","landing.nav.how":"Comment ça marche","landing.nav.investors":"Investisseurs","landing.nav.partners":"Partenaires","landing.nav.educators":"Éducateurs","landing.nav.status":"État","landing.hero.eyebrow":"Un programme de l’AGI Future Foundation","landing.hero.title":"Formez les métiers comme si le <em>prochain siècle</em> en dépendait.","landing.hero.lede":"Parce que c’est le cas. Les personnes qui câblent le réseau, soudent les récipients sous pression, élinguent les charges et font tourner l’usine sont celles qui construiront physiquement ce qui vient ensuite — et on les forme avec un modèle conçu pour la dernière révolution industrielle.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy est un système de formation adaptatif pour 111 corps de métier : une ville virtuelle de chantiers où chaque tâche est fixée à la limite de ce que vous savez déjà faire, chaque décision de coaching s’explique d’elle-même, et un ticket n’est délivré que lorsque vous avez démontré le travail sans aide.","landing.facts.halls":"salles syndicales, chacune avec un plan d’étage et 100 niveaux","landing.facts.modules":"identifiants de module, chacun vérifié comme unique","landing.facts.band":"la fourchette de réussite sur laquelle chaque tâche est calée","landing.facts.checks":"contrôles automatisés qui conditionnent chaque publication","landing.facts.defects":"défauts de protocole détectés et corrigés avant qu’aucun apprenant ne les voie","landing.mission.kicker":"La mission","landing.mission.h2":"Le travail qualifié n’est pas une solution de repli. C’est le socle.","landing.mission.p1":"Depuis deux générations, la formation aux métiers a été traitée comme la voie de ceux qui n’avaient pas pris l’autre. Ce cadrage a toujours été erroné, et il est sur le point de devenir coûteux. Les centres de données ont besoin d’électriciens. L’électrification a besoin de monteurs de lignes. Chaque engagement climatique sur terre est une promesse concernant des tuyauteurs, des monteurs en charpentes métalliques et des calorifugeurs qui n’existent pas encore.","landing.mission.p2":"L’AGI Future Foundation construit une infrastructure éducative d’intérêt public. Trade Craft Academy est sa réponse à une question précise : <b>si des systèmes intelligents peuvent désormais enseigner, que devraient-ils enseigner en premier ?</b> Notre réponse est le travail qui ne peut être automatisé ni appris dans une vidéo — le métier physique qualifié, enseigné jusqu’à la maîtrise, à une échelle qu’aucun système d’apprentissage n’a jamais atteinte.","landing.mission.h3":"Ce à quoi nous nous engageons","landing.mission.tick1":"<b>Jamais d’ennui, jamais d’anxiété.</b> La difficulté est régulée en continu à la limite de la capacité actuelle, compétence par compétence.","landing.mission.tick2":"<b>Chaque décision s’explique d’elle-même.</b> Un apprenant peut demander pourquoi il a reçu une tâche donnée et obtenir la vraie raison, tirée du même registre que lit un auditeur.","landing.mission.tick3":"<b>Un ticket veut dire quelque chose.</b> La certification exige un travail démontré, sans aide, au niveau de difficulté du portail. L’aide ne peut pas l’acheter.","landing.mission.tick4":"<b>Le système rend des comptes aux personnes.</b> Les instructeurs peuvent le contourner, les apprenants peuvent demander une journée plus facile, et il cesse totalement de s’adapter plutôt que de mal s’adapter.","landing.how.kicker":"Comment ça marche","landing.how.h2":"Un instrument, pas une playlist.","landing.how.p":"La plupart des apprentissages &ldquo;adaptatifs&rdquo; sont une séquence fixe avec un bouton de difficulté boulonné dessus. Ceci est un système de contrôle. Il estime ce que vous savez faire, fournit un travail juste à cette limite, et prouve l’estimation avant de certifier quoi que ce soit.","landing.how.dial.h3":"Le cadran","landing.how.dial.p":"Un profil d’apprenant transforme la télémétrie — précision, hésitation, demandes d’aide, fluidité du contrôle dans le simulateur — en une estimation de compétence, et un régulateur en boucle fermée maintient la réussite prédite dans <span class=\"mono\">0.70&ndash;0.85</span>. Au-dessus de la bande, c’est l’ennui ; en dessous, l’anxiété. Les deux sont des échecs, corrigés en une poignée de tâches.","landing.how.graph.h3":"Le graphe","landing.how.graph.p":"Les compétences forment un graphe, pas une liste. Les preuves sur une compétence déplacent ses prérequis, les paires confondables sont tenues à l’écart, et ce que vous avez appris en mars revient en révision avant que vous ne l’oubliiez. Quand quelqu’un est bloqué, le système diagnostique <em>quel prérequis</em> manque plutôt que de répéter la même tâche plus durement.","landing.how.gate.h3":"Le portail","landing.how.gate.p":"La pratique se déroule au milieu de la bande, là où l’apprentissage a lieu. La certification se déroule en haut de celle-ci, sans aide, indices fermés — une passe de vérification délibérée, car la difficulté d’entraînement ne peut jamais prouver la maîtrise. La certification est un événement attribué sur un registre en ajout seul.","landing.how.coaches.h3":"Les accompagnateurs","landing.how.coaches.p":"Chaque salle a un agent mentor qui connaît son métier. Ils accompagnent, expliquent et font remonter à un instructeur humain quand quelque chose ne va pas sur le chantier. Ce qu’ils ne peuvent pas faire, c’est changer votre difficulté, votre registre ou votre certification — cela est imposé dans le code, pas demandé dans une invite.","landing.investors.kicker":"Pour les investisseurs","landing.investors.h2":"Une infrastructure, valorisée comme une infrastructure.","landing.investors.p1":"Le déficit de main-d’œuvre dans les métiers qualifiés n’est pas une thèse marketing ; c’est une question d’arithmétique. Les départs à la retraite dépassent l’entrée en apprentissage dans chaque économie industrialisée, et la contrainte sur l’électrification et la réindustrialisation, ce sont les gens, pas le capital.","landing.investors.p2":"Ce que nous avons construit, c’est la partie difficile à construire : un registre de programme validé, un système de contrôle adaptatif calibré par simulation et endurci contre les défaillances de long terme et adverses, une couche d’agents dont les propriétés de sécurité sont imposées plutôt que promises, et un modèle de sécurité conçu pour des clients institutionnels multi-tenant.","landing.investors.p3":"Ce que nous n’avons pas construit, c’est une entreprise avec des revenus. Nous sommes avant-lancement, avant-pilote et avant-accréditation, et nous préférons que vous l’appreniez ici plutôt qu’en due diligence.","landing.investors.cta1":"Demander la note technique","landing.investors.cta2":"Voir ce qui reste à finir","landing.investors.panel.h3":"Où va le capital","landing.investors.panel.tag":"Utilisation des fonds","landing.investors.term.content.dt":"Contenu","landing.investors.term.content.dd":"Contenu de leçons rédigé pour 33 métiers, revu par des praticiens de niveau compagnon. Le plus gros poste, et celui qui ne souffre aucun raccourci.","landing.investors.term.evidence.dt":"Preuves","landing.investors.term.evidence.dd":"Une évaluation en coin échelonné avec de vrais apprentis. Tant qu’elle n’a pas eu lieu, nos affirmations d’efficacité sont des résultats de simulation, et nous le dirons.","landing.investors.term.compliance.dt":"Conformité","landing.investors.term.compliance.dd":"Fenêtre d’observation SOC 2, audit d’accessibilité et VPAT, revue juridiction par juridiction avant toute affirmation de certification.","landing.investors.term.platform.dt":"Plateforme","landing.investors.term.platform.dd":"Identité, persistance, chiffrement et la couche opérationnelle qu’exige un lancement public.","landing.partners.kicker":"Pour les partenaires stratégiques","landing.partners.h2":"Syndicats, employeurs, et ceux qui possèdent les chantiers.","landing.partners.p":"Cette plateforme ne vaut rien sans les métiers eux-mêmes. Nous n’essayons pas de remplacer un apprentissage — nous essayons de lui donner de l’instrumentation, de la portée, et un moyen de mettre un apprenti de première année dans un espace confiné, un tableau sous tension ou une cabine de grue cent fois avant que cela ne compte pour de vrai.","landing.partners.panel.unions.h3":"Syndicats de métier","landing.partners.panel.unions.tag":"Autorité pédagogique","landing.partners.panel.unions.p":"Vos directeurs de formation possèdent le contenu de votre métier — les normes, la séquence, la validation. Nous fournissons le moteur, le simulateur et la piste de preuves. Votre ticket reste le vôtre ; nous ne délivrons pas de titres en votre nom et ne le ferons jamais.","landing.partners.panel.employers.h3":"Employeurs et entrepreneurs","landing.partners.panel.employers.tag":"Préparation du chantier","landing.partners.panel.employers.p":"Répétez un chantier précis avant que quiconque n’y mette les pieds — induction, conditions du permis, tournée des dangers, l’usine réelle. Les passations entre métiers, où débutent la plupart des incidents, sont pratiquées comme une compétence nommée avec sa propre évaluation.","landing.partners.panel.tech.h3":"Partenaires technologiques","landing.partners.panel.tech.tag":"Interopérabilité","landing.partners.panel.tech.p":"Tout émet en xAPI 1.0.3 vers votre LRS. Le catalogue de modules s’exporte en JSON ou CSV. La couche d’agents s’enregistre sur des protocoles d’agents ouverts. Nous préférons nous intégrer à votre système de référence plutôt que d’en devenir un.","landing.partners.cta":"Entamer une conversation de partenariat","landing.educators.kicker":"Pour les éducateurs et directeurs de formation","landing.educators.h2":"Vous gardez le jugement. Il tient la comptabilité.","landing.educators.p":"Un système adaptatif devrait rendre un instructeur plus puissant, pas superflu. Le nôtre est conçu pour que les décisions exigeant du jugement restent avec vous et celles exigeant de la mémoire restent avec lui — qui est bloqué et sur quoi, qui est en retard pour une révision, qui est prêt à être testé, et qui s’appuie discrètement sur l’aide depuis trois semaines.","landing.educators.tick1":"<b>Vous pouvez toujours passer outre.</b> Épinglez n’importe quel apprenant à n’importe quel niveau. Le contournement est journalisé, et le système sous-pondère cette preuve car il sait qu’il ne s’agit plus d’une mesure propre.","landing.educators.tick2":"<b>Vous voyez le raisonnement.</b> Chaque tâche servie porte la raison de son choix. Si vous êtes en désaccord avec le système, vous pouvez voir exactement ce qu’il croyait et pourquoi.","landing.educators.tick3":"<b>L’équité est surveillée, pas affirmée.</b> Les résultats sont comparés entre sites, langues, types d’appareils et tranches d’âge. Un écart supérieur à 10 % ouvre un ticket et bloque les publications — et ajuster discrètement les réglages d’une cohorte pour faire disparaître l’écart est lui-même signalé.","landing.educators.tick4":"<b>Il s’arrête plutôt que de deviner.</b> Si le calibrage dérive ou qu’une cohorte peine, l’adaptation s’arrête et tout le monde reçoit une difficulté fixe jusqu’à ce qu’une personne ait regardé.","landing.educators.cta":"Se renseigner sur un pilote","landing.educators.panel.h3":"Ce qu’un apprenant ne perd jamais","landing.educators.panel.tag":"Droits sur les données","landing.educators.panel.p1":"Les dossiers de formation sont conservés sous pseudonyme ; le lien vers une personne vit dans un service séparé qu’aucun rôle permanent ne peut lire. L’effacement rompt ce lien, ce qui le rend réel et non cosmétique.","landing.educators.panel.p2":"Les signaux d’état émotionnel — les estimations de flow et de frustration qu’utilise le cadran — sont les données <em>les plus</em> protégées que nous détenons, pas les moins. Elles sont conservées 90 jours, ne figurent jamais dans aucun export, et ne sont jamais visibles par un employeur.","landing.status.kicker":"État &mdash; publié délibérément","landing.status.h2":"Ce qui est construit, ce qui ne l’est pas, et ce que nous n’affirmerons pas.","landing.status.p":"L’edtech a un problème de crédibilité parce qu’elle décrit couramment ses intentions au présent. Voici l’état réel, et le même tableau est envoyé à chaque investisseur, partenaire et institution qui le demande.","landing.status.th.area":"Domaine","landing.status.th.state":"État","landing.status.th.detail":"Détail","landing.status.row1.area":"Système de contrôle adaptatif","landing.status.row1.pill":"Construit et testé","landing.status.row1.detail":"Calibré en simulation ; tient la fourchette cible environ 6&times; mieux qu’une difficulté fixe ou aléatoire, sur six archétypes d’apprenants.","landing.status.row2.area":"Catalogue de modules","landing.status.row2.pill":"Construit et vérifié","landing.status.row2.detail":"11 000 000 identifiants de module générés à partir de 25 875 objets rédigés, chacun prouvé unique sur l’ensemble de la population — pas un échantillon.","landing.status.row3.area":"Couche de sécurité des agents","landing.status.row3.pill":"Construit et testé","landing.status.row3.detail":"Les agents d’accompagnement ne peuvent pas écrire d’état de contrôle ; imposé à deux couches indépendantes et vérifié face à des agents délibérément malveillants.","landing.status.row4.area":"Modèle de sécurité","landing.status.row4.pill":"Construit et testé","landing.status.row4.detail":"Isolation des tenants, permissions refusées par défaut, accès d’identité limité dans le temps, rétention et effacement par classe.","landing.status.row5.area":"Contenu des leçons","landing.status.row5.pill":"Espace réservé","landing.status.row5.detail":"<b>Le chiffre de 11 000 000 compte des identifiants de module adressables, pas des leçons écrites à la main.</b> La structure, le séquençage et la logique d’évaluation sont réels et vérifiés ; le catalogue est généré à partir de 25 875 objets rédigés, et la prose des leçons attend d’être rédigée par des praticiens de niveau compagnon.","landing.status.row6.area":"Taxonomie des métiers","landing.status.row6.pill":"À nous, pas à eux","landing.status.row6.detail":"Les 111 salles sont notre taxonomie des métiers qualifiés. Ce ne sont pas des sections syndicales agréées, aucun syndicat n’a revu la liste, et le regroupement en districts est le nôtre.","landing.status.row7.area":"Preuves d’efficacité","landing.status.row7.pill":"Établies","landing.status.row7.detail":"Tous les résultats à ce jour sont des simulations. Aucune affirmation sur les résultats d’apprentissage n’est étayée tant que l’essai en coin échelonné avec de vrais apprentis n’a pas eu lieu.","landing.status.row8.area":"Accréditation et soutien syndical","landing.status.row8.pill":"Aucun","landing.status.row8.detail":"Nous ne détenons aucune accréditation et aucun syndicat n’a soutenu cette plateforme. Rien ici ne confère un titre reconnu.","landing.status.row9.area":"Plateforme de production","landing.status.row9.pill":"Non construite","landing.status.row9.detail":"L’authentification, le chiffrement, la persistance, les sauvegardes et la réponse aux incidents sont nécessaires avant un lancement public et n’existent pas encore.","landing.status.note":"Dix-sept défauts de protocole ont été trouvés et corrigés par simulation, essais d’endurance de longue durée et tests adverses — y compris un chemin de certification qui ne pouvait en réalité jamais certifier personne, un seul événement malformé pouvant corrompre définitivement le dossier d’un apprenant, et une règle d’estompage de l’aide qui était spécifiée, crue en vigueur, et n’avait jamais tourné une seule fois. La liste inclut ceux que nous avons trouvés dans nos propres contrôles, comme une assertion de mise en page fondée sur une constante devinée, fausse de 43 %, qui passait alors que quatre étiquettes débordaient. Nous publions la liste parce qu’un système qui n’a jamais trouvé de défaut en lui-même n’a pas regardé.","landing.footer.disclaimer":"<b>Veuillez lire cette partie.</b> Rien sur cette page n’est un titre reconnu, une accréditation, ou un soutien d’un syndicat ou d’un organisme de licence. Le contenu de formation est une bonne pratique générale et n’a pas été vérifié par rapport au code d’une quelconque juridiction. Le travail critique pour la sécurité doit être appris et validé par des personnes qualifiées sur de vrais chantiers.","map.key.live":"En service — rédigé, calibré, servi","map.key.calibrating":"Calibration — en service, la difficulté se stabilise encore","map.key.schema_ok":"Schéma OK — structure valide, pas encore calibré","map.key.draft":"Brouillon — non servi à personne","map.nav.aria":"autres surfaces","map.nav.3d":"environnement 3D","map.nav.interactive":"plan interactif","map.nav.geomap":"carte géographique du réseau","map.nav.dashboard":"tableau de bord du réseau","map.nav.wiki":"wiki","map.entry_road":"Entrée du réseau","map.titleblock.title":"Plan du réseau · Salles syndicales","map.titleblock.sheet":"Feuille","map.titleblock.rev":"Rév","map.titleblock.halls":"Salles","map.titleblock.modules":"Modules","map.titleblock.issued":"Émis","map.titleblock.review":"Révision","map.meta.halls":"salles syndicales","map.meta.modules":"modules sur le plan","map.meta.live":"en service","map.meta.sheet":"feuille","map.footer.p1":"<b>Chaque nombre sur ce plan est lu depuis le registre des modules</b> — le nombre de salles, de modules et les états de pipeline sont les valeurs propres du pack, pas des illustrations. La géographie est schématique : les bandes montrent comment les salles sont regroupées, pas des positions relevées.","map.footer.p2":"<b>Les intérieurs sont des programmes fonctionnels, pas des relevés.</b> Les salles de chaque hall proviennent des onze filières de compétence que ce hall enseigne réellement, et une salle ne reçoit du matériel de métier que lorsque la ligne de spécialité de ce métier le nomme — un hall de soudure a des cabines et une extraction de fumées parce que ses compétences le disent, un hall de placo n’en a pas. <b>Aucune donnée d’adresse n’a été collectée pour aucun hall</b>, donc chaque plan porte un bloc de site vide plutôt qu’une adresse inventée. L’état de mise en service sur chaque plan est lu depuis la part de modules en service de ce hall.","map.footer.p3":"Ce plan regroupe les salles du réseau par district, et non par un site de campus unique — chaque bandeau de district indique le campus construit auquel il appartient. Rien sur ce plan n'est une accréditation ou un soutien syndical, et le contenu des leçons est une pratique générale non vérifiée en attente de rédaction par des praticiens.","map.detail.no_address":"Adresse du site — non enregistrée","map.detail.of":"sur","map.detail.modules_word":"modules","map.detail.fixture":"équipement de métier","map.aria.plan":"Plan du réseau : {n} salles syndicales regroupées en huit districts sur {c} campus construits","map.aria.floor":"Plan d’étage de la salle {name} : {n} pièces","map.aria.hall"
