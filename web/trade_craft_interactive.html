uage.select":"भाषा","figures.halls":"{n} यूनियन हॉल","figures.modules":"{n} पता-योग्य मॉड्यूल","figures.districts":"{n} ज़िले","figures.lessons":"{n} लिखित पाठ स्थान","unit.levels":"स्तर","unit.skills":"कौशल","map.legend":"प्रत्येक हॉल अपने ज़िले के रंग में है; पहचान तीन-अक्षर कोड से होती है।","honesty.taxonomy":"यह कुशल व्यवसायों की एक वर्गीकरण प्रणाली है, पंजीकृत यूनियनों की सूची नहीं। किसी यूनियन ने इसकी समीक्षा नहीं की है और किसी स्थानीय शाखा का नाम नहीं लिया गया है।","honesty.modules":"मॉड्यूल की संख्याएँ लिखित ढाँचे से उत्पन्न पता-योग्य मॉड्यूल ID हैं, हाथ से लिखे पाठ नहीं।","honesty.content":"पाठ सामग्री असत्यापित सामान्य अभ्यास है, जो अनुभवी कारीगरों द्वारा लेखन की प्रतीक्षा में है।","honesty.translation":"व्यवसाय नामों के समीक्षित अनुवाद आने तक हॉल के नाम अंग्रेज़ी में रखे गए हैं।","map.layers":"परतें","map.layer.districts":"ज़िले","map.layer.pipeline":"पाइपलाइन स्थिति","map.layer.modules":"मॉड्यूल परतें","map.layer.stations":"प्रशिक्षण स्टेशन","hall.rooms":"फ़्लोर प्लान","hall.stations":"इस हॉल के स्टेशन","hall.skills":"कौशल जाल","station.checklist":"जाँच सूची","station.quiz":"परिदृश्य जाँच","ui.close":"बंद करें","ui.search":"हॉल खोजें","hall.enter3d":"3D परिवेश खोलें","hall.flippedUnit":"फ़्लिप्ड यूनिट","view.campus":"परिसर दृश्य","ui.walk":"चलें","hint.campus":"प्रवेश के लिए किसी हॉल पर क्लिक करें","hint.walk":"चलने के लिए WASD · बाहर निकलने के लिए Esc","view.region":"नेटवर्क दृश्य","figures.campuses":"{n} परिसर","room.finish":"फ़र्श की फिनिश","geo.note":"दिशाएँ वास्तविक; दूरियाँ संपीड़ित — लेबल वास्तविक किमी दिखाते हैं","sim.start":"सिम्युलेटर शुरू करें","sim.results":"परिणाम","sim.pass":"उत्तीर्ण","sim.retry":"फिर से प्रयास करें","sim.sound":"ध्वनि","sim.view":"दृश्य","sim.choose":"सिम्युलेटर चुनें","sim.operator":"ऑपरेटर से पूछें","progress.local":"प्रगति केवल इसी डिवाइस पर सहेजी जाती है।","city.note":"शहर परत: कैंपस के पास वास्तविक स्थान (प्रत्येक का असली स्तर खोलने पर दिखता है); सड़कें, पुल और जल योजनाबद्ध","chapters.hall":"क्षेत्रीय चैप्टर भवन","avatar.title":"अवतार","landing.nav.mission":"मिशन","landing.nav.how":"यह कैसे काम करता है","landing.nav.investors":"निवेशक","landing.nav.partners":"साझेदार","landing.nav.educators":"शिक्षक","landing.nav.status":"स्थिति","landing.hero.eyebrow":"AGI फ्यूचर फाउंडेशन का एक कार्यक्रम","landing.hero.title":"शिल्पकारों को ऐसे प्रशिक्षित करें जैसे <em>अगली सदी</em> उन्हीं पर निर्भर हो।","landing.hero.lede":"क्योंकि यह सच है। जो लोग ग्रिड की वायरिंग करते हैं, प्रेशर वेसल वेल्ड करते हैं, भार बाँधते हैं और प्लांट चलाते हैं, वही आगे आने वाली हर चीज़ का भौतिक निर्माण करेंगे — और उन्हें पिछली औद्योगिक क्रांति के लिए बनाए गए मॉडल पर प्रशिक्षित किया जा रहा है।","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy 111 ट्रेड यूनियनों के लिए एक अनुकूली प्रशिक्षण प्रणाली है: कार्यस्थलों का एक आभासी शहर जहाँ हर कार्य आपकी मौजूदा क्षमता की सीमा पर निर्धारित होता है, हर कोचिंग निर्णय खुद ही अपना कारण बताता है, और टिकट केवल तभी जारी होता है जब आपने बिना सहायता के काम करके दिखाया हो।","landing.facts.halls":"यूनियन हॉल, प्रत्येक की अपनी फ़्लोर योजना और 100 स्तर हैं","landing.facts.modules":"मॉड्यूल आईडी, प्रत्येक की विशिष्टता सत्यापित","landing.facts.band":"सफलता की वह सीमा जिस पर हर कार्य समायोजित किया जाता है","landing.facts.checks":"हर रिलीज़ को गेट करने वाली स्वचालित जांचें","landing.facts.defects":"प्रोटोकॉल की खामियाँ जो किसी भी शिक्षार्थी तक पहुँचने से पहले ही मिलीं और ठीक की गईं","landing.mission.kicker":"मिशन","landing.mission.h2":"कुशल कार्य कोई विकल्प नहीं है। यह नींव है।","landing.mission.p1":"दो पीढ़ियों से, ट्रेड प्रशिक्षण को उन लोगों के रास्ते के रूप में देखा गया है जिन्होंने दूसरा रास्ता नहीं चुना। यह नज़रिया हमेशा से गलत था, और अब यह महंगा साबित होने वाला है। डेटा सेंटरों को इलेक्ट्रीशियन चाहिए। विद्युतीकरण को लाइन वर्कर चाहिए। धरती पर हर जलवायु प्रतिबद्धता उन पाइपफिटरों, आयरनवर्करों और इंसुलेटरों के बारे में एक वादा है जो अभी अस्तित्व में ही नहीं हैं।","landing.mission.p2":"AGI फ्यूचर फाउंडेशन सार्वजनिक हित की शिक्षा अवसंरचना बनाता है। Trade Craft Academy एक विशिष्ट प्रश्न का उत्तर है: <b>यदि बुद्धिमान प्रणालियाँ अब सिखा सकती हैं, तो उन्हें सबसे पहले क्या सिखाना चाहिए?</b> हमारा उत्तर वह काम है जिसे स्वचालित नहीं किया जा सकता और जिसे वीडियो से नहीं सीखा जा सकता — कुशल भौतिक शिल्प, महारत तक सिखाया गया, ऐसे पैमाने पर जो किसी भी शिक्षुता प्रणाली ने पहले कभी नहीं छुआ।","landing.mission.h3":"हम स्वयं को किस कसौटी पर रखते हैं","landing.mission.tick1":"<b>न कभी ऊब, न कभी चिंता।</b> कठिनाई को प्रत्येक कौशल के लिए निरंतर वर्तमान क्षमता की सीमा पर समायोजित किया जाता है।","landing.mission.tick2":"<b>हर निर्णय खुद ही अपना कारण बताता है।</b> कोई शिक्षार्थी पूछ सकता है कि उसे कोई कार्य क्यों दिया गया, और उसे वही असली कारण मिलता है जो एक ऑडिटर उसी रिकॉर्ड से पढ़ता है।","landing.mission.tick3":"<b>एक टिकट का मतलब कुछ होता है।</b> प्रमाणन के लिए गेट कठिनाई पर प्रदर्शित, बिना सहायता वाला कार्य आवश्यक है। सहायता से इसे नहीं खरीदा जा सकता।","landing.mission.tick4":"<b>यह प्रणाली लोगों के प्रति जवाबदेह है।</b> प्रशिक्षक इसे override कर सकते हैं, शिक्षार्थी आसान दिन मांग सकते हैं, और यह बुरी तरह अनुकूलित होने के बजाय पूरी तरह अनुकूलन रोक देती है।","landing.how.kicker":"यह कैसे काम करता है","landing.how.h2":"एक उपकरण, कोई प्लेलिस्ट नहीं।","landing.how.p":"अधिकांश “अनुकूली” शिक्षण एक निश्चित क्रम है जिस पर कठिनाई का नॉब जोड़ दिया गया है। यह एक नियंत्रण प्रणाली है। यह अनुमान लगाती है कि आप क्या कर सकते हैं, ठीक उसी सीमा पर कार्य देती है, और कुछ भी प्रमाणित करने से पहले उस अनुमान को सिद्ध करती है।","landing.how.dial.h3":"डायल","landing.how.dial.p":"एक शिक्षार्थी प्रोफ़ाइल टेलीमेट्री — सटीकता, हिचकिचाहट, सहायता अनुरोध, सिम में नियंत्रण की सुगमता — को दक्षता के अनुमान में बदल देती है, और एक क्लोज़्ड-लूप नियंत्रक अनुमानित सफलता को <span class=\"mono\">0.70&ndash;0.85</span> के भीतर रखता है। बैंड से ऊपर ऊब है; नीचे चिंता। दोनों विफलताएँ हैं, और दोनों मुट्ठी भर कार्यों के भीतर ठीक कर दी जाती हैं।","landing.how.graph.h3":"ग्राफ़","landing.how.graph.p":"कौशल एक ग्राफ़ हैं, सूची नहीं। किसी कौशल पर प्रमाण उसकी पूर्वापेक्षाओं को प्रभावित करता है, भ्रामक जोड़ों को अलग रखा जाता है, और मार्च में जो आपने सीखा वह भूलने से पहले पुनरावलोकन के लिए वापस आता है। जब कोई अटक जाता है, तो प्रणाली यह निदान करती है कि <em>कौन-सी पूर्वापेक्षा</em> छूट रही है, बजाय इसके कि वही कार्य और कठिन बनाकर दोहराया जाए।","landing.how.gate.h3":"गेट","landing.how.gate.p":"अभ्यास बैंड के मध्य में चलता है, जहाँ सीखना होता है। प्रमाणन इसके शीर्ष पर चलता है, बिना सहायता के, संकेत बंद करके — एक जानबूझकर सत्यापन रन, क्योंकि अभ्यास की कठिनाई कभी भी महारत सिद्ध नहीं कर सकती। प्रमाणन एक ऐसा घटना है जो केवल-जोड़ने-योग्य रिकॉर्ड पर प्रदान की जाती है।","landing.how.coaches.h3":"कोच","landing.how.coaches.p":"हर हॉल में एक मेंटर एजेंट है जो अपने ट्रेड को जानता है। वे कोच करते हैं, समझाते हैं, और साइट पर कुछ गलत होने पर एक मानव प्रशिक्षक को मामला सौंप देते हैं। वे जो नहीं कर सकते वह है आपकी कठिनाई, आपका रिकॉर्ड या आपका प्रमाणन बदलना — यह कोड में लागू किया गया है, किसी प्रॉम्प्ट में नहीं माँगा गया।","landing.investors.kicker":"निवेशकों के लिए","landing.investors.h2":"अवसंरचना, अवसंरचना की तरह मूल्यांकित।","landing.investors.p1":"कुशल श्रमिकों में कार्यबल की कमी कोई मार्केटिंग थीसिस नहीं है; यह एक अंकगणितीय तथ्य है। हर औद्योगिक अर्थव्यवस्था में सेवानिवृत्ति, शिक्षुता में प्रवेश से आगे निकल रही है, और विद्युतीकरण व पुनः-औद्योगीकरण की बाधा लोग हैं, पूंजी नहीं।","landing.investors.p2":"हमने जो बनाया है वह वह हिस्सा है जिसे बनाना कठिन है: एक सत्यापित पाठ्यक्रम लेजर, एक अनुकूली नियंत्रण प्रणाली जिसे सिमुलेशन के विरुद्ध कैलिब्रेट किया गया है और दीर्घकालिक व प्रतिकूल विफलता के विरुद्ध मज़बूत बनाया गया है, एक एजेंट परत जिसके सुरक्षा गुण वादा नहीं बल्कि लागू किए गए हैं, और बहु-किरायेदार संस्थागत ग्राहकों के लिए डिज़ाइन किया गया एक सुरक्षा मॉडल।","landing.investors.p3":"हमने जो नहीं बनाया है वह राजस्व वाला व्यवसाय है। हम प्री-लॉन्च, प्री-पायलट और प्री-एक्रेडिटेशन चरण में हैं, और हम चाहते हैं कि आप यह बात यहीं जानें, न कि ड्यू डिलिजेंस में।","landing.investors.cta1":"तकनीकी संक्षिप्त विवरण मांगें","landing.investors.cta2":"देखें क्या अधूरा है","landing.investors.panel.h3":"पूंजी कहाँ जाती है","landing.investors.panel.tag":"निधियों का उपयोग","landing.investors.term.content.dt":"सामग्री","landing.investors.term.content.dd":"33 ट्रेडों में लिखित पाठ सामग्री, जिसे जर्नी-स्तर के व्यवसायियों द्वारा समीक्षित किया गया है। यह सबसे बड़ी एकल मद है, और वह जिसमें कोई शॉर्टकट नहीं लिया जा सकता।","landing.investors.term.evidence.dt":"साक्ष्य","landing.investors.term.evidence.dd":"वास्तविक शिक्षुओं के साथ एक स्टेप्ड-वेज मूल्यांकन। जब तक यह नहीं चल जाता, हमारे प्रभावशीलता के दावे सिमुलेशन परिणाम हैं और हम यह स्पष्ट रूप से कहेंगे।","landing.investors.term.compliance.dt":"अनुपालन","landing.investors.term.compliance.dd":"SOC 2 अवलोकन विंडो, पहुँच-योग्यता ऑडिट और VPAT, किसी भी प्रमाणन दावे से पहले क्षेत्राधिकार-दर-क्षेत्राधिकार समीक्षा।","landing.investors.term.platform.dt":"प्लेटफ़ॉर्म","landing.investors.term.platform.dd":"पहचान, स्थिरता, एन्क्रिप्शन, और वह परिचालन परत जो सार्वजनिक लॉन्च के लिए आवश्यक है।","landing.partners.kicker":"रणनीतिक साझेदारों के लिए","landing.partners.h2":"यूनियनें, नियोक्ता, और वे लोग जो कार्यस्थलों के मालिक हैं।","landing.partners.p":"यह मंच स्वयं व्यवसायों के बिना कुछ भी नहीं है। हम किसी शिक्षुता को बदलने की कोशिश नहीं कर रहे — हम उसे उपकरण, पहुँच, और एक तरीका देने की कोशिश कर रहे हैं ताकि पहले साल का एक शिक्षु किसी संकुचित स्थान, जीवित पैनल या क्रेन केबिन में असल में मायने रखने से पहले सौ बार अभ्यास कर सके।","landing.partners.panel.unions.h3":"ट्रेड यूनियनें","landing.partners.panel.unions.tag":"पाठ्यक्रम प्राधिकरण","landing.partners.panel.unions.p":"आपके प्रशिक्षण निदेशक आपके ट्रेड की सामग्री के मालिक हैं — मानक, क्रम, अनुमोदन। हम इंजन, सिम, और साक्ष्य ट्रेल प्रदान करते हैं। आपका टिकट आपका ही रहता है; हम आपके नाम पर प्रमाणपत्र जारी नहीं करते और कभी नहीं करेंगे।","landing.partners.panel.employers.h3":"नियोक्ता और ठेकेदार","landing.partners.panel.employers.tag":"साइट तैयारी","landing.partners.panel.employers.p":"किसी विशिष्ट साइट का पूर्वाभ्यास करें इससे पहले कि कोई वहाँ पैर रखे — इंडक्शन, परमिट शर्तें, खतरा वॉक, वास्तविक प्लांट। क्रॉस-ट्रेड हैंडऑफ़, जहाँ अधिकांश घटनाएँ शुरू होती हैं, को एक नामित कौशल के रूप में अपने स्वयं के मूल्यांकन के साथ अभ्यास कराया जाता है।","landing.partners.panel.tech.h3":"प्रौद्योगिकी साझेदार","landing.partners.panel.tech.tag":"अंतरसंचालनीयता","landing.partners.panel.tech.p":"सब कुछ आपके LRS को xAPI 1.0.3 उत्सर्जित करता है। मॉड्यूल सूची JSON या CSV के रूप में निर्यात होती है। एजेंट परत खुले एजेंट प्रोटोकॉल पर पंजीकृत होती है। हम आपके सिस्टम ऑफ़ रिकॉर्ड के साथ एकीकृत होना पसंद करेंगे, न कि स्वयं एक बन जाना।","landing.partners.cta":"साझेदारी वार्तालाप शुरू करें","landing.educators.kicker":"शिक्षकों और प्रशिक्षण निदेशकों के लिए","landing.educators.h2":"निर्णय आपके पास रहता है। लेखा-जोखा यह रखता है।","landing.educators.p":"एक अनुकूली प्रणाली को प्रशिक्षक को अधिक सशक्त बनाना चाहिए, अनावश्यक नहीं। हमारी प्रणाली इस तरह बनाई गई है कि निर्णय-क्षमता चाहने वाले निर्णय आपके पास रहें और स्मृति चाहने वाले निर्णय इसके पास — कौन कहाँ अटका है, किसकी समीक्षा बकाया है, कौन परीक्षण के लिए तैयार है, और कौन तीन हफ्तों से चुपचाप सहायता पर निर्भर है।","landing.educators.tick1":"<b>आप हमेशा override कर सकते हैं।</b> किसी भी शिक्षार्थी को किसी भी स्तर पर पिन करें। override लॉग किया जाता है, और प्रणाली उस साक्ष्य का भार घटा देती है क्योंकि वह जानती है कि यह अब एक स्वच्छ माप नहीं रहा।","landing.educators.tick2":"<b>आप तर्क देख सकते हैं।</b> दिया गया हर कार्य उस कारण के साथ आता है जिसके लिए उसे चुना गया। यदि आप प्रणाली से असहमत हैं, तो आप ठीक-ठीक देख सकते हैं कि उसने क्या माना और क्यों।","landing.educators.tick3":"<b>निष्पक्षता की निगरानी की जाती है, दावा नहीं किया जाता।</b> परिणामों की तुलना साइटों, भाषाओं, डिवाइस प्रकारों और आयु समूहों में की जाती है। 10% से अधिक का अंतर एक टिकट खोलता है और रिलीज़ को रोकता है — और किसी समूह की सेटिंग्स को चुपचाप बदलकर अंतर को गायब करना स्वयं ही फ़्लैग हो जाता है।","landing.educators.tick4":"<b>यह अनुमान लगाने के बजाय रुक जाती है।</b> यदि कैलिब्रेशन भटकता है या कोई समूह संघर्ष कर रहा है, तो अनुकूलन रुक जाता है और तब तक सभी को स्थिर कठिनाई दी जाती है जब तक कोई व्यक्ति इसे देख न ले।","landing.educators.cta":"पायलट के बारे में पूछें","landing.educators.panel.h3":"शिक्षार्थी कभी नहीं खोता","landing.educators.panel.tag":"डेटा अधिकार","landing.educators.panel.p1":"प्रशिक्षण रिकॉर्ड एक छद्म नाम के अंतर्गत रखे जाते हैं; किसी व्यक्ति से जुड़ाव एक अलग सेवा में रहता है जिसे कोई स्थायी भूमिका नहीं पढ़ सकती। मिटाना उस जुड़ाव को तोड़ देता है, जो इसे केवल दिखावटी नहीं बल्कि वास्तविक बनाता है।","landing.educators.panel.p2":"भावनात्मक-स्थिति संकेत — डायल द्वारा उपयोग किए जाने वाले फ़्लो और निराशा के अनुमान — हमारे पास मौजूद <em>सबसे अधिक</em> संरक्षित डेटा हैं, सबसे कम नहीं। इन्हें 90 दिनों तक रखा जाता है, किसी भी निर्यात में कभी शामिल नहीं किया जाता, और किसी नियोक्ता को कभी दिखाई नहीं देते।","landing.status.kicker":"स्थिति &mdash; जानबूझकर प्रकाशित","landing.status.h2":"क्या बनाया गया है, क्या नहीं, और हम क्या दावा नहीं करेंगे।","landing.status.p":"शिक्षा प्रौद्योगिकी में एक विश्वसनीयता समस्या है क्योंकि यह नियमित रूप से इरादों को वर्तमान काल में बताती है। यहाँ वास्तविक स्थिति है, और यही तालिका हर उस निवेशक, साझेदार और संस्था को भेजी जाती है जो पूछती है।","landing.status.th.area":"क्षेत्र","landing.status.th.state":"स्थिति","landing.status.th.detail":"विवरण","landing.status.row1.area":"अनुकूली नियंत्रण प्रणाली","landing.status.row1.pill":"निर्मित और परीक्षित","landing.status.row1.detail":"सिमुलेशन में कैलिब्रेटेड; छह शिक्षार्थी आर्किटाइप्स में निश्चित या यादृच्छिक कठिनाई की तुलना में लक्ष्य बैंड को लगभग 6&times; बेहतर बनाए रखता है।","landing.status.row2.area":"मॉड्यूल सूची","landing.status.row2.pill":"निर्मित और सत्यापित","landing.status.row2.detail":"25,875 लिखित ऑब्जेक्ट्स से उत्पन्न 11,000,000 मॉड्यूल आईडी, प्रत्येक की संपूर्ण जनसंख्या में विशिष्टता सिद्ध — नमूना नहीं।","landing.status.row3.area":"एजेंट सुरक्षा परत","landing.status.row3.pill":"निर्मित और परीक्षित","landing.status.row3.detail":"कोचिंग एजेंट नियंत्रण स्थिति नहीं लिख सकते; इसे दो स्वतंत्र परतों पर लागू किया गया है और जानबूझकर दुर्व्यवहार करने वाले एजेंटों के विरुद्ध सत्यापित किया गया है।","landing.status.row4.area":"सुरक्षा मॉडल","landing.status.row4.pill":"निर्मित और परीक्षित","landing.status.row4.detail":"किरायेदार अलगाव, डिफ़ॉल्ट-अस्वीकृति अनुमतियाँ, समय-सीमित पहचान पहुँच, प्रति-वर्ग प्रतिधारण और मिटाना।","landing.status.row5.area":"पाठ सामग्री","landing.status.row5.pill":"प्लेसहोल्डर","landing.status.row5.detail":"<b>11,000,000 का आंकड़ा एड्रेसेबल मॉड्यूल आईडी गिनता है, हाथ से लिखे गए पाठ नहीं।</b> संरचना, क्रम और मूल्यांकन तर्क वास्तविक और सत्यापित हैं; सूची 25,875 लिखित ऑब्जेक्ट्स से उत्पन्न होती है, और पाठ की गद्य सामग्री जर्नी-स्तर के व्यवसायियों द्वारा लिखे जाने की प्रतीक्षा कर रही है।","landing.status.row6.area":"ट्रेड वर्गीकरण","landing.status.row6.pill":"हमारा, उनका नहीं","landing.status.row6.detail":"111 हॉल हमारा कुशल व्यवसायों का वर्गीकरण हैं। ये चार्टर्ड स्थानीय इकाइयाँ नहीं हैं, किसी भी यूनियन ने सूची की समीक्षा नहीं की है, और जिलों में समूहीकरण हमारा अपना है।","landing.status.row7.area":"प्रभावशीलता साक्ष्य","landing.status.row7.pill":"स्थापित नहीं","landing.status.row7.detail":"अब तक के सभी परिणाम सिमुलेशन हैं। जब तक वास्तविक शिक्षुओं के साथ स्टेप्ड-वेज ट्रायल नहीं चलता, तब तक सीखने के परिणामों के बारे में कोई भी दावा समर्थित नहीं है।","landing.status.row8.area":"एक्रेडिटेशन और यूनियन समर्थन","landing.status.row8.pill":"कोई नहीं","landing.status.row8.detail":"हमारे पास कोई एक्रेडिटेशन नहीं है और किसी भी यूनियन ने इस मंच का समर्थन नहीं किया है। यहाँ कुछ भी मान्यता प्राप्त प्रमाणपत्र प्रदान नहीं करता।","landing.status.row9.area":"प्रोडक्शन प्लेटफ़ॉर्म","landing.status.row9.pill":"निर्मित नहीं","landing.status.row9.detail":"प्रामाणिकीकरण, एन्क्रिप्शन, स्थिरता, बैकअप और घटना प्रतिक्रिया सार्वजनिक लॉन्च से पहले आवश्यक हैं और अभी तक मौजूद नहीं हैं।","landing.status.note":"सिमुलेशन, दीर्घकालिक सोक परीक्षण और प्रतिकूल परीक्षण के माध्यम से सत्रह प्रोटोकॉल दोष पाए गए और ठीक किए गए — जिनमें एक प्रमाणन पथ शामिल था जो वास्तव में किसी को कभी प्रमाणित नहीं कर सकता था, एक एकल विकृत घटना जो किसी शिक्षार्थी के रिकॉर्ड को स्थायी रूप से भ्रष्ट कर सकती थी, और एक सहायता-क्षीणन नियम जो निर्दिष्ट था, लागू माना जाता था, और कभी एक बार भी नहीं चला था। सूची में वे भी शामिल हैं जो हमने अपनी ही जांचों में पाए, जैसे एक अनुमानित स्थिरांक पर बनाया गया लेआउट अभिकथन जो 43% गलत था और चार लेबलों के ओवरफ़्लो होने के बावजूद पास हो गया। हम यह सूची इसलिए प्रकाशित करते हैं क्योंकि जिस प्रणाली ने कभी अपने भीतर कोई दोष नहीं पाया, उसने देखा ही नहीं है।","landing.footer.disclaimer":"<b>कृपया यह हिस्सा पढ़ें।</b> इस पृष्ठ पर कुछ भी मान्यता प्राप्त प्रमाणपत्र, एक्रेडिटेशन, या किसी भी ट्रेड यूनियन या लाइसेंसिंग निकाय का समर्थन नहीं है। प्रशिक्षण सामग्री सामान्य अच्छी प्रथा है और इसे किसी भी क्षेत्राधिकार की संहिता के विरुद्ध सत्यापित नहीं किया गया है। सुरक्षा-महत्वपूर्ण कार्य असली साइटों पर योग्य लोगों द्वारा सीखा और अनुमोदित किया जाना चाहिए।","map.key.live":"लाइव — लिखित, कैलिब्रेटेड, सेवारत","map.key.calibrating":"कैलिब्रेट हो रहा है — सेवारत, कठिनाई अभी स्थिर हो रही है","map.key.schema_ok":"स्कीमा ठीक है — संरचना मान्य, अभी कैलिब्रेट नहीं हुई","map.key.draft":"ड्राफ्ट — किसी को भी उपलब्ध नहीं","map.nav.aria":"अन्य सतहें","map.nav.3d":"3D परिवेश","map.nav.interactive":"इंटरैक्टिव मानचित्र","map.nav.geomap":"नेटवर्क जियोमैप","map.nav.dashboard":"नेटवर्क डैशबोर्ड","map.nav.wiki":"विकी","map.entry_road":"नेटवर्क प्रवेश","map.titleblock.title":"नेटवर्क योजना · यूनियन हॉल","map.titleblock.sheet":"शीट","map.titleblock.rev":"रिव","map.titleblock.halls":"हॉल","map.titleblock.modules":"मॉड्यूल","map.titleblock.issued":"जारी","map.titleblock.review":"समीक्षा","map.meta.halls":"यूनियन हॉल","map.meta.modules":"योजना में मॉड्यूल","map.meta.live":"लाइव","map.meta.sheet":"शीट","map.footer.p1":"<b>इस योजना पर हर संख्या मॉड्यूल रजिस्ट्री से पढ़ी जाती है</b> — हॉल गणना, मॉड्यूल गणना और पाइपलाइन स्थितियाँ पैक के अपने मान हैं, चित्रण नहीं। भूगोल योजनाबद्ध है: बैंड दिखाते हैं कि हॉल कैसे समूहीकृत हैं, सर्वेक्षित स्थिति नहीं।","map.footer.p2":"<b>इंटीरियर कार्यात्मक कार्यक्रम हैं, सर्वेक्षण नहीं।</b> हर हॉल के कमरे उन ग्यारह कौशल धाराओं से आते हैं जो वह हॉल वास्तव में सिखाता है, और कोई कमरा केवल तभी ट्रेड फिक्स्चर पाता है जब उस ट्रेड की अपनी फोकस लाइन उन्हें नाम देती है — एक वेल्डिंग हॉल को बूथ और फ्यूम एक्सट्रैक्शन मिलता है क्योंकि उसके कौशल ऐसा कहते हैं, और एक ड्राईवॉल हॉल को नहीं मिलता। <b>किसी भी हॉल के लिए पता डेटा एकत्र नहीं किया गया है</b>, इसलिए हर योजना में एक आविष्कृत सड़क पते के बजाय एक खाली साइट ब्लॉक होता है। हर योजना पर कमीशनिंग स्थिति उस हॉल के लाइव-मॉड्यूल हिस्से से पढ़ी जाती है।","map.footer.p3":"यह नेटवर्क के हॉलों की योजना है, जो जिलों के अनुसार समूहीकृत है, न कि किसी एक कैंपस साइट की — प्रत्येक जिला बैंड उस निर्मित कैंपस का नाम बताता है जिससे वह संबंधित है। इस योजना में कुछ भी एक्रेडिटेशन या यूनियन समर्थन नहीं है, और पाठ सामग्री व्यवसायियों द्वारा लिखे जाने की प्रतीक्षा में एक असत्यापित सामान्य प्रथा है।","map.detail.no_address":"साइट पता — दर्ज नहीं","map.detail.of":"का","map.detail.modules_word":"मॉड्यूल","map.detail.fixture":"ट्रेड फिक्स्चर","map.aria.plan":"नेटवर्क योजना: {n} यूनियन हॉल, आठ जिलों में समूहीकृत, {c} निर्मित कैंपस में फैले","map.aria.floor":"{name} हॉल की फ़्लोर योजना: {n} कमरे","map.aria.hall":"{name} — {district} जिला, ग्रिड {ref}","map.page_title":"नेटवर्क योजना"},"districts":{"structural":{"name":"संरचनात्मक","tagline":"इस्पात, वेल्ड, उठान और उनके भार"},"envelope":{"name":"आवरण और फ़िनिश","tagline":"ढाँचे और मौसम के बीच की हर चीज़"},"systems":{"name":"भवन प्रणालियाँ","tagline":"बिजली, प्रक्रिया, वायु, नियंत्रण और डेटा"},"energy":{"name":"ऊर्जा और उपयोगिताएँ","tagline":"उत्पादन, वितरण, जल और आपदा कार्य"},"earthworks":{"name":"मिट्टी कार्य और मशीनें","tagline":"ज़मीन, मशीनें, पहुँच और ढुलाई"},"industry":{"name":"भारी उद्योग","tagline":"प्रक्रिया संयंत्र, समुद्री, धातु और मशीन शॉप"},"transport":{"name":"परिवहन और गतिशीलता","tagline":"रेल, वायु, बंदरगाह और बेड़ा"},"control":{"name":"सर्वेक्षण, सुरक्षा और पर्यावरण","tagline":"जहाँ काम की रेखा खिंचती है, सुरक्षा होती है और सफ़ाई होती है"}},"strands":{"safety":"सुरक्षा","layout":"लेआउट","materials":"सामग्री","tools":"औज़ार","machines":"मशीनें","procedure":"प्रक्रिया","inspection":"निरीक्षण","documentation":"दस्तावेज़ीकरण","coordination":"समन्वय","troubleshooting":"समस्या-निवारण","leadership":"नेतृत्व"},"tiers":{"fundamentals":"बुनियादी","applied":"अनुप्रयुक्त","mastery":"निपुणता"},"states":{"draft":"प्रारूप","schema_ok":"स्कीमा ठीक","calibrating":"अंशांकन","live":"चालू"}},"pt":{"language":"Português","dir":"ltr","strings":{"tagline":"Treinamento gamificado para aprimorar a integração entre robôs e pessoas","overview":"Uma rede de {halls} salões sindicais de formação em {campuses} campi, todos executando a mesma suíte de protocolos adaptativos: um dial de dificuldade que mantém a zona de desenvolvimento proximal, um grafo de habilidades que sequencia a prática, portões de avaliação que certificam apenas trabalho sem ajuda e uma malha de mentores que desvanece seu próprio andaime.","nav.campus":"Mapa do campus","nav.spec":"Especificação do protocolo","nav.console":"Console adaptativo","nav.roadmap":"Roteiro","nav.wiki":"Wiki","language.select":"Idioma","figures.halls":"{n} salões sindicais","figures.modules":"{n} módulos endereçáveis","figures.districts":"{n} distritos","figures.lessons":"{n} posições de lição redigidas","unit.levels":"níveis","unit.skills":"habilidades","map.legend":"Cada salão é colorido pelo seu distrito; a identidade é carregada por um código de três letras.","honesty.taxonomy":"Isto é uma taxonomia de ofícios qualificados, não um cadastro de sindicatos constituídos. Nenhum sindicato a revisou e nenhuma seção local é nomeada.","honesty.modules":"As contagens de módulos são IDs endereçáveis gerados de um esqueleto redigido, não lições escritas à mão.","honesty.content":"O conteúdo das lições é prática geral não verificada, aguardando redação por profissionais de ofício.","honesty.translation":"Os nomes dos salões permanecem em inglês até haver traduções revisadas dos nomes dos ofícios.","map.layers":"Camadas","map.layer.districts":"Distritos","map.layer.pipeline":"Estado do pipeline","map.layer.modules":"Camadas de módulos","map.layer.stations":"Estações de treinamento","hall.rooms":"Planta baixa","hall.stations":"Estações neste salão","hall.skills":"Retícula de habilidades","station.checklist":"Lista de verificação","station.quiz":"Cenário de verificação","ui.close":"Fechar","ui.search":"Buscar salões","hall.enter3d":"Abrir ambiente 3D","hall.flippedUnit":"unidade invertida","view.campus":"Vista do campus","ui.walk":"Caminhar","hint.campus":"Clique em um salão para entrar","hint.walk":"WASD para mover · Esc para sair","view.region":"Vista da rede","figures.campuses":"{n} campi","room.finish":"Acabamento do piso","geo.note":"Rumos reais; distâncias comprimidas — os rótulos trazem km reais","sim.start":"Iniciar simulador","sim.results":"Resultados","sim.pass":"Aprovado","sim.retry":"Tentar novamente","sim.sound":"Som","sim.view":"Vista","sim.choose":"Escolha um simulador","sim.operator":"Perguntar ao operador","progress.local":"O progresso é salvo somente neste dispositivo.","city.note":"Camada urbana: locais reais perto do campus (o nível real de cada um aparece ao abrir); ruas, pontes e águas esquemáticas","chapters.hall":"Sede regional de capítulos","avatar.title":"Avatar","landing.nav.mission":"Missão","landing.nav.how":"Como funciona","landing.nav.investors":"Investidores","landing.nav.partners":"Parceiros","landing.nav.educators":"Educadores","landing.nav.status":"Estado","landing.hero.eyebrow":"Um programa da AGI Future Foundation","landing.hero.title":"Forme os ofícios como se o <em>próximo século</em> dependesse deles.","landing.hero.lede":"Porque é verdade. As pessoas que fazem a fiação da rede, soldam vasos de pressão, cabeiam cargas e operam a planta são as que vão construir fisicamente o que vier a seguir — e estão sendo formadas com um modelo desenhado para a última revolução industrial.","landing.hero.lede2":"SmartCiti.X : Trade Craft Academy é um sistema de treinamento adaptativo para 111 sindicatos: uma cidade virtual de canteiros de obras onde cada tarefa é ajustada no limite do que você já sabe fazer, cada decisão de orientação se explica por si só, e um certificado só é emitido quando você demonstrou o trabalho sem ajuda.","landing.facts.halls":"salões sindicais, cada um com uma planta baixa e 100 níveis","landing.facts.modules":"IDs de módulo, cada um verificado como único","landing.facts.band":"a faixa de sucesso em que cada tarefa é ajustada","landing.facts.checks":"verificações automatizadas que condicionam cada versão","landing.facts.defects":"defeitos de protocolo encontrados e corrigidos antes que qualquer aluno os visse","landing.mission.kicker":"A missão","landing.mission.h2":"O trabalho qualificado não é um plano B. É o alicerce.","landing.mission.p1":"Por duas gerações, a formação em ofícios foi tratada como o caminho de quem não seguiu o outro. Esse enquadramento sempre esteve errado, e está prestes a ficar caro. Data centers precisam de eletricistas. A eletrificação precisa de linheiros. Todo compromisso climático do planeta é uma promessa sobre tubistas, montadores de estruturas metálicas e isoladores que ainda não existem.","landing.mission.p2":"A AGI Future Foundation constrói infraestrutura educacional de interesse público. Trade Craft Academy é sua resposta a uma pergunta específica: <b>se sistemas inteligentes já podem ensinar, o que deveriam ensinar primeiro?</b> Nossa resposta é o trabalho que não pode ser automatizado nem aprendido em um vídeo — ofício físico qualificado, ensinado até o domínio pleno, em uma escala que nenhum sistema de aprendizagem jamais alcançou.","landing.mission.h3":"Aquilo a que nos comprometemos","landing.mission.tick1":"<b>Nunca tédio, nunca ansiedade.</b> A dificuldade é regulada continuamente no limite da capacidade atual, habilidade por habilidade.","landing.mission.tick2":"<b>Cada decisão se explica por si só.</b> Um aluno pode perguntar por que recebeu determinada tarefa e obter o motivo real, do mesmo registro que um auditor lê.","landing.mission.tick3":"<b>Um certificado significa algo.</b> A certificação exige trabalho demonstrado, sem ajuda, na dificuldade do portão. A ajuda não pode comprá-la.","landing.mission.tick4":"<b>O sistema responde a pessoas.</b> Instrutores podem sobrepor-se a ele, alunos podem pedir um dia mais fácil, e ele prefere parar de se adaptar por completo a se adaptar mal.","landing.how.kicker":"Como funciona","landing.how.h2":"Um instrumento, não uma lista de reprodução.","landing.how.p":"A maioria do aprendizado &ldquo;adaptativo&rdquo; é uma sequência fixa com um botão de dificuldade aparafusado. Isto é um sistema de controle. Ele estima o que você consegue fazer, entrega trabalho bem nesse limite, e prova a estimativa antes de certificar qualquer coisa.","landing.how.dial.h3":"O mostrador","landing.how.dial.p":"Um perfil de aluno transforma telemetria — precisão, hesitação, pedidos de ajuda, suavidade de controle no simulador — em uma estimativa de proficiência, e um controlador de malha fechada mantém o sucesso previsto dentro de <span class=\"mono\">0.70&ndash;0.85</span>. Acima da faixa está o tédio; abaixo, a ansiedade. Ambos são falhas, e ambos são corrigidos em poucas tarefas.","landing.how.graph.h3":"O grafo","landing.how.graph.p":"Habilidades formam um grafo, não uma lista. Evidências sobre uma habilidade movem seus pré-requisitos, pares confundíveis são mantidos separados, e o que você aprendeu em março volta para revisão antes que você o esqueça. Quando alguém trava, o sistema diagnostica <em>qual pré-requisito</em> está faltando em vez de repetir a mesma tarefa mais difícil.","landing.how.gate.h3":"O portão","landing.how.gate.p":"A prática ocorre no meio da faixa, onde o aprendizado acontece. A certificação ocorre no topo dela, sem ajuda, com dicas fechadas — uma passagem de verificação deliberada, porque a dificuldade de prática nunca pode provar domínio. A certificação é um evento concedido em um registro somente de anexação.","landing.how.coaches.h3":"Os treinadores","landing.how.coaches.p":"Cada salão tem um agente mentor que conhece seu ofício. Eles orientam, explicam e escalam a um instrutor humano quando algo está errado no local. O que eles não podem fazer é mudar sua dificuldade, seu registro ou sua certificação — isso é imposto no código, não pedido em um prompt.","landing.investors.kicker":"Para investidores","landing.investors.h2":"Infraestrutura, precificada como infraestrutura.","landing.investors.p1":"A lacuna de mão de obra em ofícios qualificados não é uma tese de marketing; é aritmética. Aposentadorias estão superando a entrada de aprendizes em toda economia industrializada, e a restrição para eletrificação e reindustrialização são pessoas, não capital.","landing.investors.p2":"O que construímos é a parte difícil de construir: um livro-razão de currículo validado, um sistema de controle adaptativo calibrado contra simulação e endurecido contra falhas de longo prazo e adversariais, uma camada de agentes cujas propriedades de segurança são impostas, não prometidas, e um modelo de segurança projetado para clientes institucionais multilocatário.","landing.investors.p3":"O que não construímos é um negócio com receita. Estamos em pré-lançamento, pré-piloto e pré-credenciamento, e preferimos que você saiba disso aqui do que na diligência.","landing.investors.cta1":"Solicitar o resumo técnico","landing.investors.cta2":"Ver o que ainda está inacabado","landing.investors.panel.h3":"Para onde vai o capital","landing.investors.panel.tag":"Uso dos recursos","landing.investors.term.content.dt":"Conteúdo","landing.investors.term.content.dd":"Conteúdo de lições redigido em 33 ofícios, revisado por profissionais de nível journeyman. A maior linha isolada, e a que não admite atalhos.","landing.investors.term.evidence.dt":"Evidências","landing.investors.term.evidence.dd":"Uma avaliação stepped-wedge com aprendizes reais. Até que isso ocorra, nossas alegações de eficácia são resultados de simulação, e diremos isso claramente.","landing.investors.term.compliance.dt":"Conformidade","landing.investors.term.compliance.dd":"Janela de observação SOC 2, auditoria de acessibilidade e VPAT, revisão jurisdição por jurisdição antes de qualquer alegação de certificação.","landing.investors.term.platform.dt":"Plataforma","landing.investors.term.platform.dd":"Identidade, persistência, criptografia e a camada operacional que um lançamento público exige.","landing.partners.kicker":"Para parceiros estratégicos","landing.partners.h2":"Sindicatos, empregadores e quem é dono dos canteiros de obras.","landing.partners.p":"Esta plataforma não vale nada sem os próprios ofícios. Não estamos tentando substituir um aprendizado — estamos tentando dar a ele instrumentação, alcance, e uma forma de colocar um aprendiz de primeiro ano em um espaço confinado, um painel energizado ou uma cabine de guindaste cem vezes antes que conte de verdade.","landing.partners.panel.unions.h3":"Sindicatos","landing.partners.panel.unions.tag":"Autoridade curricular","landing.partners.panel.unions.p":"Seus diretores de treinamento são donos do conteúdo do seu ofício — os padrões, a sequência, a aprovação final. Fornecemos o motor, o simulador e a trilha de evidências. Seu certificado continua seu; não emitimos credenciais em seu nome e nunca emitiremos.","landing.partners.panel.employers.h3":"Empregadores e empreiteiros","landing.partners.panel.employers.tag":"Prontidão do canteiro","landing.partners.panel.employers.p":"Ensaie um canteiro específico antes que alguém ponha os pés nele — indução, condições da permissão, caminhada de riscos, a planta real. Transferências entre ofícios, onde a maioria dos incidentes começa, são praticadas como uma habilidade nomeada com sua própria avaliação.","landing.partners.panel.tech.h3":"Parceiros de tecnologia","landing.partners.panel.tech.tag":"Interoperabilidade","landing.partners.panel.tech.p":"Tudo emite xAPI 1.0.3 para o seu LRS. O catálogo de módulos exporta como JSON ou CSV. A camada de agentes se registra em protocolos de agentes abertos. Preferimos nos integrar ao seu sistema de registro a nos tornarmos um.","landing.partners.cta":"Iniciar uma conversa de parceria","landing.educators.kicker":"Para educadores e diretores de treinamento","landing.educators.h2":"Você mantém o julgamento. Ele mantém os registros.","landing.educators.p":"Um sistema adaptativo deveria tornar um instrutor mais poderoso, não redundante. O nosso é construído para que as decisões que exigem julgamento fiquem com você e as que exigem memória fiquem com ele — quem está travado e em quê, quem está atrasado para revisão, quem está pronto para ser testado, e quem vem discretamente se apoiando em ajuda há três semanas.","landing.educators.tick1":"<b>Você sempre pode sobrepor.</b> Fixe qualquer aluno em qualquer nível. A sobreposição é registrada, e o sistema reduz o peso dessa evidência porque sabe que não é mais uma medição limpa.","landing.educators.tick2":"<b>Você vê o raciocínio.</b> Cada tarefa entregue carrega o motivo pelo qual foi escolhida. Se você discordar do sistema, pode ver exatamente o que ele acreditava e por quê.","landing.educators.tick3":"<b>A equidade é monitorada, não afirmada.</b> Resultados são comparados entre sites, idiomas, tipos de dispositivo e faixas etárias. Uma diferença acima de 10% abre um chamado e bloqueia lançamentos — e ajustar silenciosamente as configurações de uma coorte para fazer a diferença desaparecer é, por si só, sinalizado.","landing.educators.tick4":"<b>Ele para em vez de adivinhar.</b> Se a calibração desvia ou uma coorte está com dificuldade, a adaptação para e todos recebem dificuldade fixa até que um humano tenha analisado.","landing.educators.cta":"Perguntar sobre um piloto","landing.educators.panel.h3":"O que um aluno nunca perde","landing.educators.panel.tag":"Direitos sobre dados","landing.educators.panel.p1":"Registros de treinamento são mantidos sob um pseudônimo; o vínculo com uma pessoa vive em um serviço separado que nenhum papel permanente pode ler. O apagamento quebra esse vínculo, o que o torna real, não cosmético.","landing.educators.panel.p2":"Sinais de estado emocional — as estimativas de fluxo e frustração que o mostrador usa — são os dados <em>mais</em> protegidos que mantemos, não os menos. São mantidos por 90 dias, nunca incluídos em nenhuma exportação, e nunca visíveis para um empregador.","landing.status.kicker":"Status &mdash; publicado deliberadamente","landing.status.h2":"O que está construído, o que não está, e o que não vamos alegar.","landing.status.p":"A tecnologia educacional tem um problema de credibilidade porque descreve rotineiramente intenções no presente. Aqui está o estado real, e a mesma tabela vai para todo investidor, parceiro e instituição que perguntar.","landing.status.th.area":"Área","landing.status.th.state":"Estado","landing.status.th.detail":"Detalhe","landing.status.row1.area":"Sistema de controle adaptativo","landing.status.row1.pill":"Construído e testado","landing.status.row1.detail":"Calibrado em simulação; mantém a faixa alvo cerca de 6&times; melhor que dificuldade fixa ou aleatória em seis arquétipos de aluno.","landing.status.row2.area":"Catálogo de módulos","landing.status.row2.pill":"Construído e verificado","landing.status.row2.detail":"11.000.000 IDs de módulo gerados a partir de 25.875 objetos redigidos, cada um provado único em toda a população — não uma amostra.","landing.status.row3.area":"Camada de segurança de agentes","landing.status.row3.pill":"Construído e testado","landing.status.row3.detail":"Agentes de orientação não podem escrever estado de controle; imposto em duas camadas independentes e verificado contra agentes deliberadamente malcomportados.","landing.status.row4.area":"Modelo de segurança","landing.status.row4.pill":"Construído e testado","landing.status.row4.detail":"Isolamento de locatário, permissões negadas por padrão, acesso de identidade limitado no tempo, retenção e apagamento por classe.","landing.status.row5.area":"Conteúdo das lições","landing.status.row5.pill":"Espaço reservado","landing.status.row5.detail":"<b>O número 11.000.000 conta IDs de módulo endereçáveis, não lições escritas à mão.</b> Estrutura, sequenciamento e lógica de avaliação são reais e verificados; o catálogo é gerado a partir de 25.875 objetos redigidos, e a prosa das lições aguarda autoria por profissionais de nível journeyman.","landing.status.row6.area":"Taxonomia de ofícios","landing.status.row6.pill":"Nossa, não deles","landing.status.row6.detail":"Os 111 salões são nossa taxonomia de ofícios qualificados. Não são seções sindicais licenciadas, nenhum sindicato revisou a lista, e o agrupamento em distritos é nosso.","landing.status.row7.area":"Evidência de eficácia","landing.status.row7.pill":"Não estabelecida","landing.status.row7.detail":"Todos os resultados até agora são de simulação. Nenhuma alegação sobre resultados de aprendizagem é sustentada até que o ensaio stepped-wedge com aprendizes reais ocorra.","landing.status.row8.area":"Credenciamento e endosso sindical","landing.status.row8.pill":"Nenhum","landing.status.row8.detail":"Não possuímos nenhum credenciamento e nenhum sindicato endossou esta plataforma. Nada aqui confere uma credencial reconhecida.","landing.status.row9.area":"Plataforma de produção","landing.status.row9.pill":"Não construída","landing.status.row9.detail":"Autenticação, criptografia, persistência, backups e resposta a incidentes são necessários antes do lançamento público e ainda não existem.","landing.status.note":"Dezessete defeitos de protocolo foram encontrados e corrigidos por simulação, testes de resistência de longa duração e testes adversariais — incluindo um caminho de certificação que nunca conseguia certificar ninguém de fato, um único evento malformado capaz de corromper permanentemente o registro de um aluno, e uma regra de esmaecimento de ajuda que estava especificada, acreditava-se em vigor, e nunca havia rodado uma única vez. A lista inclui os que encontramos em nossas próprias verificações, como uma asserção de layout baseada em uma constante estimada que estava 43% errada e passava enquanto quatro rótulos transbordavam. Publicamos a lista porque um sistema que nunca encontrou uma falha em si mesmo não olhou.","landing.footer.disclaimer":"<b>Por favor, leia esta parte.</b> Nada nesta página é uma credencial reconhecida, um credenciamento, ou um endosso de qualquer sindicato ou órgão licenciador. O conteúdo de treinamento é boa prática geral e não foi verificado contra o código de nenhuma jurisdição. Trabalho crítico de segurança deve ser aprendido e aprovado por pessoas qualificadas em canteiros reais.","map.key.live":"Ao vivo — redigido, calibrado, em serviço","map.key.calibrating":"Calibrando — em serviço, a dificuldade ainda está se ajustando","map.key.schema_ok":"Esquema OK — estrutura válida, ainda não calibrado","map.key.draft":"Rascunho — não servido a ninguém","map.nav.aria":"outras superfícies","map.nav.3d":"ambiente 3D","map.nav.interactive":"mapa interativo","map.nav.geomap":"geomapa da rede","map.nav.dashboard":"painel da rede","map.nav.wiki":"wiki","map.entry_road":"Entrada da rede","map.titleblock.title":"Planta da rede · Salões sindicais","map.titleblock.sheet":"Folha","map.titleblock.rev":"Rev","map.titleblock.halls":"Salões","map.titleblock.modules":"Módulos","map.titleblock.issued":"Emitido","map.titleblock.review":"Revisão","map.meta.halls":"salões sindicais","map.meta.modules":"módulos na planta","map.meta.live":"ao vivo","map.meta.sheet":"folha","map.footer.p1":"<b>Todo número neste plano é lido do registro de módulos</b> — contagens de salões, de módulos e estados de pipeline são valores próprios do pacote, não ilustrações. A geografia é esquemática: as faixas mostram como os salões são agrupados, não posições levantadas topograficamente.","map.footer.p2":"<b>Os interiores são programas funcionais, não levantamentos.</b> As salas de cada salão vêm das onze trilhas de habilidade que esse salão de fato ensina, e uma sala só ganha equipamentos de ofício quando a própria linha de foco daquele ofício os nomeia — um salão de solda tem cabines e exaustão de fumaça porque suas habilidades dizem isso, e um salão de drywall não. <b>Nenhum dado de endereço foi coletado para nenhum salão</b>, então cada planta traz um bloco de local vazio em vez de um endereço inventado. O estado de comissionamento em cada planta é lido a partir da fração de módulos ao vivo daquele salão.","map.footer.p3":"Este é um plano dos salões da rede agrupados por distrito, não um único campus — cada faixa de distrito indica o campus construído ao qual pertence. Nada neste plano é um credenciamento ou endosso sindical, e o conteúdo das lições é prática geral não verificada aguardando autoria por profissionais.","map.detail.no_address":"Endereço do local — não registrado","map.detail.of":"de","map.detail.modules_word":"módulos","map.detail.fixture":"equipamento de ofício","map.aria.plan":"Planta da rede: {n} salões sindicais agrupados em oito distritos em {c} campi construídos","map.aria.floor":"Planta baixa do salão {name}: {n} salas","map.aria.hall":"{name} — distrito {district}, grade {ref}","map.page_title":"Planta da rede"},"districts":{"structural":{"name":"Estrutural","tagline":"Aço, soldas, içamentos e as cargas que eles carregam"},"envelope":{"name":"Envoltória e Acabamento","tagline":"Tudo entre a estrutura e o tempo"},"systems":{"name":"Sistemas Prediais","tagline":"Energia, processos, ar, controles e dados"},"energy":{"name":"Energia e Utilidades","tagline":"Geração, distribuição, água e trabalho de tempestade"},"earthworks":{"name":"Terraplenagem e Equipamentos","tagline":"Solo, máquinas, acessos e transporte"},"industry":{"name":"Indústria Pesada","tagline":"Plantas de processo, marinha, metal e oficinas mecânicas"},"transport":{"name":"Transporte e Mobilidade","tagline":"Ferrovia, ar, porto e frota"},"control":{"name":"Topografia, Segurança e Meio Ambiente","tagline":"Onde o trabalho é locado, protegido e limpo"}},"strands":{"safety":"Segurança","layout":"Locação","materials":"Materiais","tools":"Ferramentas","machines":"Máquinas","procedure":"Procedimento","inspection":"Inspeção","documentation":"Documentação","coordination":"Coordenação","troubleshooting":"Diagnóstico de falhas","leadership":"Liderança"},"tiers":{"fundamentals":"Fundamentos","applied":"Aplicado","mastery":"Maestria"},"states":{"draft":"Rascunho","schema_ok":"Esquema OK","calibrating":"Calibrando","live":"Em produção"}},"zh":{"language":"中文（简体）","dir":"ltr","strings":{"tagline":"以游戏化培训促进机器人与人类的协同融合","overview":"分布在 {campuses} 个园区的 {halls} 座工会培训馆组成网络，全部运行同一套自适应协议：难度旋钮保持最近发展区，技能图谱编排练习顺序，考核关卡只认证独立完成的作业，导师系统则逐步撤除自己搭起的脚手架。","nav.campus":"园区地图","nav.spec":"协议规范","nav.console":"自适应控制台","nav.roadmap":"路线图","nav.wiki":"维基","language.select":"语言","figures.halls":"{n} 座工会培训馆","figures.modules":"{n} 个可寻址模块","figures.districts":"{n} 个区","figures.lessons":"{n} 个已编写的课程位","unit.levels":"级","unit.skills":"项技能","map.legend":"每座馆按所属区着色；身份由三字母代码承载。","honesty.taxonomy":"这是一份技术工种的分类体系，并非注册工会名册。没有任何工会审阅过它，也未指名任何地方分会。","honesty.modules":"模块数量是由已编写骨架生成的可寻址模块 ID，而非手写课程。","honesty.content":"课程内容为未经验证的通行做法，尚待熟练技工编写确认。","honesty.translation":"培训馆名称暂保留英文，待工种名称的审校译名确定后更新。","map.layers":"图层","map.layer.districts":"分区","map.layer.pipeline":"流水线状态","map.layer.modules":"模块图层","map.layer.stations":"训练工位","hall.rooms":"平面图","hall.stations":"本馆工位","hall.skills":"技能格栅","station.checklist":"检查清单","station.quiz":"情景考核","ui.close":"关闭","ui.search":"搜索培训馆","hall.enter3d":"打开 3D 环境","hall.flippedUnit":"翻转单元","view.campus":"园区视图","ui.walk":"步行","hint.campus":"点击场馆进入","hint.walk":"WASD 移动 · Esc 退出","view.region":"网络视图","figures.campuses":"{n} 个园区","room.finish":"地面饰面","geo.note":"方位为真实值；距离经压缩——标注为真实公里数","sim.start":"启动模拟器","sim.results":"成绩","sim.pass":"通过","sim.retry":"再试一次","sim.sound":"声音","sim.view":"视角","sim.choose":"选择模拟器","sim.operator":"询问操作员","progress.local":"进度仅保存在此设备上。","city.note":"城市图层：校园附近的真实地点（打开后可见各自的真实认定等级）；街道、桥梁与水体为示意","chapters.hall":"地区分会大厅","avatar.title":"角色","landing.nav.mission":"使命","landing.nav.how":"工作原理","landing.nav.investors":"投资者","landing.nav.partners":"合作伙伴","landing.nav.educators":"教育工作者","landing.nav.status":"状态","landing.hero.eyebrow":"AGI Future Foundation 的一项计划","landing.hero.title":"培养技工人才，仿佛<em>下一个世纪</em>就靠他们。","landing.hero.lede":"因为事实如此。为电网布线、焊接压力容器、捆扎吊装重物、运转工厂的人，正是未来一切实体建设的执行者——而他们接受的培训模式，却是为上一次工业革命设计的。","landing.hero.lede2":"SmartCiti.X：Trade Craft Academy 是一套面向 111 个行业工会的自适应培训系统：一座虚拟的工地之城，每项任务都精准设定在你现有能力的边缘，每一次指导决策都会自我说明理由，只有在你证明能够独立完成工作时才会颁发证书。","landing.facts.halls":"工会大厅，每个都配有平面图和 100 个等级","landing.facts.modules":"模块 ID，每一个都经过验证确保唯一","landing.facts.band":"每项任务都被调校到的成功区间","landing.facts.checks":"把关每次发布的自动化检查","landing.facts.defects":"在任何学员看到之前就已发现并修复的协议缺陷","landing.mission.kicker":"使命","landing.mission.h2":"技能型工作不是退路，而是根基。","landing.mission.p1":"两代人以来，技工培训一直被当作那些\"没走另一条路\"的人的出路。这种定位一直就是错的，而且很快就会变得代价高昂。数据中心需要电工，电气化需要线路工。地球上每一项气候承诺，归根结底都是对尚不存在的管道工、钢结构工和保温工的承诺。","landing.mission.p2":"AGI Future Foundation 致力于建设公共利益教育基础设施。Trade Craft Academy 是它对一个具体问题的回答：<b>如果智能系统现在能够教学，它们首先应该教什么？</b> 我们的答案是那些无法被自动化取代、也无法通过视频学会的工作——经过训练直至精通的实体技能工艺，规模之大是任何学徒制体系都未曾企及的。","landing.mission.h3":"我们对自己的要求","landing.mission.tick1":"<b>绝不无聊，绝不焦虑。</b>难度会按每项技能持续调节到当前能力的边缘。","landing.mission.tick2":"<b>每一个决策都会自我说明。</b>学员可以询问为何被分配某项任务，并从审计员所读的同一份记录中获得真实原因。","landing.mission.tick3":"<b>一张证书意味着实实在在的东西。</b>认证要求在关卡难度下、无辅助地展示真实能力，帮助买不到它。","landing.mission.tick4":"<b>系统对人负责。</b>教员可以override它，学员可以请求更轻松的一天，而与其适应得很糟，它宁可彻底停止自适应。","landing.how.kicker":"工作原理","landing.how.h2":"这是一件精密仪器，而不是一份播放列表。","landing.how.p":"大多数所谓\"自适应\"学习不过是固定序列外加一个难度旋钮。而这是一套真正的控制系统：它估算你的能力，把任务精准投放在能力边缘，并在颁发任何认证之前先验证这个估算本身是否成立。","landing.how.dial.h3":"难度旋钮","landing.how.dial.p":"学员画像把遥测数据——准确率、犹豫时长、求助次数、模拟器中的操控平顺度——转化为熟练度估算，闭环控制器把预测成功率保持在 <span class=\"mono\">0.70&ndash;0.85</span> 区间内。高于此区间会无聊，低于此区间会焦虑，两者都是失败，并都会在少数几次任务内被纠正。","landing.how.graph.h3":"技能图谱","landing.how.graph.p":"技能构成一张图谱，而非一份清单。某项技能上的证据会牵动它的前置技能，容易混淆的技能对会被刻意分开，三月学过的内容会在遗忘之前被重新拿出来复习。当学员卡住时，系统诊断的是<em>缺失了哪个前置技能</em>，而不是把同一个任务简单地加难重复。","landing.how.gate.h3":"认证关卡","landing.how.gate.p":"练习发生在区间中段，那正是学习真正发生的地方。认证则发生在区间顶端，无辅助、无提示——这是一次刻意的验证运行，因为练习难度永远无法证明真正的精通。认证是记录在一份只可追加、不可篡改的档案上的授予事件。","landing.how.coaches.h3":"陪练顾问","landing.how.coaches.p":"每个大厅都配有一位精通该行业的导师智能体，负责指导、讲解，并在现场出问题时上报给真人教员。但它们做不到的是改变你的难度、你的记录或你的认证——那是在代码层面强制执行的，而不是靠提示词去请求的。","landing.investors.kicker":"致投资者","landing.investors.h2":"这是基础设施，按基础设施定价。","landing.investors.p1":"技工人才的缺口不是一个营销概念，而是一道算术题。在每一个工业化经济体中，退休人数都在超过学徒补充人数，电气化和再工业化真正的制约因素是人，而不是资本。","landing.investors.p2":"我们已经建成的，正是最难建成的那部分：一套经过验证的课程账本、一套在仿真中校准并针对长期运行与对抗性失败做过加固的自适应控制系统、一层安全属性靠强制执行而非空口承诺的智能体系统，以及一套为多租户机构客户设计的安全模型。","landing.investors.p3":"我们尚未建成的是一门有收入的生意。我们仍处于发布前、试点前、认证前阶段，我们宁愿你在这里就了解这一点，而不是在尽职调查中才发现。","landing.investors.cta1":"索取技术简报","landing.investors.cta2":"查看尚未完成的部分","landing.investors.panel.h3":"资金投向","landing.investors.panel.tag":"资金用途","landing.investors.term.content.dt":"内容","landing.investors.term.content.dd":"为 33 个行业撰写的课程内容，由具备熟练工水平的从业者审核。这是单项开支中最大的一笔，也是无法走捷径的一项。","landing.investors.term.evidence.dt":"证据","landing.investors.term.evidence.dd":"一项采用真实学徒的阶梯楔形（stepped-wedge）评估研究。在它真正开展之前，我们所有的成效主张都只是仿真结果，我们会如实说明这一点。","landing.investors.term.compliance.dt":"合规","landing.investors.term.compliance.dd":"SOC 2 观察窗口期、无障碍审计与 VPAT，以及在做出任何认证声明之前逐个司法辖区的合规审查。","landing.investors.term.platform.dt":"平台","landing.investors.term.platform.dd":"身份认证、持久化存储、加密，以及公开发布所需要的运维层。","landing.partners.kicker":"致战略合作伙伴","landing.partners.h2":"工会、雇主，以及真正拥有工地的人。","landing.partners.p":"离开这些行业本身，这个平台就毫无价值。我们并不是要取代学徒制——我们是想为它提供检测手段、扩大它的覆盖面，并让一名一年级学徒能在真正算数之前，先在受限空间、带电配电盘或起重机驾驶室里练上一百次。","landing.partners.panel.unions.h3":"行业工会","landing.partners.panel.unions.tag":"课程主导权","landing.partners.panel.unions.p":"贵会的培训主管拥有本行业内容的所有权——标准、顺序、签核，都由你们决定。我们只提供引擎、模拟器和证据链。你们颁发的证书始终归你们所有；我们不会以你们的名义颁发任何资质，也永远不会这样做。","landing.partners.panel.employers.h3":"雇主与承包商","landing.partners.panel.employers.tag":"现场准备度","landing.partners.panel.employers.p":"在任何人真正踏入现场之前，先在这里彩排一遍具体的工地——入场培训、许可条件、危险巡查、真实的厂区布局。大多数事故都始于跨工种交接环节，我们把它当作一项有独立评估的、专门命名的技能来练习。","landing.partners.panel.tech.h3":"技术合作伙伴","landing.partners.panel.tech.tag":"互操作性","landing.partners.panel.tech.p":"一切都以 xAPI 1.0.3 格式发送到你们的 LRS。模块目录可导出为 JSON 或 CSV。智能体层注册在开放的智能体协议之上。我们更愿意与你们现有的系统记录集成，而不是自己另起一套系统记录。","landing.partners.cta":"开启合作对话","landing.educators.kicker":"致教育工作者与培训主管","landing.educators.h2":"判断权始终在你手中，它只负责记账。","landing.educators.p":"一套自适应系统应该让教员更强大，而不是变得多余。我们的系统设计成：需要判断力的决策留给你，需要记忆力的事情留给它——谁卡在哪里、谁的复习已经逾期、谁已经准备好接受测试，以及谁已经悄悄依赖帮助长达三周。","landing.educators.tick1":"<b>你随时可以override（覆盖）。</b>把任意学员固定在任意等级。override 会被记录下来，系统会自动降低这条证据的权重，因为它知道这已经不是一次干净的测量了。","landing.educators.tick2":"<b>你能看到推理过程。</b>每一个下发的任务都会附带它被选中的理由。如果你不认同系统的判断，你可以准确看到它当时的判断依据及原因。","landing.educators.tick3":"<b>公平性是被持续监控的，而不是空口断言的。</b>系统会比较不同站点、语言、设备类型和年龄段之间的结果差异。差距一旦超过 10% 就会自动开工单并阻止发布——而悄悄调整某个群体的设置以让差距\"消失\"，这个行为本身也会被标记出来。","landing.educators.tick4":"<b>它宁可停止，也不会去瞎猜。</b>一旦校准出现漂移，或某个群体明显吃力，自适应就会停止，所有人都会被切换到固定难度，直到有人来检查为止。","landing.educators.cta":"咨询试点项目","landing.educators.panel.h3":"学员永远不会失去的东西","landing.educators.panel.tag":"数据权利","landing.educators.panel.p1":"培训记录以假名形式保存；与真实个人的关联信息存放在一个独立的服务中，没有任何常设角色能够读取它。\"擦除\"操作会切断这个关联，这正是使它真实有效、而非流于表面的原因。","landing.educators.panel.p2":"情绪状态信号——也就是难度旋钮所使用的心流与挫败感估算值——是我们所持有数据中保护级别<em>最高</em>的一类，而不是最低的。它们仅保留 90 天，绝不会出现在任何导出数据中，也绝不会让雇主看到。","landing.status.kicker":"状态——刻意公开","landing.status.h2":"哪些已经建成，哪些还没有，以及我们绝不会声称的东西。","landing.status.p":"教育科技行业存在一个可信度问题，因为它习惯用现在时来描述意图。这里是真实的状态，并且同一张表格会发给每一位询问的投资人、合作伙伴和机构。","landing.status.th.area":"领域","landing.status.th.state":"状态","landing.status.th.detail":"详情","landing.status.row1.area":"自适应控制系统","landing.status.row1.pill":"已建成并测试","landing.status.row1.detail":"已在仿真环境中完成校准；在六种学员原型上，命中目标区间的表现比固定或随机难度好约 6 倍。","landing.status.row2.area":"模块目录","landing.status.row2.pill":"已建成并验证","landing.status.row2.detail":"从 25,875 个撰写对象生成了 11,000,000 个模块 ID，每一个都在整个总体范围内（而不是抽样）被证明是唯一的。","landing.status.row3.area":"智能体安全层","landing.status.row3.pill":"已建成并测试","landing.status.row3.detail":"指导型智能体无法写入控制状态；这一点在两个独立的层面被强制执行，并针对刻意\"作恶\"的智能体做过验证。","landing.status.row4.area":"安全模型","landing.status.row4.pill":"已建成并测试","landing.status.row4.detail":"租户隔离、默认拒绝的权限模型、限时身份访问、按数据类别设定的保留期与擦除机制。","landing.status.row5.area":"课程内容","landing.status.row5.pill":"占位内容","landing.status.row5.detail":"<b>11,000,000 这个数字统计的是可寻址的模块 ID，而不是手写的课程内容。</b>结构、排序逻辑和评估逻辑都是真实且已验证的；目录是从 25,875 个撰写对象生成的，课程正文仍在等待具备熟练工水平的从业者来撰写。","landing.status.row6.area":"行业分类体系","landing.status.row6.pill":"我们的分类，非官方分类","landing.status.row6.detail":"这 111 个大厅是我们自己整理的技能行业分类体系。它们不是经过注册的工会分会，也没有任何工会审核过这份名单，按辖区分组的方式也是我们自定的。","landing.status.row7.area":"成效证据","landing.status.row7.pill":"尚未确立","landing.status.row7.detail":"迄今为止的所有结果都来自仿真。在采用真实学徒的阶梯楔形试验真正开展之前，任何关于学习成效的说法都缺乏支撑。","landing.status.row8.area":"资质认证与工会背书","landing.status.row8.pill":"无","landing.status.row8.detail":"我们不持有任何资质认证，也没有任何工会为本平台背书。此处的一切都不构成一项被认可的资质证明。","landing.status.row9.area":"生产平台","landing.status.row9.pill":"尚未建成","landing.status.row9.detail":"身份认证、加密、持久化存储、备份和事件响应机制，都是公开发布前必需的，但目前尚不存在。","landing.status.note":"通过仿真、长时间浸泡测试和对抗性测试，我们已经发现并修复了十七个协议缺陷——其中包括一条实际上永远无法真正认证任何人的认证路径、一个可以永久损坏学员记录的单一畸形事件，以及一条被规定、被认为已经生效、但实际上从未运行过一次的帮助淡出规则。这份清单也包括我们在自己检查中发现的问题，比如一个基于猜测常量构建的布局断言，该常量偏差高达 43%，却在四个标签溢出的情况下依然通过测试。我们公开这份清单，是因为一个从未在自身发现过缺陷的系统，其实根本没有认真检查过自己。","landing.footer.disclaimer":"<b>请务必阅读这一部分。</b>本页面上的任何内容都不构成被认可的资质、认证，或任何行业工会或发证机构的背书。培训内容属于一般良好实践，并未依据任何司法辖区的规范进行核实。安全关键性工作必须在真实工地由合格人员教授并签字确认。","map.key.live":"上线 — 已撰写、已校准、正在提供","map.key.calibrating":"校准中 — 正在提供，难度仍在调整","map.key.schema_ok":"结构合格 — 结构有效，尚未校准","map.key.draft":"草稿 — 尚未提供给任何人","map.nav.aria":"其他界面","map.nav.3d":"3D 环境","map.nav.interactive":"交互地图","map.nav.geomap":"网络地理图","map.nav.dashboard":"网络仪表盘","map.nav.wiki":"wiki","map.entry_road":"网络入口","map.titleblock.title":"网络规划图 · 工会大厅","map.titleblock.sheet":"图纸","map.titleblock.rev":"版本","map.titleblock.halls":"大厅","map.titleblock.modules":"模块","map.titleblock.issued":"发布状态","map.titleblock.review":"审核中","map.meta.halls":"工会大厅","map.meta.modules":"规划图中的模块","map.meta.live":"上线","map.meta.sheet":"图纸","map.footer.p1":"<b>此规划图上的每一个数字都读取自模块注册表</b> — 大厅数、模块数和流水线状态都是软件包本身的真实值，而不是示意性插图。地理布局是示意性的：色带只表示大厅是如何分组的，并非实测位置。","map.footer.p2":"<b>室内布局是功能性方案，而非实地勘测。</b>每个大厅的房间来自该大厅实际教授的十一条技能主线，只有当某个行业自身的重点描述提到某种设施时，房间才会获得该行业的专用装置——焊接大厅因为其技能要求而配有隔间和排烟系统，石膏板大厅则没有。<b>目前没有为任何大厅收集地址数据</b>，因此每张规划图都留出一个空白的场地信息栏，而不是编造一个街道地址。每张规划图上的调试状态，都读取自该大厅上线模块所占的比例。","map.footer.p3":"这是按辖区分组的网络大厅规划图，而非单一校区场地——每个辖区条带都标明其所属的已建成校区。此规划图上的任何内容都不构成资质认证或工会背书，课程内容属于尚未核实的一般实践，仍在等待从业者撰写。","map.detail.no_address":"场地地址 — 未记录","map.detail.of":"共","map.detail.modules_word":"个模块","map.detail.fixture":"行业专用装置","map.aria.plan":"网络规划图：{n} 个工会大厅，按八个辖区分组，分布在 {c} 个已建成校区","map.aria.floor":"{name} 大厅平面图：{n} 个房间","map.aria.hall":"{name} — {district} 辖区，网格 {ref}","map.page_title":"网络规划图"},"districts":{"structural":{"name":"结构","tagline":"钢结构、焊缝、吊装及其承载的荷载"},"envelope":{"name":"围护与装修","tagline":"骨架与风雨之间的一切"},"systems":{"name":"建筑系统","tagline":"电力、工艺、空气、控制与数据"},"energy":{"name":"能源与公用事业","tagline":"发电、配电、供水与抢修作业"},"earthworks":{"name":"土方与机械","tagline":"土地、机械、通道与运输"},"industry":{"name":"重工业","tagline":"流程工厂、船舶、金属与机加工车间"},"transport":{"name":"交通与出行","tagline":"铁路、航空、港口与车队"},"control":{"name":"测量、安全与环境","tagline":"放线定位、安全防护与清洁治理之所"}},"strands":{"safety":"安全","layout":"放线","materials":"材料","tools":"工具","machines":"机械","procedure":"工序","inspection":"检验","documentation":"文档","coordination":"协调","troubleshooting":"故障排查","leadership":"带班领导"},"tiers":{"fundamentals":"基础","applied":"应用","mastery":"精通"},"states":{"draft":"草稿","schema_ok":"结构合格","calibrating":"校准中","live":"已上线"}}}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
for (const h of D.halls) h.rooms = D.layouts[h.lay].map((r) => ({
  ...r, label: D.roomDefs[r.strand].label,
  purpose: D.roomDefs[r.strand].purpose }));
const params = new URLSearchParams(location.search);
const STATE_COLORS = {live:'var(--good)', calibrating:'var(--steel)', schema_ok:'var(--warn)', draft:'var(--rule)'};
const STATES = ['live','calibrating','schema_ok','draft'];
let loc = D.i18n[params.get('lang')] ? params.get('lang') : 'en';
let query = '';
const t = (k) => D.i18n[loc].strings[k] ?? D.i18n.en.strings[k] ?? k;
const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (m,k) => k in v ? v[k] : m);
const F = (n) => n.toLocaleString('en-US');
const dname = (k) => D.i18n[loc].districts[k]?.name ?? D.districts[k].name;
const dtag = (k) => D.i18n[loc].districts[k]?.tagline ?? D.districts[k].tagline;

function liveShare(h){ const c=h.census; const tot=STATES.reduce((a,s)=>a+c[s],0); return c.live/tot; }

function render(){
  const i = D.i18n[loc];
  document.documentElement.lang = loc;
  document.documentElement.dir = i.dir;
  document.getElementById('figs').innerHTML =
    `<span><b>${F(D.ledger.halls)}</b> ${fmt(t('figures.halls'),{n:''}).trim()}</span>`+
    `<span><b>${F(D.ledger.total_modules)}</b> ${fmt(t('figures.modules'),{n:''}).trim()}</span>`+
    `<span><b>${D.ledger.districts}</b> ${fmt(t('figures.districts'),{n:''}).trim()}</span>`;
  const LAYERS = [['districts','map.layer.districts'],['pipeline','map.layer.pipeline'],
                  ['modules','map.layer.modules'],['stations','map.layer.stations']];
  document.getElementById('layers').innerHTML =
    `<span class="lbl">${t('map.layers')}:</span>` +
    LAYERS.map(([k,lk]) => `<label class="tgl"><input type="checkbox" data-l="${k}" ${document.body.classList.contains('L-'+k)?'checked':''}>${t(lk)}</label>`).join('') +
    `<select id="lang" aria-label="${t('language.select')}">` +
    Object.entries(D.i18n).map(([c,v]) => `<option value="${c}" ${c===loc?'selected':''}>${v.language}</option>`).join('') + `</select>` +
    `<input id="q" type="search" value="${query.replace(/"/g,'&quot;')}" placeholder="${t('ui.search')}" aria-label="${t('ui.search')}"
      style="background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;width:170px">`;
  document.getElementById('legend').innerHTML =
    STATES.map(s => `<span><span class="sw" style="background:${STATE_COLORS[s]}"></span>${i.states[s]}</span>`).join('') +
    `<span><span class="sw" style="background:var(--mark);border-radius:50%"></span>${t('map.layer.stations')}</span>`;
  document.getElementById('campus').innerHTML = Object.entries(D.campuses).map(([ck, camp]) => `
    <div class="campusgrp">
      <h2 class="campushdr"><span>${camp.name}</span>
        <em>${camp.city}, ${camp.region} · ${camp.halls.length} · ${camp.tagline}</em></h2>
      <div class="campusbody">` +
    camp.districts.map(k => { const d = D.districts[k]; return `
    <section class="district" style="--hue:${d.hue}">
      <h2 style="border-color:hsl(${d.hue} 62% 58%)">${dname(k)} · ${d.halls.length}</h2>
      <p class="tag">${dtag(k)}</p>
      <div class="halls">` +
      d.halls.map(slug => { const h = D.halls.find(x=>x.slug===slug);
        const pipe = document.body.classList.contains('L-pipeline');
        const hueOn = document.body.classList.contains('L-districts');
        const bg = pipe ? `background:color-mix(in oklab, var(--good) ${Math.round(liveShare(h)*38)}%, var(--sunk))` : '';
        const bd = hueOn ? `border-inline-start-color:hsl(${d.hue} 62% 55%)` : '';
        const bar = STATES.map(s => `<i style="width:${100*h.census[s]/100}%;background:${STATE_COLORS[s]}"></i>`).join('');
        const badge = h.stations.length ? `<span class="badge">${h.stations.length}</span>` : '';
        return `<button class="hall" data-slug="${slug}" style="${bg};${bd}">${badge}<span class="nm">${h.name}</span><span class="stbar">${bar}</span></button>`;
      }).join('') + `</div></section>`; }).join('') +
    `</div></div>`).join('');
  applyFilter();
  document.getElementById('honesty').textContent =
    t('honesty.taxonomy') + ' ' + t('honesty.modules') + ' ' + t('honesty.content');
  document.getElementById('close').textContent = t('ui.close');
}

// pipeline_state, mirrored from the pack rule (the build asserts agreement
// across every band boundary, so this cannot silently drift).
function pipeline(idx, lv) {
  const a = idx < 18 ? [88, 94, 99] : idx < 33 ? [70, 84, 99]
          : idx < 66 ? [44, 66, 84] : [22, 44, 70];
  return lv <= a[0] ? 'live' : lv <= a[1] ? 'calibrating'
       : lv <= a[2] ? 'schema_ok' : 'draft';
}

function modTable(h){
  const i = D.i18n[loc];
  const rows = Object.entries(D.strandmods).map(([sk, sm]) => {
    const x = sm.samples[0];
    const id = 'u' + String(h.index).padStart(3,'0') + '.' + x.suffix;
    return `<tr><td>${i.strands[sk]}</td>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${id}</td>
      <td style="text-align:end">${sm.d_from}–${sm.d_to}</td>
      <td style="text-align:end">${F(sm.modules)}</td>
      <td>${i.states[pipeline(h.index, x.level)]}</td></tr>`;
  }).join('');
  return `<table style="width:100%;border-collapse:collapse;font-size:12.5px">
    <tbody>${rows}</tbody></table>
    <style>#pbody td{border-top:1px solid var(--rule);padding:5px 7px;color:var(--muted)}</style>`;
}

function applyFilter(){
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.hall').forEach(el => {
    const h = D.halls.find(x=>x.slug===el.dataset.slug);
    el.style.display = (!q || (h.name+' '+h.focus+' '+h.slug).toLowerCase().includes(q)) ? '' : 'none';
  });
}

function planSVG(h){
  const U = 26, W = 12*U, H = h.depth*U;
  const dh = D.districts[h.district].hue;
  let dots = '';
  const stns = h.stations.map(id => D.stations[id]);
  const byRoom = {};
  stns.forEach(s => { (byRoom[s.room] ??= []).push(s); });
  const rects = h.rooms.map(r => {
    const list = byRoom[r.label] ?? [];
    const dot = list.map((s,j) =>
      `<circle cx="${r.x*U + (j+1)*(r.w*U)/(list.length+1)}" cy="${(r.y+r.h/2)*U + 6}" r="5.5" fill="var(--mark)"><title>${s.name}</title></circle>`).join('');
    // the tools room carries its district crib: the pegboard drawn in place
    const crib = r.strand === 'tools'
      ? `<rect x="${(r.x+r.w)*U-9}" y="${r.y*U+5}" width="5" height="${r.h*U-10}" rx="1.5"
          fill="var(--mark)" opacity=".8"><title>${D.tools.cribs[h.district].name} · ${D.tools.cribs[h.district].tools.length}</title></rect>`
      : '';
    return `<g><rect x="${r.x*U+1}" y="${r.y*U+1}" width="${r.w*U-2}" height="${r.h*U-2}" rx="3"
      fill="hsl(${dh} 25% 16%)" stroke="hsl(${dh} 30% 32%)"/>
      <title>${r.purpose}</title>
      <text x="${r.x*U+7}" y="${r.y*U+16}" font-size="10.5" fill="var(--ink)">${r.label}</text>
      <text x="${r.x*U+7}" y="${r.y*U+29}" font-size="9" fill="var(--muted)">${D.i18n[loc].strands[r.strand]}</text>${crib}${dot}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--sunk);border-radius:8px">${rects}</svg>`;
}

function openHall(slug){
  const h = D.halls.find(x=>x.slug===slug);
  const i = D.i18n[loc];
  const tot = STATES.reduce((a,s)=>a+h.census[s],0);
  const cbar = STATES.map(s=>`<i style="width:${100*h.census[s]/tot}%;background:${STATE_COLORS[s]}"></i>`).join('');
  const ckey = STATES.map(s=>`<span>${i.states[s]}: ${h.census[s]} ${t('unit.levels')}</span>`).join('');
  const stns = h.stations.map(id => D.stations[id]).map(s => `
    <div class="stn" id="${s.station_id}">
      <button data-st="${s.station_id}"><span class="dot"></span><b>${s.name}</b>
        <span class="rm">${s.room} · ${i.tiers[s.tier]}</span></button>
      <div class="body"><p>${s.lesson}</p>
        <b>${t('station.checklist')}</b><ul>${s.checklist.map(c=>`<li>${c}</li>`).join('')}</ul>
        <div class="q"><b>${t('station.quiz')}:</b> ${s.quiz.question}
          ${s.quiz.options.map((o,j)=>`<button class="opt" data-ok="${o.correct?1:0}">${o.label}</button>`).join('')}</div>
      </div></div>`).join('');
  const lat = `<div class="lattice"><div class="hd"></div>` +
    Object.entries(i.tiers).map(([,v])=>`<div class="hd">${v}</div>`).join('') +
    Object.entries(i.strands).map(([sk,sv]) => `<div class="hd">${sv}</div>` +
      ['fundamentals','applied','mastery'].map(tier => {
        const seeded = h.stations.some(id => D.stations[id].strand===sk && D.stations[id].tier===tier);
        return `<div class="${seeded?'on':''}">${seeded?'●':'·'}</div>`; }).join('')).join('');
  // the other three per-hall facts the 3D app's own header shows: a
  // simulator seat and a Schools flipped unit are not held by every hall
  // (45/111 each, sims/ and schools/), so each badge appears only when
  // this hall's own record has one — never invented for a hall without
  // one. Regional chapter seats are an Academy training structure every
  // hall holds at every campus, never a place (a stat chip, not a link).
  const simChip = h.sim
    ? `<a class="chip" href="trade_craft_3d.html?hall=${h.slug}&lang=${loc}"
        style="color:var(--warn);border-color:var(--warn)">▶ ${h.sim.name}</a>` : '';
  const schoolsChip = h.schoolsUnit
    ? `<a class="chip" href="trade_craft_3d.html?hall=${h.slug}&lang=${loc}"
        style="color:var(--mark);border-color:var(--mark)">🎓 ${t('hall.flippedUnit')}</a>` : '';
  const home = D.chapters.of[h.slug];
  const chapterChip = `<span class="chip" title="${D.chapters.honesty}">⌂ `
    + Object.entries(D.chapters.regions)
        .map(([ck, ab]) => ck === home ? `<b>${ab}</b>` : ab).join(' · ') + '</span>';
  history.replaceState(null, '', `?hall=${slug}&lang=${loc}`);
  document.getElementById('pbody').innerHTML = `
    <h2>${h.name}</h2><p class="focus">${h.focus}</p>
    <span class="chip">${dname(h.district)}</span>
    <span class="chip">${Object.values(D.campuses).find(c=>c.halls.includes(h.slug)).city}</span>
    <span class="chip">${F(h.lessons)} · ${fmt(t('figures.lessons'),{n:''}).trim()}</span>
    <span class="chip">${fmt(t('figures.modules'),{n:F(h.modules)})}</span>
    <a class="chip" id="to3d" href="trade_craft_3d.html?hall=${h.slug}&lang=${loc}" style="color:var(--steel);border-color:var(--steel)">⬡ ${t('hall.enter3d')}</a>
    ${simChip}${schoolsChip}${chapterChip}
    <h3>${t('map.layer.pipeline')}</h3><div class="cbar">${cbar}</div><div class="ckey">${ckey}</div>
    <h3>${t('hall.rooms')}</h3>${planSVG(h)}
    <h3>🧰 ${D.tools.cribs[h.district].name}</h3>
    <div>${D.tools.cribs[h.district].tools.map(tl =>
      `<span class="chip" title="${tl.use}">${tl.glyph} ${tl.name}</span>`).join(' ')}</div>
    <p style="color:var(--muted);font-size:11.5px;margin-top:6px">${D.tools.drill} · ${D.tools.honesty}</p>
    ${stns ? `<h3>${t('hall.stations')} (${h.stations.length})</h3>${stns}` : ''}
    <h3>${t('hall.skills')}</h3>${lat}
    <h3>${t('map.layer.modules')}</h3>${modTable(h)}`;
  document.body.classList.add('open');
}

document.addEventListener('click', (e) => {
  const hall = e.target.closest('.hall');
  if (hall) return openHall(hall.dataset.slug);
  if (e.target.closest('#close') || e.target.id === 'ov')
    return document.body.classList.remove('open');
  const st = e.target.closest('.stn > button');
  if (st) return st.parentElement.classList.toggle('open');
  const opt = e.target.closest('.opt');
  if (opt) { opt.parentElement.querySelectorAll('.opt').forEach(o =>
      o.classList.toggle('ok', o.dataset.ok==='1'));
    if (opt.dataset.ok!=='1') opt.classList.add('bad'); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset?.l) { document.body.classList.toggle('L-'+e.target.dataset.l, e.target.checked); render(); }
  if (e.target.id === 'lang') { loc = e.target.value; history.replaceState(null, '', `?lang=${loc}`); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { query = e.target.value; applyFilter(); }
});
render();
if (params.get('hall') && D.halls.some(h => h.slug === params.get('hall')))
  openHall(params.get('hall'));
</script>
</body>
</html>
